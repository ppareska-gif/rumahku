<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>RumahKu - Manajemen Rumah Tangga & Keluarga</title>

  <!-- Dynamic PWA Manifest & Mobile Meta -->
  <link id="pwa-manifest-link" rel="manifest" href="" />
  <meta name="theme-color" id="meta-theme-color" content="#214E2A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="RumahKu" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Inline SVG Favicon & Apple Touch Icon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23214E2A'/%3E%3Cpath d='M32 14L12 30h6v18a2 2 0 002 2h8V38h8v12h8a2 2 0 002-2V30h6L32 14z' fill='%23DFC15B'/%3E%3C/svg%3E" />
  <link id="apple-touch-icon-link" rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23214E2A'/%3E%3Cpath d='M90 40L34 85h17v50a6 6 0 006 6h22v-34h22v34h22a6 6 0 006-6V85h17L90 40z' fill='%23DFC15B'/%3E%3C/svg%3E" />

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (window.tailwind) {
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
            },
            colors: {
              cream: '#FAF8F4',
              sand: '#F3EFE6',
              forest: {
                DEFAULT: '#214E2A',
                light: '#2E6B3A',
                dark: '#16361D',
                soft: '#E8F1EA'
              },
              gold: {
                DEFAULT: '#C9A227',
                light: '#DFC15B',
                soft: '#F9F3DF'
              }
            }
          }
        }
      };
    }
  </script>

  <!-- External Libraries (Lucide, Chart.js, SheetJS XLSX, Firebase v10.14.1 Compat) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #FAF8F4;
      color: #1F2937;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      transition: background-color 0.22s ease, color 0.22s ease;
    }
    html.dark body {
      background-color: #121513;
      color: #F3F4F6;
    }
    html.text-large {
      font-size: 18px;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .card-surface {
      background-color: #FFFFFF;
      border: 1px solid rgba(33, 78, 42, 0.09);
      box-shadow: 0 2px 10px rgba(33, 78, 42, 0.04);
    }
    html.dark .card-surface {
      background-color: #1B201D;
      border-color: rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
    }
    .safe-pb {
      padding-bottom: calc(5.75rem + env(safe-area-inset-bottom));
    }
    @media (min-width: 768px) {
      .safe-pb {
        padding-bottom: 2.5rem;
      }
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in {
      animation: fadeSlideUp 0.2s ease-out forwards;
    }
  </style>
</head>
<body class="antialiased selection:bg-forest selection:text-white">

  <!-- ==================== TOAST NOTIFICATION CONTAINER ==================== -->
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] w-[92%] max-w-md pointer-events-none flex flex-col gap-2"></div>

  <!-- ==================== 1. AUTH GATE (LOGIN / DAFTAR AKUN KELUARGA) ==================== -->
  <div id="auth-screen" class="hidden min-h-screen flex flex-col justify-center items-center px-4 py-8 bg-cream dark:bg-[#121513]">
    <div class="w-full max-w-md card-surface rounded-3xl p-6 sm:p-8 animate-in">
      <div class="flex flex-col items-center text-center mb-6">
        <div class="w-16 h-16 rounded-2xl bg-forest text-white flex items-center justify-center shadow-lg mb-3">
          <i data-lucide="home" class="w-8 h-8 text-gold-light"></i>
        </div>
        <h1 class="text-2xl font-extrabold tracking-tight text-forest dark:text-emerald-400">RumahKu</h1>
        <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Asisten Keuangan, Tagihan, Tugas & Stok Keluarga</p>
      </div>

      <!-- Auth Mode Switcher -->
      <div class="grid grid-cols-2 gap-1.5 p-1 bg-sand dark:bg-black/30 rounded-2xl mb-5">
        <button id="tab-login-btn" type="button" onclick="switchAuthTab('login')" class="py-2.5 text-xs font-bold rounded-xl bg-forest text-white shadow-sm transition">
          Masuk Keluarga
        </button>
        <button id="tab-register-btn" type="button" onclick="switchAuthTab('register')" class="py-2.5 text-xs font-bold rounded-xl text-gray-600 dark:text-gray-300 transition">
          Buat Akun Baru
        </button>
      </div>

      <!-- Login Form -->
      <form id="form-login" onsubmit="handleFamilyLogin(event)" class="space-y-3.5 text-xs">
        <div>
          <label class="block font-bold text-gray-700 dark:text-gray-200 mb-1">Email / Username Keluarga</label>
          <input type="text" id="login-account-id" required placeholder="Contoh: keluargabudi atau budi@rumahku.id"
            class="w-full px-3.5 py-3 rounded-2xl bg-cream dark:bg-black/30 border border-gray-200 dark:border-gray-700 text-sm focus:outline-none focus:border-forest" />
        </div>
        <div>
          <label class="block font-bold text-gray-700 dark:text-gray-200 mb-1">Kata Sandi Akun Keluarga</label>
          <input type="password" id="login-account-pass" required placeholder="Masukkan kata sandi..."
            class="w-full px-3.5 py-3 rounded-2xl bg-cream dark:bg-black/30 border border-gray-200 dark:border-gray-700 text-sm focus:outline-none focus:border-forest" />
        </div>
        <button id="btn-login-submit" type="submit"
          class="w-full py-3.5 rounded-2xl bg-forest hover:bg-forest-light text-white font-extrabold text-sm shadow-md flex items-center justify-center gap-2 transition">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          <span>Masuk ke RumahKu</span>
        </button>
      </form>

      <!-- Register Form -->
      <form id="form-register" onsubmit="handleFamilyRegister(event)" class="hidden space-y-3 text-xs">
        <div>
          <label class="block font-bold text-gray-700 dark:text-gray-200 mb-1">Nama Keluarga</label>
          <input type="text" id="reg-family-name" required placeholder="Contoh: Keluarga Budi Santoso"
            class="w-full px-3.5 py-2.5 rounded-2xl bg-cream dark:bg-black/30 border border-gray-200 dark:border-gray-700 text-sm" />
        </div>
        <div>
          <label class="block font-bold text-gray-700 dark:text-gray-200 mb-1">Email / Username Login Keluarga</label>
          <input type="text" id="reg-account-id" required placeholder="Contoh: keluargabudi"
            class="w-full px-3.5 py-2.5 rounded-2xl bg-cream dark:bg-black/30 border border-gray-200 dark:border-gray-700 text-sm" />
        </div>
        <div>
          <label class="block font-bold text-gray-700 dark:text-gray-200 mb-1">Kata Sandi Akun Keluarga</label>
          <input type="password" id="reg-account-pass" required minlength="4" placeholder="Minimal 4 karakter"
            class="w-full px-3.5 py-2.5 rounded-2xl bg-cream dark:bg-black/30 border border-gray-200 dark:border-gray-700 text-sm" />
        </div>
        <div class="grid grid-cols-2 gap-2.5 pt-1">
          <div>
            <label class="block font-bold text-gray-700 dark:text-gray-200 mb-1">Nama Admin Utama</label>
            <input type="text" id="reg-admin-name" required value="Ayah"
              class="w-full px-3 py-2.5 rounded-2xl bg-cream dark:bg-black/30 border border-gray-200 dark:border-gray-700 text-sm" />
          </div>
          <div>
            <label class="block font-bold text-gray-700 dark:text-gray-200 mb-1">PIN/Sandi Admin</label>
            <input type="text" id="reg-admin-pass" value="1234" placeholder="1234"
              class="w-full px-3 py-2.5 rounded-2xl bg-cream dark:bg-black/30 border border-gray-200 dark:border-gray-700 text-sm" />
          </div>
        </div>
        <button id="btn-register-submit" type="submit"
          class="w-full py-3.5 rounded-2xl bg-forest hover:bg-forest-light text-white font-extrabold text-sm shadow-md flex items-center justify-center gap-2 transition">
          <i data-lucide="sparkles" class="w-4 h-4 text-gold-light"></i>
          <span>Buat Rumah Baru</span>
        </button>
      </form>

      <div class="mt-5 pt-4 border-t border-gray-100 dark:border-gray-800 flex flex-col gap-2">
        <button type="button" onclick="enterDemoMode()"
          class="w-full py-2.5 rounded-2xl bg-gold-soft dark:bg-amber-950/50 text-amber-900 dark:text-amber-300 text-xs font-bold hover:opacity-90 transition">
          Coba Mode Demo Tanpa Akun
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== 2. PROFILE PICKER ("SIAPA YANG MASUK?") ==================== -->
  <div id="profile-picker-screen" class="hidden fixed inset-0 z-50 bg-cream/95 dark:bg-[#121513]/95 backdrop-blur-md flex flex-col justify-center items-center px-4 py-8 overflow-y-auto">
    <div class="w-full max-w-md card-surface rounded-3xl p-6 sm:p-8 animate-in">
      <div class="flex items-center justify-between mb-4">
        <span id="picker-sync-badge" class="inline-flex items-center gap-1.5 text-[11px] font-bold text-gray-500">
          <span class="w-2 h-2 rounded-full bg-amber-500"></span> Mode Lokal
        </span>
        <button type="button" onclick="logoutFamilyAccount()" class="text-xs font-bold text-red-500 hover:underline">
          Ganti Akun Keluarga
        </button>
      </div>

      <div class="text-center mb-6">
        <p id="picker-family-title" class="text-xs font-extrabold uppercase tracking-wider text-forest dark:text-emerald-400">Keluarga Harmoni</p>
        <h2 class="text-xl font-extrabold text-gray-900 dark:text-white mt-1">Siapa yang masuk?</h2>
        <p class="text-xs text-gray-500 mt-1">Pilih profil Anda untuk mencatat dan memantau aktivitas keluarga</p>
      </div>

      <div id="profile-picker-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-4"></div>

      <!-- Password Verification Form -->
      <form id="profile-pass-form" onsubmit="verifyProfilePassword(event)" class="hidden p-4 rounded-2xl bg-cream dark:bg-black/30 border border-forest/20 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold">Kata Sandi untuk <strong id="selected-picker-name" class="text-forest dark:text-emerald-400">Ayah</strong></span>
          <button type="button" onclick="cancelProfilePassword()" class="text-xs text-gray-400 hover:text-gray-600">Batal</button>
        </div>
        <input type="password" id="profile-pass-input" required placeholder="Masukkan kata sandi/PIN profil..."
          class="w-full px-3.5 py-2.5 rounded-xl bg-white dark:bg-[#1B201D] border border-gray-200 dark:border-gray-700 text-sm font-bold text-center tracking-widest" />
        <button type="submit" class="w-full py-2.5 rounded-xl bg-forest text-white text-xs font-extrabold shadow-sm">
          Buka Profil
        </button>
      </form>
    </div>
  </div>

  <!-- ==================== 3. MAIN APPLICATION SHELL (MOBILE / TABLET / DESKTOP PC) ==================== -->
  <div id="app-shell" class="hidden min-h-screen w-full flex flex-col md:flex-row relative">

    <!-- TABLET RAIL (768px-1023px) & DESKTOP SIDEBAR (>=1024px) -->
    <aside class="hidden md:flex md:w-20 lg:w-64 md:fixed md:inset-y-0 md:left-0 z-30 bg-white/95 dark:bg-[#181D1A]/95 backdrop-blur-md border-r border-forest/10 dark:border-white/10 flex-col justify-between p-3 lg:p-5 transition-all">
      <div class="space-y-4">
        <!-- Brand Header (Clickable -> Beranda) -->
        <button type="button" onclick="navigateTo('beranda')" title="Kembali ke Beranda"
          class="w-full flex items-center justify-center lg:justify-start gap-3 text-left group cursor-pointer active:scale-95 transition-transform focus:outline-none">
          <div class="w-11 h-11 rounded-2xl bg-forest group-hover:bg-forest-light text-white flex items-center justify-center shadow-sm shrink-0 transition-colors">
            <i data-lucide="home" class="w-5 h-5 text-gold-light"></i>
          </div>
          <div class="hidden lg:block min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="font-extrabold text-lg tracking-tight text-forest dark:text-emerald-400">RumahKu</span>
              <span id="sidebar-sync-pill" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300">
                <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span> Lokal
              </span>
            </div>
            <p id="sidebar-family-name" class="text-xs text-gray-500 dark:text-gray-400 truncate">Keluarga Harmoni</p>
          </div>
        </button>

        <!-- Primary Quick Action CTA -->
        <button type="button" onclick="openTransactionModal()" title="Catat Transaksi Baru"
          class="w-full py-3 px-2 lg:px-4 rounded-2xl bg-forest hover:bg-forest-light text-white font-bold text-xs shadow-md shadow-forest/20 flex items-center justify-center gap-2 active:scale-95 transition">
          <i data-lucide="plus" class="w-4 h-4 text-gold-light shrink-0"></i>
          <span class="hidden lg:inline">Catat Transaksi</span>
        </button>

        <!-- Vertical Navigation Links -->
        <nav class="space-y-1.5 pt-1">
          <button type="button" onclick="navigateTo('beranda')" data-nav="beranda" class="nav-btn w-full flex flex-col lg:flex-row items-center justify-center lg:justify-start gap-1 lg:gap-3 px-2 lg:px-3.5 py-2.5 rounded-2xl transition">
            <i data-lucide="layout-grid" class="w-5 h-5 shrink-0"></i>
            <span class="text-[10px] lg:text-xs">Beranda</span>
          </button>
          <button type="button" onclick="navigateTo('keuangan')" data-nav="keuangan" class="nav-btn w-full flex flex-col lg:flex-row items-center justify-center lg:justify-start gap-1 lg:gap-3 px-2 lg:px-3.5 py-2.5 rounded-2xl transition relative">
            <i data-lucide="wallet" class="w-5 h-5 shrink-0"></i>
            <span class="text-[10px] lg:text-xs flex-1 text-center lg:text-left">Keuangan</span>
            <span id="sidebar-bill-badge" class="hidden lg:inline-flex px-2 py-0.5 rounded-full bg-red-100 text-red-700 text-[10px] font-extrabold">0</span>
          </button>
          <button type="button" onclick="navigateTo('kalender')" data-nav="kalender" class="nav-btn w-full flex flex-col lg:flex-row items-center justify-center lg:justify-start gap-1 lg:gap-3 px-2 lg:px-3.5 py-2.5 rounded-2xl transition">
            <i data-lucide="calendar-days" class="w-5 h-5 shrink-0"></i>
            <span class="text-[10px] lg:text-xs">Kalender</span>
          </button>
          <button type="button" onclick="navigateTo('rumah')" data-nav="rumah" class="nav-btn w-full flex flex-col lg:flex-row items-center justify-center lg:justify-start gap-1 lg:gap-3 px-2 lg:px-3.5 py-2.5 rounded-2xl transition relative">
            <i data-lucide="package-check" class="w-5 h-5 shrink-0"></i>
            <span class="text-[10px] lg:text-xs flex-1 text-center lg:text-left">Rumah</span>
            <span id="sidebar-lowstock-badge" class="hidden lg:inline-flex px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 text-[10px] font-extrabold">0</span>
          </button>
          <button type="button" onclick="navigateTo('setting')" data-nav="setting" class="nav-btn w-full flex flex-col lg:flex-row items-center justify-center lg:justify-start gap-1 lg:gap-3 px-2 lg:px-3.5 py-2.5 rounded-2xl transition">
            <i data-lucide="settings" class="w-5 h-5 shrink-0"></i>
            <span class="text-[10px] lg:text-xs">Setting</span>
          </button>
        </nav>
      </div>

      <!-- Device-Local Controls Footer in Sidebar/Rail -->
      <div class="space-y-2 pt-3 border-t border-gray-100 dark:border-gray-800">
        <button type="button" onclick="toggleDeviceDarkMode()" title="Mode Siang / Malam (Perangkat Ini)"
          class="w-full p-2.5 rounded-2xl bg-cream dark:bg-black/30 hover:border-forest/30 border border-transparent flex items-center justify-center lg:justify-between text-xs font-semibold transition">
          <span class="hidden lg:inline text-gray-600 dark:text-gray-300">Mode Layar</span>
          <i id="sidebar-theme-icon" data-lucide="moon" class="w-4 h-4 text-gray-700 dark:text-amber-300"></i>
        </button>
        <button type="button" onclick="toggleDeviceLargeText()" title="Ukuran Teks (Perangkat Ini)"
          class="w-full p-2.5 rounded-2xl bg-cream dark:bg-black/30 hover:border-forest/30 border border-transparent flex items-center justify-center lg:justify-between text-xs font-semibold transition">
          <span class="hidden lg:inline text-gray-600 dark:text-gray-300">Ukuran Teks</span>
          <span id="sidebar-text-badge" class="text-[11px] font-extrabold text-forest dark:text-emerald-400">A</span>
        </button>
      </div>
    </aside>

    <!-- CONTENT AREA (Mobile Full-Width, Tablet md:pl-20, Desktop lg:pl-64) -->
    <div class="flex-1 flex flex-col min-w-0 md:pl-20 lg:pl-64">

      <!-- MOBILE TOP HEADER (<768px) -->
      <header class="md:hidden sticky top-0 z-30 bg-cream/95 dark:bg-[#121513]/95 backdrop-blur-md px-4 py-3 border-b border-forest/10 dark:border-white/10 flex items-center justify-between gap-2">
        <button type="button" onclick="navigateTo('beranda')" title="Kembali ke Beranda"
          class="flex items-center gap-2.5 text-left group cursor-pointer active:scale-95 transition-transform focus:outline-none">
          <div class="w-10 h-10 rounded-2xl bg-forest group-hover:bg-forest-light text-white flex items-center justify-center shadow-sm transition-colors">
            <i data-lucide="home" class="w-5 h-5 text-gold-light"></i>
          </div>
          <div>
            <div class="flex items-center gap-1.5">
              <span class="font-extrabold text-base tracking-tight text-forest dark:text-emerald-400">RumahKu</span>
              <span id="sync-status-pill" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300">
                <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span> Lokal
              </span>
            </div>
            <p id="header-family-name" class="text-[11px] text-gray-500 dark:text-gray-400 truncate max-w-[140px]">Keluarga Harmoni</p>
          </div>
        </button>

        <div class="flex items-center gap-1.5">
          <button type="button" onclick="toggleDeviceLargeText()" title="Ukuran Teks"
            class="w-9 h-9 rounded-xl card-surface flex items-center justify-center text-xs font-extrabold text-forest dark:text-emerald-400 active:scale-95 transition">
            A+
          </button>
          <button type="button" onclick="toggleDeviceDarkMode()" title="Mode Siang / Malam"
            class="w-9 h-9 rounded-xl card-surface flex items-center justify-center text-gray-700 dark:text-amber-300 active:scale-95 transition">
            <i id="header-theme-icon" data-lucide="moon" class="w-4 h-4"></i>
          </button>
          <button type="button" onclick="openProfileSwitcher()" title="Ganti Profil Pengguna"
            class="flex items-center gap-1.5 pl-1.5 pr-2 py-1 rounded-2xl card-surface active:scale-95 transition">
            <div id="header-user-avatar" class="w-7 h-7 rounded-xl bg-forest text-white text-xs font-bold flex items-center justify-center">A</div>
            <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-gray-400"></i>
          </button>
        </div>
      </header>

      <!-- TABLET & DESKTOP TOP BAR (>=768px) -->
      <header class="hidden md:flex sticky top-0 z-20 bg-cream/95 dark:bg-[#121513]/95 backdrop-blur-md px-6 lg:px-8 py-3.5 border-b border-forest/10 dark:border-white/10 items-center justify-between gap-4">
        <div>
          <h1 id="desktop-page-title" class="text-lg lg:text-xl font-extrabold text-gray-900 dark:text-white tracking-tight">Beranda Keluarga</h1>
          <p id="desktop-today-date" class="text-xs text-gray-500 dark:text-gray-400"></p>
        </div>

        <div class="flex items-center gap-2.5">
          <button type="button" onclick="exportToExcel()" title="Export Laporan Excel"
            class="px-3.5 py-2 rounded-2xl card-surface hover:border-forest/40 text-xs font-bold text-gray-700 dark:text-gray-200 flex items-center gap-1.5 transition">
            <i data-lucide="file-spreadsheet" class="w-4 h-4 text-forest dark:text-emerald-400"></i>
            <span class="hidden lg:inline">Export Excel</span>
          </button>

          <button type="button" onclick="openQuickAddModal()"
            class="px-3.5 py-2 rounded-2xl bg-gold-soft dark:bg-amber-950/50 text-amber-900 dark:text-amber-300 text-xs font-bold flex items-center gap-1.5 transition">
            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
            <span>Tambah Cepat</span>
          </button>

    function generatePngIconDataUrl(size) {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        if (!ctx) return '';

        // Rounded forest-green background
        const radius = Math.round(size * 0.22);
        ctx.fillStyle = '#214E2A';
        ctx.beginPath();
        ctx.moveTo(radius, 0);
        ctx.lineTo(size - radius, 0);
        ctx.quadraticCurveTo(size, 0, size, radius);
        ctx.lineTo(size, size - radius);
        ctx.quadraticCurveTo(size, size, size - radius, size);
        ctx.lineTo(radius, size);
        ctx.quadraticCurveTo(0, size, 0, size - radius);
        ctx.lineTo(0, radius);
        ctx.quadraticCurveTo(0, 0, radius, 0);
        ctx.closePath();
        ctx.fill();

        // Subtle gold border ring
        ctx.strokeStyle = 'rgba(223, 193, 91, 0.35)';
        ctx.lineWidth = Math.max(2, Math.round(size * 0.02));
        ctx.stroke();

        // Warm gold house icon
        ctx.fillStyle = '#DFC15B';
        const cx = size * 0.5;
        const topY = size * 0.22;
        const roofLeftX = size * 0.2;
        const roofRightX = size * 0.8;
        const roofBaseY = size * 0.48;
        const wallLeftX = size * 0.28;
        const wallRightX = size * 0.72;
        const bottomY = size * 0.78;

        ctx.beginPath();
        ctx.moveTo(cx, topY);
        ctx.lineTo(roofRightX, roofBaseY);
        ctx.lineTo(wallRightX, roofBaseY);
        ctx.lineTo(wallRightX, bottomY);
        ctx.lineTo(size * 0.56, bottomY);
        ctx.lineTo(size * 0.56, size * 0.6);
        ctx.lineTo(size * 0.44, size * 0.6);
        ctx.lineTo(size * 0.44, bottomY);
        ctx.lineTo(wallLeftX, bottomY);
        ctx.lineTo(wallLeftX, roofBaseY);
        ctx.lineTo(roofLeftX, roofBaseY);
        ctx.closePath();
        ctx.fill();

        return canvas.toDataURL('image/png');
      } catch (e) {
        return '';
      }
    }

    function getNextDueDateFromDay(dueDay) {
      const day = Math.min(31, Math.max(1, parseInt(dueDay, 10) || 25));
      const now = new Date();
      let year = now.getFullYear();
      let month = now.getMonth();
      const maxDayCurrent = new Date(year, month + 1, 0).getDate();
      let candidate = new Date(year, month, Math.min(day, maxDayCurrent));
      const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      if (candidate < todayMidnight) {
        month += 1;
        const maxDayNext = new Date(year, month + 1, 0).getDate();
        candidate = new Date(year, month, Math.min(day, maxDayNext));
      }
      const yyyy = candidate.getFullYear();
      const mm = String(candidate.getMonth() + 1).padStart(2, '0');
      const dd = String(candidate.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

      const available = Math.max(0, limit - used);
      const pct = limit > 0 ? Math.min(100, Math.round((used / limit) * 100)) : 0;
      return { limit, used, available, pct };
    }

    function formatRupiah(num) {
      if (devicePrefs.hideBalances) return "Rp •••••••";
      const n = Number(num) || 0;
      const prefix = n < 0 ? "-Rp " : "Rp ";
      return prefix + Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function formatDots(val) {
      const digits = String(val || '').replace(/\D/g, '');
      if (!digits) return '';
      return digits.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function parseDots(val) {
      if (typeof val === 'number') return val;
      const digits = String(val || '').replace(/\D/g, '');
      return digits ? parseInt(digits, 10) : 0;
    }

    function handleCurrencyInput(el) {

      const diff = el.value.length - prevLen;
      try {
        el.setSelectionRange(Math.max(0, cursor + diff), Math.max(0, cursor + diff));
      } catch (e) {}
    }

    function formatAccountNumberDisplay(acc) {
      const raw = (acc.accountNumber || '').trim();
      if (!raw) return 'Tanpa nomor rekening';
      if (devicePrefs.revealedAccountIds.includes(acc.id)) {
        return raw.replace(/(.{4})/g, '$1 ').trim();
      }
      if (raw.length <= 4) return raw;
      return `•••••••• ${raw.slice(-4)}`;
    }

    function copyTextToClipboard(text, label = "Teks") {
      if (!text) return;
      try {
        const temp = document.createElement('textarea');
        temp.value = text;
        temp.style.position = 'fixed';
        temp.style.left = '-9999px';
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        showToast(`${label} berhasil disalin!`);
      } catch (e) {
        showToast(`Gagal menyalin ${label}`, 'error');
      }
    }

    function formatDateIndo(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(dateStr + 'T00:00:00');
      if (isNaN(d.getTime())) return dateStr;
      return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const el = document.createElement('div');
      const bg = type === 'error' ? 'bg-red-600 text-white' : type === 'warning' ? 'bg-amber-600 text-white' : 'bg-forest text-white';
      el.className = `${bg} px-4 py-3 rounded-2xl shadow-lg text-xs font-semibold flex items-center justify-between gap-2 animate-in pointer-events-auto`;
      el.innerHTML = `<span>${escapeHtml(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s';
        setTimeout(() => el.remove(), 260);
      }, 2800);
    }

    function getActiveUser() {
      if (!appState.users || !appState.users.length) return null;
      return appState.users.find(u => u.id === devicePrefs.activeUserId) || null;
    }

    function isAdminUser() {
      const u = getActiveUser();
      return !!(u && u.role === 'Admin');
    }

    /* =========================================================================
       5. AUTHENTICATION & FIRESTORE REAL-TIME SYNC
       ========================================================================= */
    function sanitizeAccountDocId(rawId) {
      return String(rawId || '').trim().toLowerCase().replace(/[^a-z0-9._-]/g, '_');
    }

    function switchAuthTab(tab) {
      const loginForm = document.getElementById('form-login');
      const regForm = document.getElementById('form-register');
      const loginBtn = document.getElementById('tab-login-btn');
      const regBtn = document.getElementById('tab-register-btn');
      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
        loginBtn.className = "py-2.5 text-xs font-bold rounded-xl bg-forest text-white shadow-sm transition";
        regBtn.className = "py-2.5 text-xs font-bold rounded-xl text-gray-600 dark:text-gray-300 transition";
      } else {
        loginForm.classList.add('hidden');
        regForm.classList.remove('hidden');
        regBtn.className = "py-2.5 text-xs font-bold rounded-xl bg-forest text-white shadow-sm transition";
        loginBtn.className = "py-2.5 text-xs font-bold rounded-xl text-gray-600 dark:text-gray-300 transition";
      }
    }

    async function handleFamilyLogin(e) {
      e.preventDefault();
      const rawId = document.getElementById('login-account-id').value.trim();
      const pass = document.getElementById('login-account-pass').value;
      const docId = sanitizeAccountDocId(rawId);
      if (!docId) return;

      const btn = document.getElementById('btn-login-submit');
      btn.disabled = true;
      btn.innerHTML = `<span>Menghubungkan...</span>`;

      try {
        if (db) {
          let snap = await db.collection('rumahku_accounts').doc(docId).get();
          let colName = 'rumahku_accounts';
          if (!snap.exists) {
            const famSnap = await db.collection('rumahku_families').doc(rawId.toUpperCase()).get();
            if (famSnap.exists) {
              snap = famSnap;
              colName = 'rumahku_families';
            }
          }

          if (snap.exists) {
            const data = snap.data();
            if (data.accountPassword && data.accountPassword !== pass) {
              showToast("Kata sandi akun keluarga salah!", "error");
              return;
            }
            currentSession = { accountId: snap.id, collectionName: colName, isDemo: false };
            localStorage.setItem(SESSION_KEY, JSON.stringify(currentSession));
            devicePrefs.profileUnlocked = false;
            saveDevicePrefs();
            mergeIncomingState(data);
            startFirestoreListener();
            bootUIAfterSession();
            return;
          }
        }

        const localSaved = localStorage.getItem(LOCAL_DATA_PREFIX + docId);
        if (localSaved) {
          const parsed = JSON.parse(localSaved);
          if (parsed.accountPassword && parsed.accountPassword !== pass) {
            showToast("Kata sandi lokal salah!", "error");
            return;
          }
          currentSession = { accountId: docId, collectionName: 'rumahku_accounts', isDemo: false };
          localStorage.setItem(SESSION_KEY, JSON.stringify(currentSession));
          devicePrefs.profileUnlocked = false;
          saveDevicePrefs();
          mergeIncomingState(parsed);
          startFirestoreListener();
          bootUIAfterSession();
        } else {
          showToast("Akun keluarga tidak ditemukan. Silakan buat akun baru.", "error");
        }
      } catch (err) {
        lastSyncError = err.message || 'Gagal terhubung';
        showToast("Gagal terhubung ke server: " + lastSyncError, "error");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i><span>Masuk ke RumahKu</span>`;
        safeRefreshIcons();
      }
    }

    async function handleFamilyRegister(e) {
      e.preventDefault();
      const familyName = document.getElementById('reg-family-name').value.trim();
      const rawId = document.getElementById('reg-account-id').value.trim();
      const accountPass = document.getElementById('reg-account-pass').value;
      const adminName = document.getElementById('reg-admin-name').value.trim();
      const adminPass = document.getElementById('reg-admin-pass').value || '1234';
      const docId = sanitizeAccountDocId(rawId);

      const btn = document.getElementById('btn-register-submit');
      btn.disabled = true;
      btn.innerHTML = `<span>Membuat Akun...</span>`;

      try {
        const freshState = createDefaultHouseholdState(familyName, adminName, adminPass);
        freshState.accountPassword = accountPass;
        freshState.accountEmail = rawId;

        if (db) {
          const existing = await db.collection('rumahku_accounts').doc(docId).get();
          if (existing.exists) {
            showToast("ID/Email keluarga sudah terdaftar. Silakan Masuk.", "warning");
            switchAuthTab('login');
            return;
          }
          await db.collection('rumahku_accounts').doc(docId).set(freshState);
          isCloudConnected = true;
        }

        currentSession = { accountId: docId, collectionName: 'rumahku_accounts', isDemo: false };
        localStorage.setItem(SESSION_KEY, JSON.stringify(currentSession));
        appState = freshState;
        saveLocalMirror();

        devicePrefs.activeUserId = 'u_admin';
        devicePrefs.profileUnlocked = true;
        saveDevicePrefs();

        startFirestoreListener();
        bootUIAfterSession();
        showToast("Akun keluarga berhasil dibuat!");
      } catch (err) {
        lastSyncError = err.message || 'Offline';
        currentSession = { accountId: docId, collectionName: 'rumahku_accounts', isDemo: false };
        localStorage.setItem(SESSION_KEY, JSON.stringify(currentSession));
        appState = createDefaultHouseholdState(familyName, adminName, adminPass);
        appState.accountPassword = accountPass;
        saveLocalMirror();
        devicePrefs.activeUserId = 'u_admin';
        devicePrefs.profileUnlocked = true;
        saveDevicePrefs();
        bootUIAfterSession();
        showToast("Akun tersimpan lokal (cek izin Firestore untuk cloud).", "warning");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="sparkles" class="w-4 h-4 text-gold-light"></i><span>Buat Rumah Baru</span>`;
        safeRefreshIcons();
      }
    }

    function enterDemoMode() {
      currentSession = { accountId: 'demo_keluarga', collectionName: 'local', isDemo: true };
      localStorage.setItem(SESSION_KEY, JSON.stringify(currentSession));
      const localRaw = localStorage.getItem(LOCAL_DATA_PREFIX + 'demo_keluarga');
      if (localRaw) {
        try { mergeIncomingState(JSON.parse(localRaw)); } catch (e) {}
      } else {
        appState = createDefaultHouseholdState("Keluarga Demo", "Ayah", "1234");
        saveLocalMirror();
      }
      devicePrefs.activeUserId = 'u_admin';
      devicePrefs.profileUnlocked = true;
      saveDevicePrefs();
      isCloudConnected = false;
      bootUIAfterSession();
      showToast("Masuk ke Mode Demo Lokal");
    }

    function logoutFamilyAccount() {
      if (unsubscribeSnapshot) {
        try { unsubscribeSnapshot(); } catch (e) {}
        unsubscribeSnapshot = null;
      }
      localStorage.removeItem(SESSION_KEY);
      currentSession = null;
      devicePrefs.profileUnlocked = false;
      devicePrefs.activeUserId = null;
      saveDevicePrefs();
      document.getElementById('app-shell').classList.add('hidden');
      document.getElementById('profile-picker-screen').classList.add('hidden');
      document.getElementById('auth-screen').classList.remove('hidden');
      safeRefreshIcons();
    }

    function mergeIncomingState(remote) {
      if (!remote || typeof remote !== 'object') return;
      appState = {
        ...createDefaultHouseholdState(),
        ...appState,
        familyName: remote.familyName || appState.familyName,
        accountPassword: remote.accountPassword || appState.accountPassword,
        accountEmail: remote.accountEmail || appState.accountEmail,
        users: Array.isArray(remote.users) && remote.users.length ? remote.users : appState.users,
        accounts: Array.isArray(remote.accounts) ? remote.accounts : appState.accounts,
        categories: Array.isArray(remote.categories) && remote.categories.length ? remote.categories : appState.categories,
        transactions: Array.isArray(remote.transactions) ? remote.transactions : [],
        scheduledTransactions: Array.isArray(remote.scheduledTransactions) ? remote.scheduledTransactions : [],
        bills: Array.isArray(remote.bills) ? remote.bills : [],
        tasks: Array.isArray(remote.tasks) ? remote.tasks : [],
        inventory: Array.isArray(remote.inventory) ? remote.inventory : [],
        shoppingChecklist: Array.isArray(remote.shoppingChecklist) ? remote.shoppingChecklist : [],
        notes: Array.isArray(remote.notes) ? remote.notes : []
      };
      saveLocalMirror();
    }

    function saveLocalMirror() {
      if (!currentSession) return;
      try {
        localStorage.setItem(LOCAL_DATA_PREFIX + currentSession.accountId, JSON.stringify(appState));
      } catch (e) {}
    }

    async function persistHouseholdState() {
      saveLocalMirror();
      updateSyncBadges();
      if (!db || !currentSession || currentSession.isDemo) return;
      try {
        const payload = {
          familyName: appState.familyName,
          accountPassword: appState.accountPassword || '',
          accountEmail: appState.accountEmail || currentSession.accountId,
          users: appState.users,
          accounts: appState.accounts,
          categories: appState.categories,
          transactions: appState.transactions,
          scheduledTransactions: appState.scheduledTransactions,
          bills: appState.bills,
          tasks: appState.tasks,
          inventory: appState.inventory,
          shoppingChecklist: appState.shoppingChecklist,
          notes: appState.notes,
          updatedAt: new Date().toISOString()
        };
        await db.collection(currentSession.collectionName).doc(currentSession.accountId).set(payload, { merge: true });
        isCloudConnected = true;
        lastSyncError = "";
        updateSyncBadges();
      } catch (err) {
        isCloudConnected = false;
        lastSyncError = err.message || 'Gagal sinkron';
        updateSyncBadges();
      }
    }

    function startFirestoreListener() {
      if (unsubscribeSnapshot) {
        try { unsubscribeSnapshot(); } catch (e) {}
        unsubscribeSnapshot = null;
      }
      if (!db || !currentSession || currentSession.isDemo) {
        isCloudConnected = false;
        updateSyncBadges();
        return;
      }

      try {
        unsubscribeSnapshot = db.collection(currentSession.collectionName)
          .doc(currentSession.accountId)
          .onSnapshot((doc) => {
            isCloudConnected = true;
            lastSyncError = "";
            updateSyncBadges();
            if (doc.exists) {
              mergeIncomingState(doc.data());
              if (devicePrefs.profileUnlocked) renderApp();
              else renderProfilePicker();
            }
          }, (err) => {
            isCloudConnected = false;
            lastSyncError = err.message || 'Firestore rules';
            updateSyncBadges();
          });
      } catch (e) {
        isCloudConnected = false;
        updateSyncBadges();
      }
    }

    function updateSyncBadges() {
      const pill = document.getElementById('sync-status-pill');
      const sPill = document.getElementById('sidebar-sync-pill');
      const pickerBadge = document.getElementById('picker-sync-badge');
      const liveClass = "inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300";
      const localClass = "inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300";
      const liveInner = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Live`;
      const localInner = `<span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span> Lokal`;

      [pill, sPill].forEach(el => {
        if (!el) return;
        el.className = isCloudConnected ? liveClass : localClass;
        el.innerHTML = isCloudConnected ? liveInner : localInner;
      });
      if (pickerBadge) {
        pickerBadge.innerHTML = isCloudConnected
          ? `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> Terhubung Cloud (Live)`
          : `<span class="w-2 h-2 rounded-full bg-amber-500"></span> Mode Lokal`;
      }
    }

      document.getElementById('auth-screen').classList.add('hidden');
      const activeUser = getActiveUser();
      if (!devicePrefs.profileUnlocked || !activeUser) {
        openProfileSwitcher();
      } else {
        document.getElementById('profile-picker-screen').classList.add('hidden');
        document.getElementById('app-shell').classList.remove('hidden');
        renderApp();
      }
    }

      pendingPickerUserId = null;
      document.getElementById('profile-pass-form').classList.add('hidden');
      document.getElementById('profile-picker-screen').classList.remove('hidden');
      renderProfilePicker();
    }

    function renderProfilePicker() {
      document.getElementById('picker-family-title').textContent = appState.familyName || 'Keluarga';
      const grid = document.getElementById('profile-picker-grid');
      grid.innerHTML = appState.users.map(u => `
        <button type="button" onclick="selectPickerUser('${u.id}')"
          class="flex flex-col items-center p-4 rounded-2xl bg-cream dark:bg-black/30 border border-gray-200 dark:border-gray-700 hover:border-forest active:scale-95 transition text-center">
          <div class="w-12 h-12 rounded-2xl text-white font-extrabold text-lg flex items-center justify-center shadow-sm mb-2"
               style="background-color: ${escapeHtml(u.avatarColor || '#214E2A')}">
            ${escapeHtml(u.name.charAt(0).toUpperCase())}

          <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full mt-1 ${u.role === 'Admin' ? 'bg-gold-soft text-amber-800' : 'bg-gray-100 dark:bg-gray-800 text-gray-500'}">
            ${escapeHtml(u.role)}
          </span>
        </button>
      `).join('');
      updateSyncBadges();
      safeRefreshIcons();
    }

    function selectPickerUser(userId) {
      const user = appState.users.find(u => u.id === userId);
      if (!user) return;
      if (!user.password) {
        devicePrefs.activeUserId = user.id;
        devicePrefs.profileUnlocked = true;
        saveDevicePrefs();
        document.getElementById('profile-picker-screen').classList.add('hidden');
        document.getElementById('app-shell').classList.remove('hidden');
        renderApp();
        return;
      }
      pendingPickerUserId = user.id;
      document.getElementById('selected-picker-name').textContent = user.name;
      const form = document.getElementById('profile-pass-form');
      const input = document.getElementById('profile-pass-input');
      form.classList.remove('hidden');
      input.value = '';
      input.focus();
    }

    function cancelProfilePassword() {
      pendingPickerUserId = null;
      document.getElementById('profile-pass-form').classList.add('hidden');
    }

    function verifyProfilePassword(e) {
      e.preventDefault();
      const user = appState.users.find(u => u.id === pendingPickerUserId);
      const input = document.getElementById('profile-pass-input').value;
      if (!user) return;
      if (input !== user.password) {
        showToast("Kata sandi profil salah!", "error");
        return;
      }
      devicePrefs.activeUserId = user.id;
      devicePrefs.profileUnlocked = true;
      saveDevicePrefs();
      document.getElementById('profile-picker-screen').classList.add('hidden');
      document.getElementById('app-shell').classList.remove('hidden');
      renderApp();
      showToast(`Selamat datang, ${user.name}!`);
    }

    /* =========================================================================
       8. VIEW 1: BERANDA (12-COL BENTO ON PC, 2-COL ON TABLET, 1-COL ON HP)
       ========================================================================= */
    function getLowStockItems() {
      return (appState.inventory || []).filter(item => Number(item.qty) <= Number(item.minQty));
    }

    function renderBerandaView() {
      const cashAccounts = (appState.accounts || []).filter(a => !isCreditCardType(a.type));
      const creditCards = (appState.accounts || []).filter(a => isCreditCardType(a.type));
      const totalBalance = cashAccounts.reduce((sum, a) => sum + (Number(a.balance) || 0), 0);
      const totalCardDebt = creditCards.reduce((sum, a) => sum + Math.max(0, Number(a.balance) || 0), 0);
      const currentMonth = new Date().toISOString().slice(0, 7);
      const monthTx = (appState.transactions || []).filter(t => (t.date || '').startsWith(currentMonth));
      const monthIncome = monthTx.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0);
      const monthExpense = monthTx.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);

      // Hindari penghitungan ganda antara utang kartu kredit & tagihan yang sudah terhubung ke kartu
      const nonCardBills = (appState.bills || []).filter(b => !b.paid && !b.linkedAccountId);
      const totalUnpaidAmount = nonCardBills.reduce((s, b) => s + (Number(b.amount) || 0), 0) + totalCardDebt;
      const unpaidBills = (appState.bills || []).filter(b => !b.paid);
      const netWorth = totalBalance - totalUnpaidAmount;
      const lowStock = getLowStockItems();
      const uncheckedShop = (appState.shoppingChecklist || []).filter(s => !s.checked);
      const pendingTasks = (appState.tasks || []).filter(t => !t.done);
      const recentTx = [...(appState.transactions || [])].sort((a, b) => (b.date || '').localeCompare(a.date || '')).slice(0, 5);

      const shortcuts = [
        { label: 'Transaksi', icon: 'arrow-left-right', color: 'bg-emerald-50 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300', action: "keuanganSubTab='transaksi'; navigateTo('keuangan')" },

    function renderBerandaExpenseChart() {
      try {
        const canvas = document.getElementById('beranda-expense-chart');
        if (!canvas || typeof Chart === 'undefined') return;
        if (berandaChartInstance) {
          berandaChartInstance.destroy();
          berandaChartInstance = null;
        }
        const currentMonth = new Date().toISOString().slice(0, 7);
        const expenses = (appState.transactions || []).filter(t => t.type === 'expense' && (t.date || '').startsWith(currentMonth));
        const grouped = {};
        expenses.forEach(tx => {
          const cat = (appState.categories || []).find(c => c.id === tx.categoryId);
          const name = cat ? cat.name : 'Lainnya';
          grouped[name] = (grouped[name] || 0) + Number(tx.amount);
        });
        const labels = Object.keys(grouped);
        const data = Object.values(grouped);
        if (!labels.length) {
          labels.push('Belum Ada Pengeluaran');
          data.push(1);
        }
        berandaChartInstance = new Chart(canvas, {
          type: 'doughnut',
          data: {
            labels,
            datasets: [{
              data,
              backgroundColor: labels[0] === 'Belum Ada Pengeluaran'
                ? ['#E5E7EB']
                : ['#214E2A', '#C9A227', '#DC2626', '#2563EB', '#0D9488', '#D97706'],
              borderWidth: 0
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '66%',
            plugins: {
              legend: {
                position: 'right',
                labels: { boxWidth: 10, font: { family: 'Plus Jakarta Sans', size: 11 } }
              }
            }
          }
        });
      } catch (e) {}
    }

    /* =========================================================================
       9. VIEW 2: KEUANGAN (UNIFIED WALLET & POS FILTER ENGINE + ALL SECTIONS)
       ========================================================================= */
    function getAccountOwnerId(accId) {
      const acc = (appState.accounts || []).find(a => a.id === accId);
      if (!acc) return 'shared';
      return acc.ownerId || 'shared';
    }

    function getFilteredFinanceContext() {
      const allAccounts = appState.accounts || [];
      const allTransactions = appState.transactions || [];
      const allBills = appState.bills || [];
      const allScheduled = appState.scheduledTransactions || [];
      const currentMonth = new Date().toISOString().slice(0, 7);

      // 1. Filter Rekening / Wallet berdasarkan pilihan Wallet & Pos Pemilik
      const matchingAccounts = allAccounts.filter(acc => {
        if (keuanganWalletFilter !== 'all' && acc.id !== keuanganWalletFilter) return false;
        const owner = acc.ownerId || 'shared';
        if (keuanganOwnerFilter !== 'all' && owner !== keuanganOwnerFilter) return false;
        return true;
      });
      const matchingAccountIds = new Set(matchingAccounts.map(a => a.id));

      // Helper pencocokan transaksi terhadap Wallet & Pos Pemilik
      const selectedUserObj = (appState.users || []).find(u => u.id === keuanganOwnerFilter);
      const selectedUserNameLower = selectedUserObj ? selectedUserObj.name.trim().toLowerCase() : '';

      const matchesTxWalletAndPos = (tx) => {
        // Filter Wallet
        if (keuanganWalletFilter !== 'all') {
          if (tx.accountId !== keuanganWalletFilter && tx.toAccountId !== keuanganWalletFilter) return false;
        }
        // Filter Pos Pemilik
        if (keuanganOwnerFilter !== 'all') {
          const srcOwner = getAccountOwnerId(tx.accountId);
          const dstOwner = tx.toAccountId ? getAccountOwnerId(tx.toAccountId) : null;
          const txExplicitOwner = tx.ownerId || tx.userId || '';
          const txCreatorLower = (tx.createdBy || '').trim().toLowerCase();

          const matchByAccountOwner = (srcOwner === keuanganOwnerFilter) || (dstOwner === keuanganOwnerFilter);
          const matchByTxOwner = (txExplicitOwner === keuanganOwnerFilter);
          const matchByCreatorName = (selectedUserNameLower && txCreatorLower === selectedUserNameLower);

          if (!matchByAccountOwner && !matchByTxOwner && !matchByCreatorName) return false;
        }
        return true;
      };

      // 2. Transaksi sesuai Wallet & Pos (semua bulan)
      const matchingAllTimeTransactions = allTransactions.filter(matchesTxWalletAndPos);

      // 3. Transaksi Bulan Ini (untuk ringkasan pemasukan, pengeluaran & progres anggaran)
      const matchingMonthTransactions = matchingAllTimeTransactions.filter(tx => (tx.date || '').startsWith(currentMonth));

      // 4. Transaksi untuk daftar riwayat (memperhatikan filter bulan & jenis)
      const matchingHistoryTransactions = matchingAllTimeTransactions
        .filter(tx => {
          if (keuanganMonthFilter === 'current' && !(tx.date || '').startsWith(currentMonth)) return false;
          if (keuanganTypeFilter !== 'all' && tx.type !== keuanganTypeFilter) return false;
          return true;
        })
        .sort((a, b) => (b.date || '').localeCompare(a.date || ''));

      // 5. Tagihan & Transaksi Terjadwal sesuai Wallet & Pos
      const matchingBills = allBills.filter(b => {
        if (keuanganWalletFilter !== 'all' && b.accountId !== keuanganWalletFilter) return false;
        if (keuanganOwnerFilter !== 'all' && getAccountOwnerId(b.accountId) !== keuanganOwnerFilter) return false;
        return true;
      }).sort((a, b) => (a.dueDate || '').localeCompare(b.dueDate || ''));

      const matchingScheduled = allScheduled.filter(s => {
        if (keuanganWalletFilter !== 'all' && s.accountId !== keuanganWalletFilter) return false;
        if (keuanganOwnerFilter !== 'all' && getAccountOwnerId(s.accountId) !== keuanganOwnerFilter) return false;
        return true;
      }).sort((a, b) => (a.nextDate || '').localeCompare(b.nextDate || ''));

      // 6. Hitung Agregat Saldo (Tunai/Bank/E-Wallet), Utang Kartu Kredit, Pemasukan, Pengeluaran
      const filteredCashAccounts = matchingAccounts.filter(a => !isCreditCardType(a.type));
      const filteredCreditCards = matchingAccounts.filter(a => isCreditCardType(a.type));
      const filteredBalance = filteredCashAccounts.reduce((sum, a) => sum + (Number(a.balance) || 0), 0);
      const filteredCardDebt = filteredCreditCards.reduce((sum, a) => sum + Math.max(0, Number(a.balance) || 0), 0);
      const filteredCardAvailable = filteredCreditCards.reduce((sum, a) => sum + getCreditCardMetrics(a).available, 0);
      const filteredMonthIncome = matchingMonthTransactions
        .filter(t => t.type === 'income')
        .reduce((s, t) => s + (Number(t.amount) || 0), 0);
      const filteredMonthExpense = matchingMonthTransactions
        .filter(t => t.type === 'expense')
        .reduce((s, t) => s + (Number(t.amount) || 0), 0);

      // Label indikator filter aktif
      const activeWalletObj = allAccounts.find(a => a.id === keuanganWalletFilter);
      const walletLabel = keuanganWalletFilter === 'all'
        ? 'Semua Wallet'
        : (activeWalletObj ? activeWalletObj.name : 'Wallet Terpilih');

      const posLabel = keuanganOwnerFilter === 'all'
        ? 'Semua Pos'
        : keuanganOwnerFilter === 'shared'
          ? 'Pos Bersama'
          : (selectedUserObj ? `Pos ${selectedUserObj.name}` : 'Pos Terpilih');

      const isAnyFilterActive = keuanganWalletFilter !== 'all' || keuanganOwnerFilter !== 'all' || keuanganTypeFilter !== 'all' || keuanganMonthFilter !== 'all';

      return {
        currentMonth,
        matchingAccounts,
        matchingAccountIds,
        matchingAllTimeTransactions,
        matchingMonthTransactions,
        matchingHistoryTransactions,
        matchingBills,
        matchingScheduled,
        filteredBalance,
        filteredCardDebt,
        filteredCardAvailable,
        hasFilteredCreditCards: filteredCreditCards.length > 0,
        filteredMonthIncome,
        filteredMonthExpense,
        walletLabel,
        posLabel,
        isAnyFilterActive
      };
    }

      keuanganOwnerFilter = 'all';
      keuanganTypeFilter = 'all';
      keuanganMonthFilter = 'all';
      renderApp();

    /* =========================================================================
       10. VIEW 3: KALENDER BELANJA HEATMAP & AGENDA RUMAH
       ========================================================================= */
    function renderKalenderView() {
      const now = new Date();
      const target = new Date(now.getFullYear(), now.getMonth() + calendarMonthOffset, 1);
      const year = target.getFullYear();
      const month = target.getMonth();
      const monthLabel = target.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = new Date().toISOString().split('T')[0];

      const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;
      const monthBills = (appState.bills || []).filter(b => (b.dueDate || '').startsWith(monthPrefix));
      const monthTasks = (appState.tasks || []).filter(t => (t.dueDate || '').startsWith(monthPrefix));
      const monthExpenses = (appState.transactions || []).filter(t => t.type === 'expense' && (t.date || '').startsWith(monthPrefix));

      let cells = '';
      for (let i = 0; i < firstDay; i++) {
        cells += `<div class="h-12 md:h-14"></div>`;
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const dStr = `${monthPrefix}-${String(d).padStart(2, '0')}`;
        const hasBill = monthBills.some(b => b.dueDate === dStr);
        const hasTask = monthTasks.some(t => t.dueDate === dStr);
        const daySpend = monthExpenses.filter(t => t.date === dStr).reduce((s, t) => s + Number(t.amount), 0);
        const isToday = dStr === todayStr;
        const isSelected = dStr === selectedCalendarDate;

        let heatBg = 'bg-cream/60 dark:bg-black/25';
        if (daySpend >= 1000000) heatBg = 'bg-red-200/80 dark:bg-red-950/60';
        else if (daySpend >= 250000) heatBg = 'bg-amber-200/70 dark:bg-amber-950/50';
        else if (daySpend > 0) heatBg = 'bg-emerald-100/80 dark:bg-emerald-950/40';

        cells += `
          <button type="button" onclick="selectedCalendarDate='${dStr}'; renderApp()"
            class="h-12 md:h-14 rounded-xl flex flex-col items-center justify-center relative transition ${isToday ? 'bg-forest text-white font-extrabold' : heatBg + ' text-xs font-semibold'} ${isSelected && !isToday ? 'ring-2 ring-forest' : ''}">
            <span>${d}</span>
            ${daySpend > 0 ? `<span class="text-[8px] font-bold ${isToday ? 'text-gold-light' : 'text-gray-600 dark:text-gray-300'}">${Math.round(daySpend / 1000)}rb</span>` : ''}
            <div class="flex gap-0.5 mt-0.5">
              ${hasBill ? `<span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>` : ''}
              ${hasTask ? `<span class="w-1.5 h-1.5 rounded-full bg-gold"></span>` : ''}
            </div>
          </button>
        `;
      }

      const dayBills = (appState.bills || []).filter(b => b.dueDate === selectedCalendarDate);
      const dayTasks = (appState.tasks || []).filter(t => t.dueDate === selectedCalendarDate);
      const dayTxs = (appState.transactions || []).filter(t => t.date === selectedCalendarDate);

      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start animate-in">
          <div class="lg:col-span-7 card-surface rounded-3xl p-4 lg:p-5">
            <div class="flex items-center justify-between mb-4">
              <button type="button" onclick="calendarMonthOffset--; renderApp()" class="p-2 rounded-xl bg-cream dark:bg-black/30">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
              </button>
              <h3 class="text-sm lg:text-base font-extrabold capitalize">${escapeHtml(monthLabel)}</h3>
              <button type="button" onclick="calendarMonthOffset++; renderApp()" class="p-2 rounded-xl bg-cream dark:bg-black/30">
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
              </button>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-gray-400 mb-2">
              <span>Min</span><span>Sen</span><span>Sel</span><span>Rab</span><span>Kam</span><span>Jum</span><span>Sab</span>
            </div>
            <div class="grid grid-cols-7 gap-1.5">${cells}</div>
            <div class="flex flex-wrap items-center gap-4 mt-4 pt-3 border-t border-gray-100 dark:border-gray-800 text-[11px] text-gray-500">
              <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-red-500"></span> Tagihan</span>
              <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-gold"></span> Tugas</span>
              <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded bg-amber-200"></span> Heatmap Belanja</span>
            </div>
          </div>

          <div class="lg:col-span-5 space-y-4">
            <div class="card-surface rounded-3xl p-4 space-y-2.5">
              <div class="flex items-center justify-between">
                <h4 class="text-xs font-extrabold uppercase tracking-wider text-forest dark:text-emerald-400">Detail ${formatDateIndo(selectedCalendarDate)}</h4>
                <button type="button" onclick="openTransactionModal()" class="text-xs font-bold text-forest dark:text-emerald-400">+ Catat</button>
              </div>
              ${dayBills.length === 0 && dayTasks.length === 0 && dayTxs.length === 0
                ? `<p class="text-xs text-gray-400 py-2">Tidak ada aktivitas tercatat pada tanggal ini.</p>`
                : `
                  ${dayBills.map(b => `
                    <div class="p-2.5 rounded-2xl bg-red-50/70 dark:bg-red-950/30 flex items-center justify-between">
                      <span class="text-xs font-bold">${escapeHtml(b.title)}</span>
                      <span class="text-xs font-extrabold text-red-600 tabular-nums">${formatRupiah(b.amount)}</span>
                    </div>
                  `).join('')}
                  ${dayTasks.map(t => `
                    <div class="p-2.5 rounded-2xl bg-gold-soft/60 dark:bg-amber-950/30 flex items-center justify-between">
                      <span class="text-xs font-bold">${escapeHtml(t.title)}</span>
                      <span class="text-[10px] font-bold">${t.done ? 'Selesai' : 'Aktif'}</span>
                    </div>
                  `).join('')}
                  ${dayTxs.map(tx => `
                    <div class="p-2.5 rounded-2xl bg-cream dark:bg-black/25 flex items-center justify-between">
                      <span class="text-xs font-semibold truncate pr-2">${escapeHtml(tx.title)}</span>
                      <span class="text-xs font-extrabold ${tx.type === 'income' ? 'text-emerald-600' : 'text-red-500'} tabular-nums">${tx.type === 'income' ? '+' : '-'}${formatRupiah(tx.amount)}</span>
                    </div>
                  `).join('')}
                `}
            </div>

            <div class="card-surface rounded-3xl p-4 space-y-2.5">
              <h4 class="text-xs font-extrabold uppercase tracking-wider text-gray-500">Semua Agenda Bulan Ini</h4>
              ${monthBills.length === 0 && monthTasks.length === 0 ? `<p class="text-xs text-gray-400">Tidak ada agenda tagihan atau tugas bulan ini.</p>` : `
                ${monthBills.map(b => `
                  <div class="flex items-center justify-between p-2.5 rounded-2xl bg-red-50/60 dark:bg-red-950/30">
                    <div>
                      <p class="text-xs font-bold">${escapeHtml(b.title)}</p>
                      <p class="text-[10px] text-gray-500">Tagihan • ${formatDateIndo(b.dueDate)}</p>
                    </div>
                    <span class="text-xs font-extrabold text-red-600 tabular-nums">${formatRupiah(b.amount)}</span>
                  </div>
                `).join('')}
                ${monthTasks.map(t => `
                  <div class="flex items-center justify-between p-2.5 rounded-2xl bg-gold-soft/50 dark:bg-amber-950/30">
                    <div>
                      <p class="text-xs font-bold">${escapeHtml(t.title)}</p>
                      <p class="text-[10px] text-gray-500">Tugas • ${formatDateIndo(t.dueDate)}</p>
                    </div>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${t.done ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-800'}">
                      ${t.done ? 'Selesai' : 'Aktif'}
                    </span>
                  </div>
                `).join('')}
              `}
            </div>
          </div>
        </div>
      `;
    }

              class="py-2 text-[11px] font-bold rounded-xl transition relative ${rumahSubTab === 'stok' ? 'bg-forest text-white shadow-sm' : 'text-gray-600 dark:text-gray-300'}">
              Stok Rumah
              ${lowStock.length > 0 ? `<span class="ml-1 px-1.5 py-0.2 rounded-full bg-red-500 text-white text-[9px]">${lowStock.length}</span>` : ''}
            </button>
            <button type="button" onclick="rumahSubTab='checklist'; renderApp()"
              class="py-2 text-[11px] font-bold rounded-xl transition relative ${rumahSubTab === 'checklist' ? 'bg-forest text-white shadow-sm' : 'text-gray-600 dark:text-gray-300'}">

            </button>
            <button type="button" onclick="rumahSubTab='catatan'; renderApp()"

          ${rumahSubTab === 'stok' ? renderRumahStokTab(lowStock) : ''}

          <div class="flex items-center justify-between">

            <button type="button" onclick="openInventoryModal()" class="px-3 py-1.5 rounded-xl bg-forest text-white text-xs font-bold flex items-center gap-1">

                      <button type="button" onclick="addLowStockItemToChecklist('${item.id}')" class="mt-1.5 inline-flex items-center gap-1 text-[10px] font-bold text-amber-700 dark:text-amber-300 hover:underline">

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');

      openModal("Pasang RumahKu di HP", `

    async function triggerNativePWAInstall() {
      if (deferredInstallPrompt) {
        try {
          deferredInstallPrompt.prompt();
          await deferredInstallPrompt.userChoice;
          deferredInstallPrompt = null;
          closeModal();
          return;
        } catch (e) {
          deferredInstallPrompt = null;
        }
      }
      showToast(isStandaloneInstalled()
        ? "RumahKu sudah terpasang di layar utama HP Anda!"
        : "Silakan ikuti langkah di atas (Menu Browser -> Tambahkan ke Layar Utama).");
    }

    function saveTransfer(e) {
      e.preventDefault();
      const fromId = document.getElementById('trf-from').value;
      const toId = document.getElementById('trf-to').value;
      const amount = parseDots(document.getElementById('trf-amount').value);
      const date = document.getElementById('trf-date').value;
      if (fromId === toId || !amount) {
        showToast("Pilih rekening tujuan yang berbeda & isi nominal.", "error");
        return;
      }
      const fromAcc = appState.accounts.find(a => a.id === fromId);
      const toAcc = appState.accounts.find(a => a.id === toId);
      if (fromAcc) {
        if (isCreditCardType(fromAcc.type)) {
          // Tarik tunai / transfer keluar dari Kartu Kredit menambah tagihan terpakai
          fromAcc.balance = Math.max(0, (Number(fromAcc.balance) || 0) + amount);
        } else {
          fromAcc.balance = (Number(fromAcc.balance) || 0) - amount;
        }
      }
      if (toAcc) {
        if (isCreditCardType(toAcc.type)) {
          // Transfer masuk ke Kartu Kredit / PayLater = Pembayaran Tagihan (mengurangi tagihan terpakai & memulihkan limit)
          toAcc.balance = Math.max(0, (Number(toAcc.balance) || 0) - amount);
        } else {
          toAcc.balance = (Number(toAcc.balance) || 0) + amount;
        }
      }
      syncAllLinkedCreditCardBills();

      appState.transactions.unshift({
        id: 'tx_' + Date.now(),
        type: 'transfer',
        title: `${toAcc && isCreditCardType(toAcc.type) ? 'Bayar Tagihan Kartu' : 'Transfer'}: ${fromAcc ? fromAcc.name : ''} → ${toAcc ? toAcc.name : ''}`,
        amount,
        accountId: fromId,
        toAccountId: toId,
        date,
        userId: devicePrefs.activeUserId || 'u_admin'
      });

      persistHouseholdState();
      closeModal();
      renderApp();
      showToast(toAcc && isCreditCardType(toAcc.type) ? "Tagihan kartu dibayar & limit dipulihkan!" : "Transfer antar rekening berhasil!");
    }

    function deleteTransaction(txId) {
      const idx = appState.transactions.findIndex(t => t.id === txId);
      if (idx < 0) return;
      const tx = appState.transactions[idx];
      const acc = appState.accounts.find(a => a.id === tx.accountId);
      if (tx.type === 'transfer') {
        const toAcc = appState.accounts.find(a => a.id === tx.toAccountId);
        if (acc) {
          if (isCreditCardType(acc.type)) acc.balance = Math.max(0, (Number(acc.balance) || 0) - Number(tx.amount));
          else acc.balance = (Number(acc.balance) || 0) + Number(tx.amount);
        }
        if (toAcc) {
          if (isCreditCardType(toAcc.type)) toAcc.balance = Math.max(0, (Number(toAcc.balance) || 0) + Number(tx.amount));
          else toAcc.balance = (Number(toAcc.balance) || 0) - Number(tx.amount);
        }
      } else if (acc) {
        if (isCreditCardType(acc.type)) {
          acc.balance = Math.max(0, (Number(acc.balance) || 0) - (tx.type === 'expense' ? Number(tx.amount) : -Number(tx.amount)));
        } else {
          acc.balance = (Number(acc.balance) || 0) - (tx.type === 'income' ? tx.amount : -tx.amount);
        }
      }
      syncAllLinkedCreditCardBills();
      appState.transactions.splice(idx, 1);
      persistHouseholdState();
      renderApp();
      showToast("Transaksi dihapus");
    }

    function syncBillToScheduledList(bill) {
      if (!bill) return;
      const existingSchIdx = appState.scheduledTransactions.findIndex(s => s.linkedBillId === bill.id || s.id === bill.scheduledId);
      if (bill.syncScheduled) {
        const schPayload = {
          id: existingSchIdx >= 0 ? appState.scheduledTransactions[existingSchIdx].id : ('sch_' + Date.now()),
          title: bill.title,
          type: 'expense',
          amount: bill.amount,
          categoryId: bill.categoryId,
          accountId: bill.accountId,
          nextDate: bill.dueDate,
          frequency: bill.recurring === 'Sekali' ? 'Sekali' : bill.recurring,
          linkedBillId: bill.id,
          active: true
        };
        if (existingSchIdx >= 0) appState.scheduledTransactions[existingSchIdx] = schPayload;
        else appState.scheduledTransactions.push(schPayload);
        bill.scheduledId = schPayload.id;
      } else if (existingSchIdx >= 0) {
        appState.scheduledTransactions.splice(existingSchIdx, 1);
        bill.scheduledId = '';
      }
    }

    function payBillNow(billId) {
      const bill = appState.bills.find(b => b.id === billId);
      if (!bill) return;

      // Jika tagihan terhubung dengan Kartu Kredit / PayLater, arahkan ke modal pembayaran kartu agar memilih rekening sumber dana
      if (bill.linkedAccountId) {
        const linkedCard = appState.accounts.find(a => a.id === bill.linkedAccountId);
        if (linkedCard && isCreditCardType(linkedCard.type)) {
          openPayCreditCardModal(linkedCard.id, bill.id);
          return;
        }
      }

      const today = new Date().toISOString().split('T')[0];

      appState.transactions.unshift({
        id: 'tx_' + Date.now(),
        type: 'expense',
        title: `Bayar Tagihan: ${bill.title}`,
        amount: Number(bill.amount),
        categoryId: bill.categoryId,
        accountId: bill.accountId,
        date: today,
        userId: devicePrefs.activeUserId || 'u_admin',
        note: bill.note || ''
      });

      const acc = appState.accounts.find(a => a.id === bill.accountId);
      if (acc) acc.balance = (Number(acc.balance) || 0) - Number(bill.amount);

      bill.lastPaidDate = today;

      if (bill.recurring && bill.recurring !== 'Sekali') {
        bill.dueDate = addPeriodToDate(bill.dueDate, bill.recurring);
        bill.paid = false;
        syncBillToScheduledList(bill);
        showToast(`Tagihan dibayar! Jatuh tempo berikutnya: ${formatDateIndo(bill.dueDate)}`);
      } else {
        bill.paid = true;
        showToast("Tagihan berhasil dibayar & dicatat!");
      }

      persistHouseholdState();
      renderApp();
    }

      let accObj;

        accObj = appState.accounts.find(a => a.id === editAccId);
        if (accObj) {
          accObj.name = name;
          accObj.type = type;
          accObj.ownerId = ownerId;
          accObj.accountNumber = accountNumber;
          accObj.balance = balance;
          accObj.creditLimit = creditLimit;
          accObj.billingDueDay = billingDueDay;
          accObj.syncBill = syncBill;
        }
      } else {
        accObj = {
          id: 'acc_' + Date.now(),
          name, type, ownerId, accountNumber, balance,
          creditLimit, billingDueDay, syncBill
        };
        appState.accounts.push(accObj);
      }

      // Sinkronkan ke Tagihan Rutin & Transaksi Terjadwal jika Kartu Kredit / PayLater dicentang
      if (accObj && isCC) {
        const existingBillIdx = appState.bills.findIndex(b => b.linkedAccountId === accObj.id);
        if (syncBill) {
          const defaultCat = appState.categories.find(c => c.id === 'cat_tagihan') || appState.categories.find(c => c.type === 'expense');
          const dueDate = getNextDueDateFromDay(billingDueDay);
          if (existingBillIdx >= 0) {
            const b = appState.bills[existingBillIdx];
            b.title = `Tagihan ${accObj.name}`;
            b.amount = Math.max(0, Number(accObj.balance) || 0);
            b.dueDate = dueDate;
            b.recurring = 'Bulanan';
            b.accountId = accObj.id;
            b.syncScheduled = true;
            syncBillToScheduledList(b);
          } else {
            const newBill = {
              id: 'bill_cc_' + Date.now(),
              title: `Tagihan ${accObj.name}`,
              amount: Math.max(0, Number(accObj.balance) || 0),
              dueDate,
              categoryId: defaultCat ? defaultCat.id : '',
              accountId: accObj.id,
              linkedAccountId: accObj.id,
              recurring: 'Bulanan',
              syncScheduled: true,
              scheduledId: '',
              paid: false,
              lastPaidDate: '',
              note: `Plafon ${formatDots(creditLimit)} • Jatuh tempo tgl ${billingDueDay}`
            };
            appState.bills.push(newBill);
            syncBillToScheduledList(newBill);
          }
        } else if (existingBillIdx >= 0) {
          const removedId = appState.bills[existingBillIdx].id;
          appState.bills.splice(existingBillIdx, 1);
          appState.scheduledTransactions = appState.scheduledTransactions.filter(s => s.linkedBillId !== removedId);
        }
      }

      persistHouseholdState();
      closeModal();
      renderApp();
      showToast(isCC ? "Kartu Kredit / PayLater disimpan & dihubungkan ke tagihan!" : "Data rekening disimpan!");
    }

    function processCreditCardPayment(e, cardId, linkedBillId = '') {
      e.preventDefault();
      const card = appState.accounts.find(a => a.id === cardId);
      const sourceId = document.getElementById('cc-pay-source').value;
      const sourceAcc = appState.accounts.find(a => a.id === sourceId);
      const amount = parseDots(document.getElementById('cc-pay-amount').value);
      const date = document.getElementById('cc-pay-date').value;

      if (!card || !sourceAcc || !amount) return;

      sourceAcc.balance = (Number(sourceAcc.balance) || 0) - amount;
      card.balance = Math.max(0, (Number(card.balance) || 0) - amount);

      appState.transactions.unshift({
        id: 'tx_' + Date.now(),
        type: 'transfer',
        title: `Bayar Tagihan Kartu: ${card.name}`,
        amount,
        accountId: sourceAcc.id,
        toAccountId: card.id,
        date,
        userId: devicePrefs.activeUserId || 'u_admin'
      });

      const bill = linkedBillId
        ? appState.bills.find(b => b.id === linkedBillId)
        : appState.bills.find(b => b.linkedAccountId === card.id);

      if (bill) {
        bill.lastPaidDate = date;
        bill.amount = Math.max(0, Number(card.balance) || 0);
        if (bill.amount === 0) {
          bill.dueDate = addPeriodToDate(bill.dueDate, 'Bulanan');
        }
        if (bill.syncScheduled) syncBillToScheduledList(bill);
      }

      persistHouseholdState();
      closeModal();
      renderApp();
      showToast(`Pembayaran ${formatRupiah(amount)} ke ${card.name} berhasil! Limit otomatis pulih.`);
    }

    function executeScheduledNow(schId) {
      const sch = appState.scheduledTransactions.find(s => s.id === schId);
      if (!sch) return;
      if (sch.linkedBillId) {
        payBillNow(sch.linkedBillId);
        return;
      }

      const today = new Date().toISOString().split('T')[0];
      const amount = Number(sch.amount) || 0;
      appState.transactions.unshift({
        id: 'tx_' + Date.now(),
        type: sch.type,
        title: `[Terjadwal] ${sch.title}`,
        amount,
        categoryId: sch.categoryId || '',
        accountId: sch.accountId,
        date: today,
        userId: devicePrefs.activeUserId || 'u_admin'
      });

      const acc = appState.accounts.find(a => a.id === sch.accountId);
      if (acc) {
        if (isCreditCardType(acc.type)) {
          acc.balance = Math.max(0, (Number(acc.balance) || 0) + (sch.type === 'expense' ? amount : -amount));
          syncAllLinkedCreditCardBills();
        } else {
          acc.balance = (Number(acc.balance) || 0) + (sch.type === 'income' ? amount : -amount);
        }
      }

      if (sch.frequency && sch.frequency !== 'Sekali') {
        sch.nextDate = addPeriodToDate(sch.nextDate, sch.frequency);
      } else {
        appState.scheduledTransactions = appState.scheduledTransactions.filter(s => s.id !== schId);
      }

      persistHouseholdState();
      renderApp();
      showToast(`"${sch.title}" berhasil dijalankan!`);
    }

    function addLowStockItemToChecklist(invId, silent = false) {
      const item = appState.inventory.find(i => i.id === invId);
      if (!item) return;
      const exists = (appState.shoppingChecklist || []).some(c => !c.checked && c.name.toLowerCase() === item.name.toLowerCase());
      if (exists) {
        if (!silent) showToast(`${item.name} sudah ada di checklist belanja`);
        return;
      }
      const neededQty = Math.max(1, (Number(item.minQty) - Number(item.qty)) + 1);
      appState.shoppingChecklist.unshift({
        id: 'shp_' + Date.now() + Math.random().toString(36).slice(2, 5),
        name: item.name,
        qty: neededQty,
        unit: item.unit || 'pcs',
        estPrice: 0,
        checked: false,
        fromInventoryId: item.id
      });
      if (!silent) {
        persistHouseholdState();
        renderApp();
        showToast(`"${item.name}" ditambahkan ke Checklist Belanja!`);
      }
    }

    function addAllLowStockToChecklist() {
      const low = getLowStockItems();
      let added = 0;
      low.forEach(item => {
        const exists = (appState.shoppingChecklist || []).some(c => !c.checked && c.name.toLowerCase() === item.name.toLowerCase());
        if (!exists) {
          addLowStockItemToChecklist(item.id, true);
          added++;
        }
      });
      persistHouseholdState();
      rumahSubTab = 'checklist';
      renderApp();
      showToast(added > 0 ? `${added} barang menipis dimasukkan ke Checklist Belanja!` : "Semua barang menipis sudah ada di checklist.");
    }
