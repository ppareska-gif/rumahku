    function safeCreateIcons() {

          window.lucide.createIcons();
        }

    function safeRenderChart(canvasId, config) {
      try {
        if (typeof window.Chart === 'undefined') return false;
        const canvas = document.getElementById(canvasId);
        if (!canvas) return false;
        if (expenseChartInstance) {
          expenseChartInstance.destroy();
          expenseChartInstance = null;
        }
        expenseChartInstance = new window.Chart(canvas.getContext('2d'), config);
        return true;
      } catch (err) {

    /* =========================================================================
     * 4. FORMATTING, DATE & UTILITY HELPERS
     * ========================================================================= */
    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function generateId(prefix = 'id') {
      return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 7);
    }

    function generateFamilyCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 6; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    function sanitizeFamilyCode(raw) {
      const cleaned = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      return cleaned.length === 6 ? cleaned : '';
    }

    function formatRibuan(num) {
      const n = Math.round(Number(num) || 0);
      const sign = n < 0 ? '-' : '';
      return sign + Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function formatRupiah(num) {
      const n = Math.round(Number(num) || 0);
      const sign = n < 0 ? '-Rp ' : 'Rp ';
      return sign + Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function formatRibuanInput(el) {
      if (!el) return;
      const digits = String(el.value || '').replace(/\D/g, '');
      el.value = digits ? digits.replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '';
    }

    function parseRibuan(val) {
      if (typeof val === 'number') return Math.round(val);
      const cleaned = String(val || '').replace(/\./g, '').replace(/[^\d-]/g, '');
      return parseInt(cleaned, 10) || 0;
    }

    function getTodayISO() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function getCurrentMonthISO() {
      return getTodayISO().slice(0, 7);
    }

    function getIndonesianDateFull(dateObj = new Date()) {
      const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      const months = [
        'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
        'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
      ];
      return `${days[dateObj.getDay()]}, ${dateObj.getDate()} ${months[dateObj.getMonth()]} ${dateObj.getFullYear()}`;
    }

    function formatShortDateID(isoDate) {
      if (!isoDate) return '-';
      const parts = String(isoDate).split('-');
      if (parts.length !== 3) return isoDate;
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      const mIdx = parseInt(parts[1], 10) - 1;
      return `${parseInt(parts[2], 10)} ${months[mIdx] || parts[1]} ${parts[0]}`;
    }

    function getDaysDiffFromToday(isoDate) {
      if (!isoDate) return 999;
      const today = new Date(getTodayISO() + 'T00:00:00');
      const target = new Date(isoDate + 'T00:00:00');
      return Math.round((target - today) / (1000 * 60 * 60 * 24));
    }

    function getTimeGreeting() {
      const hr = new Date().getHours();
      if (hr >= 4 && hr < 11) return 'Selamat Pagi';
      if (hr >= 11 && hr < 15) return 'Selamat Siang';
      if (hr >= 15 && hr < 18) return 'Selamat Sore';
      return 'Selamat Malam';
    }

      try {

        ta.value = text;

        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) {
          showToast(successMsg, 'success');
          return;
        }
      } catch (e) {
        // Fallback below
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => showToast(successMsg, 'success'))
          .catch(() => showToast('Gagal menyalin teks secara otomatis.', 'error'));
      } else {
        showToast('Silakan salin teks secara manual.', 'info');
      }
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const styles = {
        success: 'bg-slate-900 text-white border-emerald-500/40',
        error: 'bg-rose-700 text-white border-rose-400',
        info: 'bg-slate-800 text-white border-slate-600'
      };
      const icons = {
        success: '✓',
        error: '!',
        info: 'i'
      };
      toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl border text-sm font-medium animate-toast ${styles[type] || styles.success}`;
      toast.innerHTML = `
        <span class="w-6 h-6 rounded-full bg-white/15 flex items-center justify-center text-xs font-bold shrink-0">${icons[type] || '✓'}</span>
        <span class="flex-1 leading-snug">${escapeHtml(message)}</span>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 3200);
    }

    /* =========================================================================
     * 6. ACCOUNT BALANCE & DUE SCHEDULED TRANSACTIONS ENGINE
     * ========================================================================= */
    function getAccountBalance(accountId) {
      const acc = appState.accounts.find(a => a.id === accountId);
      if (!acc) return 0;
      let balance = Number(acc.initialBalance) || 0;
      for (const tx of appState.transactions) {
        const amt = Number(tx.amount) || 0;
        if (tx.type === 'income' && tx.accountId === accountId) {
          balance += amt;
        } else if (tx.type === 'expense' && tx.accountId === accountId) {
          balance -= amt;
        } else if (tx.type === 'transfer') {
          if (tx.accountId === accountId) balance -= amt;
          if (tx.toAccountId === accountId) balance += amt;
        }
      }
      return balance;
    }

    function getTotalAllAccountsBalance() {
      return appState.accounts.reduce((sum, acc) => sum + getAccountBalance(acc.id), 0);
    }

    function advanceRecurringDate(isoDate, frequency) {
      const base = new Date((isoDate || getTodayISO()) + 'T00:00:00');
      if (frequency === 'Harian') {
        base.setDate(base.getDate() + 1);
      } else if (frequency === 'Mingguan') {
        base.setDate(base.getDate() + 7);
      } else if (frequency === 'Bulanan') {
        base.setMonth(base.getMonth() + 1);
      } else if (frequency === '3 Bulanan') {
        base.setMonth(base.getMonth() + 3);
      } else if (frequency === 'Tahunan') {
        base.setFullYear(base.getFullYear() + 1);
      } else {
        return ''; // 'Sekali'
      }
      const yyyy = base.getFullYear();
      const mm = String(base.getMonth() + 1).padStart(2, '0');
      const dd = String(base.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function processDueScheduledTransactions() {
      if (!appState || !Array.isArray(appState.scheduledTransactions)) return false;
      const today = getTodayISO();
      let changed = false;

      for (const item of appState.scheduledTransactions) {
        if (!item.active || !item.autoRecord || !item.nextDate) continue;
        let guard = 0;
        while (item.active && item.nextDate && item.nextDate <= today && guard < 12) {
          appState.transactions.unshift({
            id: generateId('tx'),
            type: item.type,
            amount: Number(item.amount) || 0,
            date: item.nextDate,
            categoryId: item.categoryId,
            subcategory: item.subcategory || '',
            accountId: item.accountId,
            toAccountId: '',
            memberId: item.memberId || appState.activeMemberId,
            note: `[Terjadwal Otomatis] ${item.title}`
          });
          changed = true;
          if (item.frequency === 'Sekali') {
            item.active = false;
            item.nextDate = '';
          } else {
            item.nextDate = advanceRecurringDate(item.nextDate, item.frequency);
          }
          guard++;
        }
      }
      return changed;
    }

    function updateSyncBadges(state, badgeText, errorCode = '', errorMessage = '') {
      syncStatus.state = state;
      syncStatus.badgeText = badgeText;
      syncStatus.errorCode = errorCode;
      syncStatus.errorMessage = errorMessage;

      const badgeIds = ['mobile-sync-badge', 'sidebar-sync-badge', 'header-sync-badge'];
      const colorMap = {
        live: 'bg-emerald-50 text-emerald-700 border-emerald-200',
        connecting: 'bg-amber-50 text-amber-700 border-amber-200',
        error: 'bg-rose-50 text-rose-700 border-rose-200',
        offline: 'bg-slate-100 text-slate-700 border-slate-300'
      };
      const cls = colorMap[state] || colorMap.connecting;

      badgeIds.forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = badgeText;
        el.className = `inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold border whitespace-nowrap ${cls}`;
      });
    }

    function getCleanSyncPayload() {
      return JSON.parse(JSON.stringify({
        familyCode: appState.familyCode,
        familyName: appState.familyName,
        themeId: appState.themeId,
        activeMemberId: appState.activeMemberId,
        updatedAt: appState.updatedAt || Date.now(),
        members: appState.members,
        accounts: appState.accounts,
        categories: appState.categories,
        transactions: appState.transactions,
        scheduledTransactions: appState.scheduledTransactions,
        bills: appState.bills,
        schedules: appState.schedules,
        inventory: appState.inventory,
        notes: appState.notes
      }));
    }

    function handleFirestoreError(err) {
      const code = (err && err.code) ? String(err.code) : 'unknown-error';
      const msg = (err && err.message) ? String(err.message) : 'Koneksi Firestore terganggu.';
      console.warn('[RumahKu Firestore]', code, msg);

      if (code === 'permission-denied') {
        updateSyncBadges('error', '• Lokal (Cek Rules)', code, msg);
      } else if (code === 'unavailable' || code === 'failed-precondition') {
        updateSyncBadges('offline', '• Lokal (Offline)', code, msg);
      } else {
        updateSyncBadges('error', '• Lokal (Error Sync)', code, msg);
      }

      if (uiState.activeTab === 'settings' && uiState.settingsSubTab === 'sync') {
        renderAll();
      }
    }

    function initFirebaseSync() {
      try {
        if (typeof window.firebase === 'undefined' || typeof window.firebase.initializeApp !== 'function') {
          updateSyncBadges('offline', '• Lokal (SDK Offline)', 'sdk-unavailable', 'Library Firebase tidak termuat (mode offline).');
          return;
        }

        if (!window.firebase.apps || window.firebase.apps.length === 0) {
          window.firebase.initializeApp(DEFAULT_FIREBASE_CONFIG);
        }

        firestoreDb = window.firebase.firestore();
        subscribeToFamilyDoc(appState.familyCode);
      } catch (err) {
        handleFirestoreError(err);
      }
    }

    function subscribeToFamilyDoc(familyCode) {
      if (!firestoreDb) return;
      if (typeof unsubscribeSnapshot === 'function') {
        try { unsubscribeSnapshot(); } catch (e) {}
        unsubscribeSnapshot = null;
      }

      updateSyncBadges('connecting', '• Menyinkronkan...');
      const docRef = firestoreDb.collection('rumahku_families').doc(familyCode);

      unsubscribeSnapshot = docRef.onSnapshot(
        (snap) => {
          if (!snap.exists) {
            // Document doesn't exist yet in Firestore -> save initial state automatically
            const payload = getCleanSyncPayload();
            docRef.set(payload)
              .then(() => {
                syncStatus.lastSyncedAt = new Date();
                updateSyncBadges('live', '• Live');
                if (uiState.activeTab === 'settings' && uiState.settingsSubTab === 'sync') renderAll();
              })
              .catch(handleFirestoreError);
            return;
          }

          const remoteData = snap.data();
          syncStatus.lastSyncedAt = new Date();
          updateSyncBadges('live', '• Live');

          if (remoteData && typeof remoteData === 'object') {
            isApplyingRemote = true;
            try {
              const localActiveMember = appState.activeMemberId;
              appState = Object.assign(createDefaultState(familyCode), remoteData, {
                familyCode: familyCode,
                // Keep current device's selected member profile if it still exists in family
                activeMemberId: (remoteData.members || []).some(m => m.id === localActiveMember)
                  ? localActiveMember
                  : (remoteData.activeMemberId || 'mem_ayah')
              });
              applyTheme(appState.themeId);
              renderAll();
            } finally {
              isApplyingRemote = false;
            }
          }
        },
        (err) => {
          handleFirestoreError(err);
        }
      );
    }

    function commitStateChange(skipRender = false) {
      appState.updatedAt = Date.now();
      if (!skipRender) {
        renderAll();
      }
      if (isApplyingRemote || !firestoreDb) return;

      try {
        const docRef = firestoreDb.collection('rumahku_families').doc(appState.familyCode);
        const payload = getCleanSyncPayload();
        docRef.set(payload, { merge: true })
          .then(() => {
            syncStatus.lastSyncedAt = new Date();
            if (syncStatus.state !== 'live') {
              updateSyncBadges('live', '• Live');
            }
          })
          .catch(handleFirestoreError);
      } catch (err) {
        handleFirestoreError(err);
      }
    }

    function joinFamilyCode(rawCode) {
      const clean = sanitizeFamilyCode(rawCode);
      if (!clean) {
        showToast('Kode Keluarga harus terdiri dari 6 huruf/angka.', 'error');
        return;
      }
      if (clean === appState.familyCode) {
        showToast('Anda sudah terhubung ke Kode Keluarga ini.', 'info');
        return;
      }
      appState.familyCode = clean;
      try {
        const url = new URL(window.location.href);
        url.searchParams.set('family', clean);
        window.history.replaceState({}, '', url.toString());
      } catch (e) {}

      renderHeaderAndSidebarMeta();
      if (firestoreDb) {
        subscribeToFamilyDoc(clean);
        showToast(`Menghubungkan ke keluarga ${clean}...`, 'info');
      } else {
        showToast(`Kode Keluarga diubah ke ${clean} (Mode Lokal).`, 'info');
        renderAll();
      }
    }

      let inviteUrl = '';
      try {
        const url = new URL(window.location.href);
        url.searchParams.set('family', appState.familyCode);
        inviteUrl = url.toString();
      } catch (e) {
        inviteUrl = `Kode Keluarga RumahKu: ${appState.familyCode}`;
      }
      copyTextSafe(inviteUrl, `Link undangan keluarga (${appState.familyCode}) disalin!`);

    /* =========================================================================
     * 8. THEME & ACCESSIBILITY (LARGE TEXT MODE)
     * ========================================================================= */
    function applyTheme(themeId) {
      const theme = COLOR_THEMES[themeId] || COLOR_THEMES.emerald;
      const root = document.documentElement;
      root.style.setProperty('--theme-primary', theme.primary);
      root.style.setProperty('--theme-dark', theme.dark);
      root.style.setProperty('--theme-darker', theme.darker);
      root.style.setProperty('--theme-soft', theme.soft);
      root.style.setProperty('--theme-border', theme.border);
      root.style.setProperty('--theme-text', theme.text);
      root.style.setProperty('--theme-ring', theme.ring);

      const metaTheme = document.getElementById('meta-theme-color');
      if (metaTheme) metaTheme.setAttribute('content', theme.primary);
    }

    function setAppTheme(themeId) {
      if (!COLOR_THEMES[themeId]) return;
      appState.themeId = themeId;
      applyTheme(themeId);
      commitStateChange();
      showToast(`Tema diubah ke ${COLOR_THEMES[themeId].name}`, 'success');
    }

    function toggleLargeTextMode() {
      uiState.largeText = !uiState.largeText;
      document.documentElement.classList.toggle('large-text-mode', uiState.largeText);
      renderHeaderAndSidebarMeta();
      if (uiState.activeTab === 'settings') renderAll();
      showToast(uiState.largeText ? 'Mode Teks Besar (18.5px) aktif' : 'Mode Teks Normal aktif', 'info');
    }

    /* =========================================================================
     * 9. NAVIGATION & HEADER RENDERING
     * ========================================================================= */
    function setActiveTab(tabId) {
      uiState.activeTab = tabId;
      renderAll();
      try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {}
    }

    function getActiveMember() {
      return appState.members.find(m => m.id === appState.activeMemberId) || appState.members[0] || {
        id: 'mem_ayah', name: 'Ayah', role: 'Kepala Keluarga', avatar: 'AY', color: '#059669'
      };
    }

    function renderHeaderAndSidebarMeta() {
      const member = getActiveMember();
      const code = appState.familyCode || '------';

      const setTxt = (id, val) => {
        const el = document.getElementById(id);
        if (el) el.textContent = val;
      };

      setTxt('mobile-family-code', code);
      setTxt('sidebar-family-code', code);
      setTxt('sidebar-family-subtitle', appState.familyName || 'Asisten Keluarga & Rumah');

      setTxt('mobile-avatar', member.avatar || member.name.slice(0, 2).toUpperCase());
      setTxt('mobile-member-name', member.name);
      setTxt('header-avatar', member.avatar || member.name.slice(0, 2).toUpperCase());
      setTxt('header-member-name', member.name);

      const textStatus = uiState.largeText ? 'Teks: Besar' : 'Teks: Normal';
      setTxt('sidebar-text-label', textStatus);
      setTxt('header-text-label', textStatus);

      const mobileTextBtn = document.getElementById('mobile-text-btn');
      if (mobileTextBtn) {

          : 'px-2.5 py-2 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs font-bold transition';
      }

      const activeNav = NAV_ITEMS.find(n => n.id === uiState.activeTab);
      setTxt('desktop-page-title', activeNav ? (activeNav.id === 'dashboard' ? 'Dashboard Ringkasan' : activeNav.label) : 'RumahKu');
    }

    function renderNavigation() {
      const desktopNav = document.getElementById('desktop-nav');
      const mobileNav = document.getElementById('mobile-nav');

      if (desktopNav) {
        desktopNav.innerHTML = NAV_ITEMS.map(item => {
          const active = uiState.activeTab === item.id;
          return `
            <button type="button" onclick="setActiveTab('${item.id}')"
              class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-sm font-semibold transition text-left ${
                active
                  ? 'bg-theme-soft text-theme-dark border border-theme-soft shadow-2xs'
                  : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900 border border-transparent'
              }">
              <i data-lucide="${item.icon}" class="w-4 h-4 shrink-0 ${active ? 'text-theme-primary' : 'text-slate-400'}"></i>
              <span class="truncate">${escapeHtml(item.label)}</span>
            </button>
          `;
        }).join('');
      }

      if (mobileNav) {
        mobileNav.innerHTML = NAV_ITEMS.map(item => {
          const active = uiState.activeTab === item.id;
          return `
            <button type="button" onclick="setActiveTab('${item.id}')"
              class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition shrink-0 ${

                  ? 'bg-theme-primary text-white shadow-xs'

              }">
              <i data-lucide="${item.icon}" class="w-3.5 h-3.5 shrink-0"></i>
              <span>${escapeHtml(item.shortLabel)}</span>
            </button>
          `;
        }).join('');
      }
    }

    function renderAll() {
      renderHeaderAndSidebarMeta();
      renderNavigation();

      const main = document.getElementById('app-main');
      if (!main) return;

      switch (uiState.activeTab) {
        case 'dashboard':
          main.innerHTML = renderDashboardView();
          renderExpenseChart();
          break;
        case 'finance':
          main.innerHTML = renderFinanceView();
          break;
        case 'bills':
          main.innerHTML = renderBillsView();
          break;
        case 'schedule':
          main.innerHTML = renderScheduleView();
          break;
        case 'inventory':
          main.innerHTML = renderInventoryView();
          break;
        case 'notes':
          main.innerHTML = renderNotesView();
          break;
        case 'settings':
          main.innerHTML = renderSettingsView();
          break;
        default:
          main.innerHTML = renderDashboardView();
          renderExpenseChart();
      }

      safeCreateIcons();
    }

    function renderExpenseChart() {
      const ym = getCurrentMonthISO();
      const map = {};
      for (const tx of appState.transactions) {
        if (tx.type === 'expense' && String(tx.date || '').startsWith(ym)) {
          map[tx.categoryId] = (map[tx.categoryId] || 0) + (Number(tx.amount) || 0);
        }
      }
      const entries = Object.entries(map).sort((a, b) => b[1] - a[1]);
      if (entries.length === 0) return;

      const labels = entries.map(([catId]) => {
        const c = appState.categories.find(x => x.id === catId);
        return c ? c.name : 'Lainnya';
      });
      const data = entries.map(([, val]) => val);
      const colors = entries.map(([catId]) => {
        const c = appState.categories.find(x => x.id === catId);
        return c ? c.color : '#64748b';
      });

      safeRenderChart('expense-donut-chart', {
        type: 'doughnut',
        data: {
          labels,
          datasets: [{
            data,
            backgroundColor: colors,
            borderWidth: 2,
            borderColor: '#ffffff'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '64%',
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (ctx) => ` ${ctx.label}: ${formatRupiah(ctx.raw)}`
              }
            }
          }
        }
      });
    }

    function executeScheduledTransactionNow(stId) {
      const st = appState.scheduledTransactions.find(x => x.id === stId);
      if (!st) return;
      appState.transactions.unshift({
        id: generateId('tx'),
        type: st.type,
        amount: Number(st.amount) || 0,
        date: getTodayISO(),
        categoryId: st.categoryId,
        subcategory: st.subcategory || '',
        accountId: st.accountId,
        toAccountId: '',
        memberId: st.memberId || appState.activeMemberId,
        note: `[Terjadwal] ${st.title}`
      });

      if (st.frequency === 'Sekali') {
        st.active = false;
        st.nextDate = '';
      } else {
        st.nextDate = advanceRecurringDate(st.nextDate || getTodayISO(), st.frequency);
      }

      commitStateChange();
      showToast(`"${st.title}" berhasil dicatat ke Keuangan!`, 'success');
    }

    function deleteTransaction(txId) {
      openConfirmModal('Hapus Transaksi?', 'Saldo rekening terkait akan otomatis disesuaikan kembali.', () => {
        appState.transactions = appState.transactions.filter(t => t.id !== txId);
        commitStateChange();
        showToast('Transaksi dihapus.', 'info');
      });
    }

    function deleteScheduledTx(stId) {
      openConfirmModal('Hapus Jadwal Transaksi?', 'Jadwal rutin ini akan dihapus permanen.', () => {
        appState.scheduledTransactions = appState.scheduledTransactions.filter(x => x.id !== stId);
        commitStateChange();
        showToast('Jadwal transaksi dihapus.', 'info');
      });
    }

    function toggleHomeScheduleComplete(id) {
      const item = appState.schedules.find(s => s.id === id);
      if (!item) return;

      if (!item.completed && item.frequency && item.frequency !== 'Sekali') {
        item.dueDate = advanceRecurringDate(item.dueDate, item.frequency);
        commitStateChange();
        showToast(`Selesai! Jadwal berikutnya otomatis diatur ke ${formatShortDateID(item.dueDate)}.`, 'success');
      } else {
        item.completed = !item.completed;
        commitStateChange();
        showToast(item.completed ? 'Agenda ditandai selesai!' : 'Agenda dibuka kembali.', 'success');
      }
    }

    function deleteHomeSchedule(id) {
      openConfirmModal('Hapus Agenda Rumah?', 'Agenda perawatan ini akan dihapus.', () => {
        appState.schedules = appState.schedules.filter(s => s.id !== id);
        commitStateChange();
        showToast('Agenda dihapus.', 'info');
      });
    }

    /* =========================================================================
     * 14. VIEW 5: STOK & BELANJA
     * ========================================================================= */
    function renderInventoryView() {
      const items = appState.inventory.filter(i => {
        if (uiState.inventoryFilterLow) {
          return Number(i.qty) <= Number(i.minQty) || i.toBuy;
        }
        return true;
      });

      const shoppingList = appState.inventory.filter(i => i.toBuy);
      const estTotal = shoppingList.reduce((s, i) => s + (Number(i.estPrice) || 0), 0);

      return `
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h1 class="font-display font-extrabold text-xl sm:text-2xl text-slate-900">Stok &amp; Daftar Belanja</h1>

            </div>
            <div class="flex flex-wrap items-center gap-2">
              ${shoppingList.length > 0 ? `
                <button type="button" onclick="openCheckoutRestockModal()"
                  class="px-4 py-2.5 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-bold shadow-sm transition">
                  ✓ Selesai Belanja &amp; Restock (${shoppingList.length})
                </button>
              ` : ''}
              <button type="button" onclick="openInventoryModal()"
                class="px-4 py-2.5 rounded-2xl bg-theme-primary hover-bg-theme-dark text-white text-xs sm:text-sm font-bold shadow-sm transition">
                + Tambah Item
              </button>
            </div>
          </div>

          <div class="flex flex-wrap items-center justify-between gap-3 bg-white p-4 rounded-2xl border border-slate-200">
            <div class="flex items-center gap-2">
              <button type="button" onclick="uiState.inventoryFilterLow=false; renderAll()"
                class="px-3.5 py-1.5 rounded-xl text-xs font-bold ${!uiState.inventoryFilterLow ? 'bg-theme-primary text-white' : 'bg-slate-100 text-slate-600'}">
                Semua Item (${appState.inventory.length})
              </button>
              <button type="button" onclick="uiState.inventoryFilterLow=true; renderAll()"
                class="px-3.5 py-1.5 rounded-xl text-xs font-bold ${uiState.inventoryFilterLow ? 'bg-rose-600 text-white' : 'bg-slate-100 text-slate-600'}">
                Perlu Beli / Menipis (${shoppingList.length})
              </button>
            </div>
            <div class="text-xs text-slate-600">
              Estimasi Belanja Tercentang: <strong class="text-slate-900">${formatRupiah(estTotal)}</strong>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            ${items.map(item => {
              const isLow = Number(item.qty) <= Number(item.minQty);
              return `
                <div class="bg-white rounded-3xl p-5 border ${isLow ? 'border-rose-200 bg-rose-50/15' : 'border-slate-200/90'} flex flex-col justify-between gap-4">
                  <div>
                    <div class="flex items-start justify-between gap-2">
                      <div>
                        <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">${escapeHtml(item.category || 'Umum')}</span>
                        <h3 class="font-bold text-base text-slate-900 mt-0.5">${escapeHtml(item.name)}</h3>
                      </div>
                      ${isLow
                        ? `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-rose-100 text-rose-700">Stok Menipis</span>`
                        : `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-700">Aman</span>`}
                    </div>

                    <div class="mt-4 flex items-center justify-between p-3 rounded-2xl bg-slate-50 border border-slate-200/70">
                      <div>
                        <div class="text-[11px] text-slate-500">Sisa Stok (Min: ${item.minQty})</div>
                        <div class="font-display font-extrabold text-lg text-slate-900">${item.qty} <span class="text-xs font-normal text-slate-500">${escapeHtml(item.unit)}</span></div>
                      </div>
                      <div class="flex items-center gap-1.5">
                        <button type="button" onclick="adjustInventoryQty('${item.id}', -1)"
                          class="w-9 h-9 rounded-xl bg-white border border-slate-200 hover:bg-slate-100 font-extrabold text-base text-slate-700 transition">−</button>
                        <button type="button" onclick="adjustInventoryQty('${item.id}', 1)"
                          class="w-9 h-9 rounded-xl bg-theme-primary text-white hover-bg-theme-dark font-extrabold text-base transition">+</button>
                      </div>
                    </div>

                    <div class="mt-3 flex items-center justify-between text-xs text-slate-500">
                      <span>Est. Harga Restock:</span>
                      <strong class="text-slate-800">${formatRupiah(item.estPrice)}</strong>
                    </div>
                  </div>

                    <label class="inline-flex items-center gap-2 cursor-pointer text-xs font-semibold text-slate-700">
                      <input type="checkbox" ${item.toBuy ? 'checked' : ''} onchange="toggleInventoryToBuy('${item.id}')"
                        class="w-4 h-4 rounded accent-emerald-600" />
                      <span>Masuk Daftar Belanja</span>
                    </label>
                    <div class="flex items-center gap-1">
                      <button type="button" onclick="openInventoryModal('${item.id}')" class="px-2 py-1 rounded-lg text-xs font-semibold text-slate-500 hover:bg-slate-100">Edit</button>
                      <button type="button" onclick="deleteInventoryItem('${item.id}')" class="px-2 py-1 rounded-lg text-xs font-semibold text-rose-600 hover:bg-rose-50">Hapus</button>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function adjustInventoryQty(id, delta) {
      const item = appState.inventory.find(i => i.id === id);
      if (!item) return;
      item.qty = Math.max(0, (Number(item.qty) || 0) + delta);
      if (item.qty <= Number(item.minQty)) {
        item.toBuy = true;
      }
      commitStateChange();
    }

    function toggleInventoryToBuy(id) {
      const item = appState.inventory.find(i => i.id === id);
      if (!item) return;
      item.toBuy = !item.toBuy;
      commitStateChange();
    }

    function deleteInventoryItem(id) {
      openConfirmModal('Hapus Item Stok?', 'Item ini akan dihapus dari daftar persediaan.', () => {
        appState.inventory = appState.inventory.filter(i => i.id !== id);
        commitStateChange();
        showToast('Item dihapus.', 'info');
      });
    }

    function renderNotesView() {
      const categories = ['all', ...new Set(appState.notes.map(n => n.category || 'Umum'))];
      const filtered = appState.notes.filter(n => {
        if (uiState.noteFilterCategory !== 'all' && (n.category || 'Umum') !== uiState.noteFilterCategory) return false;
        if (uiState.noteSearch) {
          const q = uiState.noteSearch.toLowerCase();
          if (!`${n.title} ${n.content}`.toLowerCase().includes(q)) return false;
        }
        return true;
      }).sort((a, b) => Number(b.pinned) - Number(a.pinned));

      return `

            <button type="button" onclick="openNoteModal()"
              class="px-4 py-2.5 rounded-2xl bg-theme-primary hover-bg-theme-dark text-white text-xs sm:text-sm font-bold shadow-sm transition self-start sm:self-auto">
              + Tambah Catatan

          <div class="flex flex-col sm:flex-row gap-3">
            <input type="text" value="${escapeHtml(uiState.noteSearch)}"
              oninput="uiState.noteSearch = this.value; renderAll()"
              placeholder="Cari kata sandi WiFi, ID pelanggan, kontak..."
              class="flex-1 px-4 py-2.5 rounded-2xl border border-slate-200 bg-white text-xs sm:text-sm focus-theme" />
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
              ${categories.map(cat => `
                <button type="button" onclick="uiState.noteFilterCategory='${escapeHtml(cat)}'; renderAll()"
                  class="px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap ${uiState.noteFilterCategory === cat ? 'bg-theme-primary text-white' : 'bg-white border border-slate-200 text-slate-600'}">
                  ${cat === 'all' ? 'Semua' : escapeHtml(cat)}
                </button>
              `).join('')}
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${filtered.map(note => `
              <div class="bg-white rounded-3xl p-5 border ${note.pinned ? 'border-theme-primary shadow-xs' : 'border-slate-200/90'} flex flex-col justify-between gap-4">
                <div>
                  <div class="flex items-start justify-between gap-2">
                    <div>
                      <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-theme-soft text-theme-dark">${escapeHtml(note.category || 'Umum')}</span>
                      <h3 class="font-bold text-base text-slate-900 mt-2">${escapeHtml(note.title)}</h3>
                    </div>
                    <button type="button" onclick="toggleNotePin('${note.id}')"
                      class="px-2.5 py-1 rounded-xl text-xs font-bold border ${note.pinned ? 'bg-amber-50 border-amber-200 text-amber-700' : 'bg-slate-50 border-slate-200 text-slate-500'}"
                      title="Sematkan ke atas">
                      ${note.pinned ? '📌 Dipin' : 'Pin'}
                    </button>
                  </div>

                  <pre class="mt-3 p-3.5 rounded-2xl bg-slate-50 border border-slate-200/80 text-xs sm:text-sm text-slate-700 whitespace-pre-wrap font-sans leading-relaxed">${escapeHtml(note.content)}</pre>
                </div>

                <div class="flex items-center justify-between pt-3 border-t border-slate-100">
                  <button type="button" onclick="copyNoteContent('${note.id}')"
                    class="px-3.5 py-1.5 rounded-xl bg-theme-soft text-theme-dark hover:opacity-90 text-xs font-bold transition">
                    📋 Salin Isi
                  </button>
                  <div class="flex items-center gap-1">
                    <button type="button" onclick="openNoteModal('${note.id}')" class="px-2.5 py-1.5 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100">Edit</button>
                    <button type="button" onclick="deleteNote('${note.id}')" class="px-2.5 py-1.5 rounded-xl text-xs font-semibold text-rose-600 hover:bg-rose-50">Hapus</button>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function toggleNotePin(id) {
      const n = appState.notes.find(x => x.id === id);
      if (!n) return;
      n.pinned = !n.pinned;
      commitStateChange();
    }

    function copyNoteContent(id) {
      const n = appState.notes.find(x => x.id === id);
      if (!n) return;
      copyTextSafe(n.content, `Isi catatan "${n.title}" disalin!`);
    }

    function deleteNote(id) {
      openConfirmModal('Hapus Catatan?', 'Catatan ini akan dihapus permanen.', () => {
        appState.notes = appState.notes.filter(n => n.id !== id);
        commitStateChange();
        showToast('Catatan dihapus.', 'info');
      });
    }

    function exportJsonBackup() {
      try {
        const dataStr = JSON.stringify(getCleanSyncPayload(), null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `RumahKu_${appState.familyCode}_${getTodayISO()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('File backup JSON berhasil diunduh!', 'success');
      } catch (e) {
        showToast('Gagal mengekspor file JSON.', 'error');
      }
    }

    function importJsonBackup(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || !Array.isArray(parsed.accounts) || !Array.isArray(parsed.categories)) {
            showToast('Format file backup JSON tidak valid.', 'error');
            return;
          }
          const keepCode = appState.familyCode;
          appState = Object.assign(createDefaultState(keepCode), parsed, { familyCode: keepCode });
          applyTheme(appState.themeId);
          commitStateChange();
          showToast('Data backup JSON berhasil dipulihkan!', 'success');
        } catch (err) {
          showToast('Gagal membaca file JSON.', 'error');
        }
      };
      reader.readAsText(file);
    }

    function submitCheckoutRestock(e) {
      e.preventDefault();
      const checked = appState.inventory.filter(i => i.toBuy);
      const total = parseRibuan(document.getElementById('restock-total').value);
      const recordTx = document.getElementById('restock-record-tx').checked;
      const accountId = document.getElementById('restock-account').value;

      checked.forEach(item => {
        item.qty = Math.max(Number(item.minQty) + 2, Number(item.qty) + 2);
        item.toBuy = false;
      });

      if (recordTx && total > 0) {
        appState.transactions.unshift({
          id: generateId('tx'),
          type: 'expense',
          amount: total,
          date: getTodayISO(),
          categoryId: 'cat_exp_dapur',
          subcategory: 'Beras & Sembako',
          accountId,
          toAccountId: '',
          memberId: appState.activeMemberId,
          note: `Belanja & Restock (${checked.map(x => x.name).join(', ')})`
        });
      }

      closeModal();
      commitStateChange();
      showToast('Stok berhasil diperbarui!', 'success');
    }

          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-600">Batal</button>
            <button type="submit" class="px-4 py-2 rounded-xl bg-theme-primary text-white text-xs font-bold">Simpan Rekening</button>
          </div>
        </form>
      `);
    }

    function submitAccountForm(e, editId) {
      e.preventDefault();
      const payload = {
        id: editId || generateId('acc'),
        type: document.getElementById('acc-type').value,
        name: document.getElementById('acc-name').value.trim(),
        institution: document.getElementById('acc-inst').value.trim() || 'Bank / Dompet',
        last4: document.getElementById('acc-last4').value.trim(),
        ownerId: document.getElementById('acc-owner').value,
        initialBalance: parseRibuan(document.getElementById('acc-init').value)
      };
      if (!payload.name) return;
      if (editId) {
        const idx = appState.accounts.findIndex(a => a.id === editId);
        if (idx >= 0) appState.accounts[idx] = payload;
      } else {
        appState.accounts.push(payload);
      }
      closeModal();
      commitStateChange();
      showToast('Rekening/dompet disimpan!', 'success');
    }

    function openMemberModal(editId = null) {
      const mem = editId ? appState.members.find(m => m.id === editId) : null;
      openModal(mem ? 'Edit Anggota Keluarga' : 'Tambah Anggota Keluarga', `
        <form onsubmit="submitMemberForm(event, '${mem ? mem.id : ''}')" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Nama Panggilan</label>
              <input type="text" id="mem-name" required value="${mem ? escapeHtml(mem.name) : ''}" placeholder="Contoh: Adik / Kakek"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus-theme" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Peran di Keluarga</label>
              <input type="text" id="mem-role" value="${mem ? escapeHtml(mem.role) : 'Anggota Keluarga'}"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus-theme" />
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">PIN Keamanan 4 Digit (Opsional - kosongkan jika tanpa PIN)</label>
            <input type="text" id="mem-pin" maxlength="4" inputmode="numeric" pattern="[0-9]*"
              value="${mem ? escapeHtml(mem.pin || '') : ''}" placeholder="Contoh: 1234"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 font-mono text-sm focus-theme" />
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-600">Batal</button>
            <button type="submit" class="px-4 py-2 rounded-xl bg-theme-primary text-white text-xs font-bold">Simpan Anggota</button>
          </div>
        </form>
      `);
    }

    function submitMemberForm(e, editId) {
      e.preventDefault();
      const name = document.getElementById('mem-name').value.trim();
      const role = document.getElementById('mem-role').value.trim() || 'Anggota Keluarga';
      const pinRaw = document.getElementById('mem-pin').value.replace(/\D/g, '').slice(0, 4);

      if (!name) return;
      if (pinRaw && pinRaw.length !== 4) {
        showToast('PIN harus tepat 4 angka atau dikosongkan.', 'error');
        return;
      }

      const payload = {
        id: editId || generateId('mem'),
        name,
        role,
        avatar: name.slice(0, 2).toUpperCase(),
        color: '#059669',
        pin: pinRaw
      };

      if (editId) {
        const idx = appState.members.findIndex(m => m.id === editId);
        if (idx >= 0) appState.members[idx] = payload;
      } else {
        appState.members.push(payload);
      }

      closeModal();
      commitStateChange();
      showToast('Data anggota keluarga disimpan!', 'success');
    }

    /* =========================================================================
     * 18. PWA SERVICE WORKER SAFE REGISTRATION & BOOTSTRAP STARTUP
     * ========================================================================= */
    function registerPwaSafely() {
      try {
        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.protocol === 'http:')) {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        }
      } catch (e) {}
    }

    function bootstrapRumahKu() {
      // STEP 1: Load local state and render the entire UI FIRST (zero blocking)
      loadLocalState();
      processDueScheduledTransactions();
      renderAll();
      safeCreateIcons();

      // STEP 2: Connect to Firebase Firestore in the background
      initFirebaseSync();

      // STEP 3: Register PWA Service Worker safely
      registerPwaSafely();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrapRumahKu);
    } else {
      bootstrapRumahKu();
    }
  </script>
</body>
</html>
