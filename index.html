<!DOCTYPE html>
<html lang="id">
<head>

  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- Tailwind CSS -->

      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            cream: '#FAF8F4',
            sand: '#F3EFE6',

<body class="antialiased selection:bg-forest selection:text-white">

  <!-- ==================== TOAST NOTIFICATION ==================== -->

  <!-- ==================== 1. AUTH GATE (LOGIN / REGISTER AKUN KELUARGA) ==================== -->

        <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Manajemen Keuangan, Tagihan, Tugas & Stok Keluarga</p>

        <button id="tab-login-btn" onclick="switchAuthTab('login')" class="py-2.5 text-xs font-bold rounded-xl bg-forest text-white shadow-sm transition">

      <!-- Form Login -->

          <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1.5">Email / ID Akun Keluarga</label>

    <!-- FLOATING '+' QUICK ADD BUTTON (Positioned bottom-20 right-4 so it never overlaps header controls) -->

      <i data-lucide="plus" class="w-6 h-6 text-gold-light"></i>
    </button>

    <!-- BOTTOM 5-TAB NAVIGATION -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-lg z-40 bg-white/95 dark:bg-[#181D1A]/95 backdrop-blur-md border-t border-forest/10 dark:border-white/10 px-2 py-1.5">

        <button onclick="navigateTo('beranda')" data-nav="beranda" class="nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl text-forest dark:text-emerald-400 font-bold transition">

        <button onclick="navigateTo('kalender')" data-nav="kalender" class="nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 font-medium transition">

  <!-- ==================== 4. UNIVERSAL MODAL SHELL ==================== -->
  <div id="modal-backdrop" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div id="modal-box" class="w-full max-w-md bg-white dark:bg-[#1B201D] rounded-t-3xl sm:rounded-3xl p-5 sm:p-6 max-h-[90vh] overflow-y-auto shadow-2xl animate-in">

        <button onclick="closeModal()" class="w-8 h-8 rounded-xl bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-500 hover:text-gray-800">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div id="modal-body"></div>
    </div>

  <script>
    /* =========================================================================
       1. FIREBASE & DEVICE-ISOLATED CONFIGURATION
       ========================================================================= */
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyForRumahKuWebApp",
      authDomain: "rumahku-362c4.firebaseapp.com",
      projectId: "rumahku-362c4",
      storageBucket: "rumahku-362c4.firebasestorage.app",
      messagingSenderId: "102938475610",
      appId: "1:102938475610:web:rumahku362c4app"
    };

    let db = null;
    let unsubscribeSnapshot = null;
    let isCloudConnected = false;
    let lastSyncError = "";
    let deferredInstallPrompt = null;

    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.firestore();
    } catch (err) {
      console.warn("Firebase init fallback:", err);
      lastSyncError = err.message;
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
    });

    /* =========================================================================
       2. STRICT PER-DEVICE / PER-PROFILE ISOLATION STATE (UPGRADE #7)
       Device-specific UI preferences (darkMode, largeText, activeUserId,
       isProfileSelected, hideBalances, revealedAccountIds) NEVER sync to Firestore!
       ========================================================================= */
    const DEVICE_PREFS_KEY = "rumahku_device_prefs_v1";
    const SESSION_KEY = "rumahku_session_v2";
    const LOCAL_DATA_PREFIX = "rumahku_data_v2_";

    let devicePrefs = {
      darkMode: false,
      largeText: false,
      activeUserId: null,
      isProfileSelected: false,
      hideBalances: false,
      revealedAccountIds: [] // Array of account IDs whose full number is unmasked on THIS device
    };

    function loadDevicePrefs() {
      try {
        const raw = localStorage.getItem(DEVICE_PREFS_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          devicePrefs = {
            darkMode: !!parsed.darkMode,
            largeText: !!parsed.largeText,
            activeUserId: parsed.activeUserId || null,
            isProfileSelected: !!parsed.isProfileSelected,
            hideBalances: !!parsed.hideBalances,
            revealedAccountIds: Array.isArray(parsed.revealedAccountIds) ? parsed.revealedAccountIds : []
          };
        }
      } catch (e) {
        console.warn("Gagal memuat preferensi perangkat:", e);
      }
      applyDevicePreferencesToDOM();
    }

    function saveDevicePrefs() {
      try {
        localStorage.setItem(DEVICE_PREFS_KEY, JSON.stringify(devicePrefs));
      } catch (e) {
        console.warn("Gagal menyimpan preferensi perangkat:", e);
      }
      applyDevicePreferencesToDOM();
    }

    function applyDevicePreferencesToDOM() {
      const html = document.documentElement;
      if (devicePrefs.darkMode) {
        html.classList.add('dark');
      } else {
        html.classList.remove('dark');
      }
      if (devicePrefs.largeText) {
        html.classList.add('text-large');
      } else {
        html.classList.remove('text-large');
      }
      const icon = document.getElementById('header-theme-icon');
      if (icon) {
        icon.setAttribute('data-lucide', devicePrefs.darkMode ? 'sun' : 'moon');
        if (window.lucide) lucide.createIcons();
      }
    }

    function toggleDeviceDarkMode() {
      devicePrefs.darkMode = !devicePrefs.darkMode;
      saveDevicePrefs();
      showToast(devicePrefs.darkMode ? "Mode Malam aktif (khusus perangkat ini)" : "Mode Siang aktif (khusus perangkat ini)");
      if (currentRoute === 'setting') renderApp();
    }

    function toggleDeviceLargeText() {
      devicePrefs.largeText = !devicePrefs.largeText;
      saveDevicePrefs();
      showToast(devicePrefs.largeText ? "Ukuran teks diperbesar" : "Ukuran teks normal");
      renderApp();
    }

    function toggleGlobalBalancePrivacy() {
      devicePrefs.hideBalances = !devicePrefs.hideBalances;
      saveDevicePrefs();
      renderApp();
    }

    function toggleAccountNumberVisibility(accId) {
      const idx = devicePrefs.revealedAccountIds.indexOf(accId);
      if (idx >= 0) {
        devicePrefs.revealedAccountIds.splice(idx, 1);
      } else {
        devicePrefs.revealedAccountIds.push(accId);
      }
      saveDevicePrefs();
      renderApp();
    }

    /* =========================================================================
       3. SHARED HOUSEHOLD STATE (SYNCED VIA FIRESTORE)
       ========================================================================= */
    let currentSession = null; // { accountId, collectionName, isDemo }
    let currentRoute = 'beranda';
    let keuanganSubTab = 'transaksi'; // 'transaksi' | 'terjadwal' | 'tagihan' | 'rekening'
    let rumahSubTab = 'stok'; // 'stok' | 'checklist' | 'tugas' | 'catatan'
    let settingSubTab = 'tema'; // 'tema' | 'kategori' | 'rekening' | 'anggota' | 'akun'
    let calendarMonthOffset = 0;
    let pendingPickerUserId = null;

    function createDefaultHouseholdState(familyName = "Keluarga Harmoni", adminName = "Ayah", adminPass = "1234") {
      const today = new Date().toISOString().split('T')[0];
      const nextWeek = new Date(Date.now() + 7 * 86400000).toISOString().split('T')[0];
      const nextMonth = addPeriodToDate(today, 'Bulanan');

      return {

    /* =========================================================================
       4. UTILITY FUNCTIONS (NUMBER FORMATTING, MASKING, DATES, TOAST)

    function formatRupiah(num) {
      if (devicePrefs.hideBalances) return "Rp •••••••";
      const n = Number(num) || 0;
      const prefix = n < 0 ? "-Rp " : "Rp ";
      return prefix + Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function formatRupiahPlain(num) {
      const n = Number(num) || 0;
      const prefix = n < 0 ? "-Rp " : "Rp ";
      return prefix + Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function formatDots(val) {
      const digits = String(val).replace(/\D/g, '');
      if (!digits) return '';
      return digits.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function parseDots(val) {
      if (typeof val === 'number') return val;
      const digits = String(val || '').replace(/\D/g, '');
      return digits ? parseInt(digits, 10) : 0;
    }

    function handleCurrencyInput(el) {
      const cursor = el.selectionStart;
      const prevLen = el.value.length;
      el.value = formatDots(el.value);
      const newLen = el.value.length;
      const diff = newLen - prevLen;
      try {
        el.setSelectionRange(Math.max(0, cursor + diff), Math.max(0, cursor + diff));
      } catch (e) {}
    }

    // UPGRADE #3: Mask account number showing only last 4 digits unless revealed on this device
    function formatAccountNumberDisplay(acc) {
      const raw = (acc.accountNumber || '').trim();
      if (!raw) return 'Tanpa nomor rekening';
      const isRevealed = devicePrefs.revealedAccountIds.includes(acc.id);
      if (isRevealed) {
        return raw.replace(/(.{4})/g, '$1 ').trim();
      }
      if (raw.length <= 4) return raw;
      const last4 = raw.slice(-4);
      return `•••••••• ${last4}`;
    }

    function copyTextToClipboard(text, label = "Teks") {
      if (!text) return;
      const temp = document.createElement('textarea');
      temp.value = text;
      document.body.appendChild(temp);
      temp.select();
      try {
        document.execCommand('copy');
        showToast(`${label} berhasil disalin!`);
      } catch (e) {
        showToast(`Gagal menyalin ${label}`, 'error');
      }
      document.body.removeChild(temp);
    }

    function addPeriodToDate(dateStr, period) {
      const d = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
      if (isNaN(d.getTime())) return new Date().toISOString().split('T')[0];
      if (period === 'Mingguan') {
        d.setDate(d.getDate() + 7);
      } else if (period === 'Bulanan') {
        d.setMonth(d.getMonth() + 1);
      } else if (period === 'Tahunan') {
        d.setFullYear(d.getFullYear() + 1);
      }
      return d.toISOString().split('T')[0];
    }

    function formatDateIndo(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(dateStr + 'T00:00:00');
      if (isNaN(d.getTime())) return dateStr;
      return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const el = document.createElement('div');
      const bg = type === 'error'
        ? 'bg-red-600 text-white'
        : type === 'warning'
          ? 'bg-amber-600 text-white'
          : 'bg-forest text-white';
      el.className = `${bg} px-4 py-3 rounded-2xl shadow-lg text-xs font-semibold flex items-center justify-between gap-2 animate-in pointer-events-auto`;
      el.innerHTML = `<span>${message}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s';
        setTimeout(() => el.remove(), 260);
      }, 2800);
    }

    async function handleFamilyLogin(e) {
      e.preventDefault();
      const rawId = document.getElementById('login-account-id').value.trim();
      const pass = document.getElementById('login-account-pass').value;
      const docId = sanitizeAccountDocId(rawId);
      if (!docId) return;

      const btn = document.getElementById('btn-login-submit');
      btn.disabled = true;
      btn.innerHTML = `<span>Menghubungkan...</span>`;

      try {
        if (db) {
          // Check rumahku_accounts first, fallback to rumahku_families
          let snap = await db.collection('rumahku_accounts').doc(docId).get();
          let colName = 'rumahku_accounts';
          if (!snap.exists) {
            const famSnap = await db.collection('rumahku_families').doc(rawId.toUpperCase()).get();
            if (famSnap.exists) {
              snap = famSnap;
              colName = 'rumahku_families';
            }
          }

          if (snap.exists) {
            const data = snap.data();
            if (data.accountPassword && data.accountPassword !== pass) {
              showToast("Kata sandi akun keluarga salah!", "error");
              btn.disabled = false;
              btn.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i><span>Masuk ke RumahKu</span>`;
              lucide.createIcons();
              return;
            }
            const realDocId = snap.id;
            currentSession = { accountId: realDocId, collectionName: colName, isDemo: false };
            localStorage.setItem(SESSION_KEY, JSON.stringify(currentSession));
            devicePrefs.isProfileSelected = false;
            saveDevicePrefs();
            mergeIncomingState(data);
            startFirestoreListener();
            bootUIAfterSession();
            return;
          }
        }

        // Fallback check local storage if offline
        const localSaved = localStorage.getItem(LOCAL_DATA_PREFIX + docId);
        if (localSaved) {
          const parsed = JSON.parse(localSaved);
          if (parsed.accountPassword && parsed.accountPassword !== pass) {
            showToast("Kata sandi lokal salah!", "error");
            return;
          }
          currentSession = { accountId: docId, collectionName: 'rumahku_accounts', isDemo: false };
          localStorage.setItem(SESSION_KEY, JSON.stringify(currentSession));
          devicePrefs.isProfileSelected = false;
          saveDevicePrefs();
          mergeIncomingState(parsed);
          startFirestoreListener();
          bootUIAfterSession();
        } else {
          showToast("Akun keluarga tidak ditemukan. Silakan buat akun baru.", "error");
        }
      } catch (err) {
        console.error(err);
        lastSyncError = err.message;
        showToast("Gagal terhubung ke server: " + err.message, "error");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i><span>Masuk ke RumahKu</span>`;
        lucide.createIcons();
      }
    }

    // Merge ONLY shared household data from Firestore; NEVER overwrite devicePrefs!
    function mergeIncomingState(remote) {
      if (!remote || typeof remote !== 'object') return;
      appState = {
        ...createDefaultHouseholdState(),
        ...appState,
        familyName: remote.familyName || appState.familyName,
        accountPassword: remote.accountPassword || appState.accountPassword,
        accountEmail: remote.accountEmail || appState.accountEmail,
        users: Array.isArray(remote.users) && remote.users.length ? remote.users : appState.users,
        accounts: Array.isArray(remote.accounts) ? remote.accounts : appState.accounts,
        categories: Array.isArray(remote.categories) && remote.categories.length ? remote.categories : appState.categories,
        transactions: Array.isArray(remote.transactions) ? remote.transactions : [],
        scheduledTransactions: Array.isArray(remote.scheduledTransactions) ? remote.scheduledTransactions : [],
        bills: Array.isArray(remote.bills) ? remote.bills : [],
        tasks: Array.isArray(remote.tasks) ? remote.tasks : [],
        inventory: Array.isArray(remote.inventory) ? remote.inventory : [],
        shoppingChecklist: Array.isArray(remote.shoppingChecklist) ? remote.shoppingChecklist : [],
        notes: Array.isArray(remote.notes) ? remote.notes : []
      };
      saveLocalMirror();
    }

    function saveLocalMirror() {
      if (!currentSession) return;
      try {
        localStorage.setItem(LOCAL_DATA_PREFIX + currentSession.accountId, JSON.stringify(appState));
      } catch (e) {}
    }

    async function persistHouseholdState() {
      saveLocalMirror();
      updateSyncBadges();
      if (!db || !currentSession || currentSession.isDemo) return;
      try {
        // Only write shared household fields to Firestore (strictly excluding devicePrefs)
        const payload = {
          familyName: appState.familyName,
          accountPassword: appState.accountPassword || '',
          accountEmail: appState.accountEmail || currentSession.accountId,
          users: appState.users,
          accounts: appState.accounts,
          categories: appState.categories,
          transactions: appState.transactions,
          scheduledTransactions: appState.scheduledTransactions,
          bills: appState.bills,
          tasks: appState.tasks,
          inventory: appState.inventory,
          shoppingChecklist: appState.shoppingChecklist,
          notes: appState.notes,
          updatedAt: new Date().toISOString()
        };
        await db.collection(currentSession.collectionName).doc(currentSession.accountId).set(payload, { merge: true });
        isCloudConnected = true;
        lastSyncError = "";
        updateSyncBadges();
      } catch (err) {
        console.warn("Sync write error:", err);
        isCloudConnected = false;
        lastSyncError = err.message;
        updateSyncBadges();
      }
    }

    function startFirestoreListener() {
      if (unsubscribeSnapshot) {
        unsubscribeSnapshot();
        unsubscribeSnapshot = null;
      }
      if (!db || !currentSession || currentSession.isDemo) {
        isCloudConnected = false;
        updateSyncBadges();
        return;
      }

      unsubscribeSnapshot = db.collection(currentSession.collectionName)
        .doc(currentSession.accountId)
        .onSnapshot((doc) => {
          isCloudConnected = true;
          lastSyncError = "";
          updateSyncBadges();
          if (doc.exists) {
            mergeIncomingState(doc.data());
            if (devicePrefs.isProfileSelected) {
              renderApp();
            } else {
              renderProfilePicker();
            }
          }
        }, (err) => {
          console.warn("Firestore snapshot error:", err);
          isCloudConnected = false;
          lastSyncError = err.message;
          updateSyncBadges();
        });
    }

    function updateSyncBadges() {
      const pill = document.getElementById('sync-status-pill');
      const pickerBadge = document.getElementById('picker-sync-badge');
      if (pill) {
        if (isCloudConnected) {
          pill.className = "inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300";
          pill.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Live`;
        } else {
          pill.className = "inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300";
          pill.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span> Lokal`;
        }
      }
      if (pickerBadge) {
        pickerBadge.innerHTML = isCloudConnected
          ? `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> Terhubung Cloud (Live)`
          : `<span class="w-2 h-2 rounded-full bg-amber-500"></span> Mode Lokal`;
      }
    }

        document.getElementById('app-shell').classList.remove('hidden');
        renderApp();

    function renderProfilePicker() {

      grid.innerHTML = appState.users.map(u => `

    function selectPickerUser(userId) {
      const user = appState.users.find(u => u.id === userId);
      if (!user) return;
      if (!user.password) {
        // No password set on this profile
        devicePrefs.activeUserId = user.id;
        devicePrefs.isProfileSelected = true;
        saveDevicePrefs();
        document.getElementById('profile-picker-screen').classList.add('hidden');
        document.getElementById('app-shell').classList.remove('hidden');
        renderApp();
        return;
      }
      pendingPickerUserId = user.id;
      document.getElementById('selected-picker-name').textContent = user.name;
      const form = document.getElementById('profile-pass-form');
      const input = document.getElementById('profile-pass-input');
      form.classList.remove('hidden');
      input.value = '';
      input.focus();
    }

    function cancelProfilePassword() {
      pendingPickerUserId = null;
      document.getElementById('profile-pass-form').classList.add('hidden');
    }

    function verifyProfilePassword(e) {
      e.preventDefault();
      const user = appState.users.find(u => u.id === pendingPickerUserId);
      const input = document.getElementById('profile-pass-input').value;
      if (!user) return;
      if (input !== user.password) {
        showToast("Kata sandi profil salah!", "error");
        return;
      }
      devicePrefs.activeUserId = user.id;
      devicePrefs.isProfileSelected = true;
      saveDevicePrefs();
      document.getElementById('profile-picker-screen').classList.add('hidden');
      document.getElementById('app-shell').classList.remove('hidden');
      renderApp();
      showToast(`Selamat datang, ${user.name}!`);
    }

      const avatar = document.getElementById('header-user-avatar');
      avatar.textContent = user.name.charAt(0).toUpperCase();
      avatar.style.backgroundColor = user.avatarColor || '#214E2A';

      // Bottom Nav Active Styling
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const target = btn.getAttribute('data-nav');
        if (target === currentRoute) {
          btn.className = "nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl bg-forest-soft dark:bg-emerald-950/60 text-forest dark:text-emerald-400 font-bold transition relative";
        } else {
          btn.className = "nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 font-medium transition relative";
        }
      });

      // Low stock red dot badge on Rumah tab
      const lowItems = getLowStockItems();
      const dot = document.getElementById('nav-lowstock-dot');
      if (dot) {
        if (lowItems.length > 0) dot.classList.remove('hidden');
        else dot.classList.add('hidden');
      }
    }

    /* =========================================================================
       8. MAIN RENDER DISPATCHER
       ========================================================================= */
    function renderApp() {
      if (!currentSession || !devicePrefs.isProfileSelected) return;
      updateHeaderAndNavUI();
      const main = document.getElementById('main-content');
      if (!main) return;

      if (currentRoute === 'beranda') {
        main.innerHTML = renderBerandaView();
      } else if (currentRoute === 'keuangan') {
        main.innerHTML = renderKeuanganView();
      } else if (currentRoute === 'kalender') {
        main.innerHTML = renderKalenderView();
      } else if (currentRoute === 'rumah') {
        main.innerHTML = renderRumahView();
      } else if (currentRoute === 'setting') {
        main.innerHTML = renderSettingView();
      }

      lucide.createIcons();
    }

       9. VIEW 1: BERANDA (DASHBOARD)

    /* =========================================================================
       11. VIEW 3: KALENDER KELUARGA
       ========================================================================= */
    function renderKalenderView() {
      const now = new Date();
      const target = new Date(now.getFullYear(), now.getMonth() + calendarMonthOffset, 1);
      const year = target.getFullYear();
      const month = target.getMonth();
      const monthLabel = target.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = new Date().toISOString().split('T')[0];

      // Gather events for this month
      const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;
      const monthBills = (appState.bills || []).filter(b => (b.dueDate || '').startsWith(monthPrefix));
      const monthTasks = (appState.tasks || []).filter(t => (t.dueDate || '').startsWith(monthPrefix));

      let cells = '';
      for (let i = 0; i < firstDay; i++) {
        cells += `<div class="h-10"></div>`;
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const dStr = `${monthPrefix}-${String(d).padStart(2, '0')}`;
        const hasBill = monthBills.some(b => b.dueDate === dStr);
        const hasTask = monthTasks.some(t => t.dueDate === dStr);
        const isToday = dStr === todayStr;
        cells += `
          <div class="h-10 rounded-xl flex flex-col items-center justify-center relative ${isToday ? 'bg-forest text-white font-extrabold' : 'bg-cream/60 dark:bg-black/25 text-xs font-semibold'}">
            <span>${d}</span>
            <div class="flex gap-0.5 mt-0.5">
              ${hasBill ? `<span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>` : ''}
              ${hasTask ? `<span class="w-1.5 h-1.5 rounded-full bg-gold"></span>` : ''}
            </div>
          </div>
        `;
      }

      return `
        <div class="space-y-4 animate-in">
          <div class="card-surface rounded-3xl p-4">
            <div class="flex items-center justify-between mb-4">
              <button onclick="calendarMonthOffset--; renderApp()" class="p-2 rounded-xl bg-cream dark:bg-black/30">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
              </button>
              <h3 class="text-sm font-extrabold capitalize">${monthLabel}</h3>
              <button onclick="calendarMonthOffset++; renderApp()" class="p-2 rounded-xl bg-cream dark:bg-black/30">
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
              </button>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-gray-400 mb-2">
              <span>Min</span><span>Sen</span><span>Sel</span><span>Rab</span><span>Kam</span><span>Jum</span><span>Sab</span>
            </div>
            <div class="grid grid-cols-7 gap-1.5">${cells}</div>
            <div class="flex items-center gap-4 mt-3 pt-3 border-t border-gray-100 dark:border-gray-800 text-[11px] text-gray-500">
              <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-red-500"></span> Tagihan Jatuh Tempo</span>
              <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-gold"></span> Tugas Keluarga</span>
            </div>
          </div>

          <div class="card-surface rounded-3xl p-4 space-y-2.5">
            <h4 class="text-xs font-extrabold uppercase tracking-wider text-gray-500">Agenda Bulan Ini</h4>
            ${monthBills.length === 0 && monthTasks.length === 0 ? `<p class="text-xs text-gray-400">Tidak ada agenda tagihan atau tugas bulan ini.</p>` : `
              ${monthBills.map(b => `
                <div class="flex items-center justify-between p-2.5 rounded-2xl bg-red-50/60 dark:bg-red-950/30">
                  <div>
                    <p class="text-xs font-bold">${b.title}</p>
                    <p class="text-[10px] text-gray-500">Tagihan • ${formatDateIndo(b.dueDate)}</p>
                  </div>
                  <span class="text-xs font-extrabold text-red-600">${formatRupiah(b.amount)}</span>
                </div>
              `).join('')}
              ${monthTasks.map(t => `
                <div class="flex items-center justify-between p-2.5 rounded-2xl bg-gold-soft/50 dark:bg-amber-950/30">
                  <div>
                    <p class="text-xs font-bold">${t.title}</p>
                    <p class="text-[10px] text-gray-500">Tugas • ${formatDateIndo(t.dueDate)}</p>
                  </div>
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${t.done ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-800'}">
                    ${t.done ? 'Selesai' : 'Aktif'}
                  </span>
                </div>
              `).join('')}
            `}
          </div>
        </div>
      `;
    }

    function saveTransaction(e) {
      e.preventDefault();
      const type = document.querySelector('input[name="tx-type"]:checked').value;
      const title = document.getElementById('tx-title').value.trim();
      const amount = parseDots(document.getElementById('tx-amount').value);
      const accountId = document.getElementById('tx-account').value;
      const categoryId = document.getElementById('tx-category').value;
      const date = document.getElementById('tx-date').value;

      if (!amount) return;
      appState.transactions.unshift({
        id: 'tx_' + Date.now(),
        type, title, amount, accountId, categoryId, date,
        userId: devicePrefs.activeUserId || 'u_admin'
      });

      const acc = appState.accounts.find(a => a.id === accountId);
      if (acc) {
        acc.balance = (Number(acc.balance) || 0) + (type === 'income' ? amount : -amount);
      }

      persistHouseholdState();
      closeModal();
      renderApp();
      showToast("Transaksi berhasil dicatat!");
    }

    function deleteTransaction(txId) {
      const idx = appState.transactions.findIndex(t => t.id === txId);
      if (idx < 0) return;
      const tx = appState.transactions[idx];
      const acc = appState.accounts.find(a => a.id === tx.accountId);
      if (acc) {
        acc.balance = (Number(acc.balance) || 0) - (tx.type === 'income' ? tx.amount : -tx.amount);
      }
      appState.transactions.splice(idx, 1);
      persistHouseholdState();
      renderApp();
      showToast("Transaksi dihapus");
    }

    function saveBill(e, editBillId) {
      e.preventDefault();
      const title = document.getElementById('bill-title').value.trim();
      const amount = parseDots(document.getElementById('bill-amount').value);
      const recurring = document.getElementById('bill-recurring').value;
      const dueDate = document.getElementById('bill-due').value;
      const accountId = document.getElementById('bill-account').value;
      const categoryId = document.getElementById('bill-category').value;
      const note = document.getElementById('bill-note').value.trim();
      const syncScheduled = document.getElementById('bill-sync-scheduled').checked;

      if (!amount) return;

      let billObj;
      if (editBillId) {
        billObj = appState.bills.find(b => b.id === editBillId);
        if (billObj) {
          billObj.title = title;
          billObj.amount = amount;
          billObj.recurring = recurring;
          billObj.dueDate = dueDate;
          billObj.accountId = accountId;
          billObj.categoryId = categoryId;
          billObj.note = note;
          billObj.syncScheduled = syncScheduled;
        }
      } else {
        billObj = {
          id: 'bill_' + Date.now(),
          title, amount, recurring, dueDate, accountId, categoryId, note,
          syncScheduled,
          scheduledId: '',
          paid: false,
          lastPaidDate: ''
        };
        appState.bills.push(billObj);
      }

      // Synchronize with Transaksi Terjadwal
      syncBillToScheduledList(billObj);

      persistHouseholdState();
      closeModal();
      renderApp();
      showToast(editBillId ? "Detail tagihan diperbarui!" : "Tagihan berhasil ditambahkan!");
    }

    function syncBillToScheduledList(bill) {
      if (!bill) return;
      const existingSchIdx = appState.scheduledTransactions.findIndex(s => s.linkedBillId === bill.id || s.id === bill.scheduledId);
      if (bill.syncScheduled) {
        const schPayload = {
          id: existingSchIdx >= 0 ? appState.scheduledTransactions[existingSchIdx].id : ('sch_' + Date.now()),
          title: bill.title,
          type: 'expense',
          amount: bill.amount,
          categoryId: bill.categoryId,
          accountId: bill.accountId,
          nextDate: bill.dueDate,
          frequency: bill.recurring === 'Sekali' ? 'Sekali' : bill.recurring,
          linkedBillId: bill.id,
          active: true
        };
        if (existingSchIdx >= 0) {
          appState.scheduledTransactions[existingSchIdx] = schPayload;
        } else {
          appState.scheduledTransactions.push(schPayload);
        }
        bill.scheduledId = schPayload.id;
      } else if (existingSchIdx >= 0) {
        appState.scheduledTransactions.splice(existingSchIdx, 1);
        bill.scheduledId = '';
      }
    }

    function toggleBillScheduledSync(billId) {
      const bill = appState.bills.find(b => b.id === billId);
      if (!bill) return;
      bill.syncScheduled = !bill.syncScheduled;
      syncBillToScheduledList(bill);
      persistHouseholdState();
      renderApp();
      showToast(bill.syncScheduled ? "Tagihan terhubung ke Transaksi Terjadwal" : "Koneksi Terjadwal diputus");
    }

    function payBillNow(billId) {
      const bill = appState.bills.find(b => b.id === billId);
      if (!bill) return;
      const today = new Date().toISOString().split('T')[0];

      // Record Expense Transaction
      appState.transactions.unshift({
        id: 'tx_' + Date.now(),
        type: 'expense',
        title: `Bayar Tagihan: ${bill.title}`,
        amount: Number(bill.amount),
        categoryId: bill.categoryId,
        accountId: bill.accountId,
        date: today,
        userId: devicePrefs.activeUserId || 'u_admin',
        note: bill.note || ''
      });

      // Deduct from Account
      const acc = appState.accounts.find(a => a.id === bill.accountId);
      if (acc) {
        acc.balance = (Number(acc.balance) || 0) - Number(bill.amount);
      }

      bill.lastPaidDate = today;

      // If Recurring, automatically advance dueDate to next cycle!
      if (bill.recurring && bill.recurring !== 'Sekali') {
        bill.dueDate = addPeriodToDate(bill.dueDate, bill.recurring);
        bill.paid = false;
        syncBillToScheduledList(bill);
        showToast(`Tagihan dibayar! Jatuh tempo berikutnya: ${formatDateIndo(bill.dueDate)}`);
      } else {
        bill.paid = true;
        showToast("Tagihan berhasil dibayar & dicatat!");
      }

      persistHouseholdState();
      renderApp();
    }

    function deleteBill(billId) {
      appState.bills = appState.bills.filter(b => b.id !== billId);
      appState.scheduledTransactions = appState.scheduledTransactions.filter(s => s.linkedBillId !== billId);
      persistHouseholdState();
      renderApp();
      showToast("Tagihan dihapus");
    }

    function adjustInventoryQty(invId, delta) {
      const item = appState.inventory.find(i => i.id === invId);
      if (!item) return;
      item.qty = Math.max(0, (Number(item.qty) || 0) + delta);
      if (item.qty <= item.minQty && delta < 0) {
        showToast(`Stok ${item.name} menipis! Disarankan masuk checklist belanja.`, 'warning');
      }
      persistHouseholdState();
      renderApp();
    }

    function addLowStockItemToChecklist(invId, silent = false) {
      const item = appState.inventory.find(i => i.id === invId);
      if (!item) return;
      const exists = (appState.shoppingChecklist || []).some(c => !c.checked && c.name.toLowerCase() === item.name.toLowerCase());
      if (exists) {
        if (!silent) showToast(`${item.name} sudah ada di checklist belanja`);
        return;
      }
      const neededQty = Math.max(1, (Number(item.minQty) - Number(item.qty)) + 1);
      appState.shoppingChecklist.unshift({
        id: 'shp_' + Date.now() + Math.random().toString(36).slice(2, 5),
        name: item.name,
        qty: neededQty,
        unit: item.unit || 'pcs',
        estPrice: 0,
        checked: false,
        fromInventoryId: item.id
      });
      if (!silent) {
        persistHouseholdState();
        renderApp();
        showToast(`"${item.name}" ditambahkan ke Checklist Belanja!`);
      }
    }

    function addAllLowStockToChecklist() {
      const low = getLowStockItems();
      let added = 0;
      low.forEach(item => {
        const exists = (appState.shoppingChecklist || []).some(c => !c.checked && c.name.toLowerCase() === item.name.toLowerCase());
        if (!exists) {
          addLowStockItemToChecklist(item.id, true);
          added++;
        }
      });
      persistHouseholdState();
      rumahSubTab = 'checklist';
      renderApp();
      showToast(added > 0 ? `${added} barang menipis dimasukkan ke Checklist Belanja!` : "Semua barang menipis sudah ada di checklist.");
    }

    function finalizeShoppingCheckout(e) {
      e.preventDefault();
      const totalSpend = parseDots(document.getElementById('shop-total-spend').value);
      const accountId = document.getElementById('shop-account').value;
      const checked = appState.shoppingChecklist.filter(s => s.checked);

      // Restock matching inventory items
      checked.forEach(c => {
        const inv = appState.inventory.find(i => i.id === c.fromInventoryId || i.name.toLowerCase() === c.name.toLowerCase());
        if (inv) {
          inv.qty = (Number(inv.qty) || 0) + (Number(c.qty) || 1);
        }
      });

      // Remove checked items
      appState.shoppingChecklist = appState.shoppingChecklist.filter(s => !s.checked);

      // Optionally record expense transaction
      if (totalSpend > 0) {
        const belanjaCat = appState.categories.find(c => c.id === 'cat_belanja') || appState.categories.find(c => c.type === 'expense');
        appState.transactions.unshift({
          id: 'tx_' + Date.now(),
          type: 'expense',
          title: `Belanja Kebutuhan (${checked.length} item)`,
          amount: totalSpend,
          categoryId: belanjaCat ? belanjaCat.id : '',
          accountId,
          date: new Date().toISOString().split('T')[0],
          userId: devicePrefs.activeUserId || 'u_admin'
        });
        const acc = appState.accounts.find(a => a.id === accountId);
        if (acc) acc.balance = (Number(acc.balance) || 0) - totalSpend;
      }

      persistHouseholdState();
      closeModal();
      renderApp();
      showToast("Belanja selesai & stok rumah diperbarui!");
    }

    // --- TASKS & NOTES ---
    function openTaskModal() {
      const today = new Date().toISOString().split('T')[0];
      openModal("Tambah Tugas Keluarga", `
        <form onsubmit="saveTask(event)" class="space-y-3 text-xs">
          <div>
            <label class="block font-semibold mb-1">Nama Tugas</label>
            <input type="text" id="tsk-title" required placeholder="Contoh: Servis AC Ruang Tamu" class="w-full px-3.5 py-2.5 rounded-xl bg-cream dark:bg-black/30 border border-gray-200 dark:border-gray-700" />
          </div>
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="block font-semibold mb-1">Penanggung Jawab</label>
              <select id="tsk-assignee" class="w-full px-3 py-2.5 rounded-xl bg-cream dark:bg-black/30 border border-gray-200 dark:border-gray-700">
                ${appState.users.map(u => `<option value="${u.id}">${u.name}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block font-semibold mb-1">Target Tanggal</label>
              <input type="date" id="tsk-due" value="${today}" required class="w-full px-3 py-2.5 rounded-xl bg-cream dark:bg-black/30 border border-gray-200 dark:border-gray-700" />
            </div>
          </div>
          <button type="submit" class="w-full py-3 rounded-2xl bg-forest text-white font-bold">Simpan Tugas</button>
        </form>
      `);
    }

    function saveTask(e) {
      e.preventDefault();
      appState.tasks.unshift({
        id: 'tsk_' + Date.now(),
        title: document.getElementById('tsk-title').value.trim(),
        assigneeId: document.getElementById('tsk-assignee').value,
        dueDate: document.getElementById('tsk-due').value,
        done: false
      });
      persistHouseholdState();
      closeModal();
      renderApp();
      showToast("Tugas ditambahkan!");
    }

    function toggleTaskDone(tskId) {
      const t = appState.tasks.find(x => x.id === tskId);
      if (!t) return;
      t.done = !t.done;
      persistHouseholdState();
      renderApp();
    }

    function deleteTask(tskId) {
      appState.tasks = appState.tasks.filter(t => t.id !== tskId);
      persistHouseholdState();
      renderApp();
    }

    function openNoteModal() {
      openModal("Catatan Keluarga Baru", `
        <form onsubmit="saveNote(event)" class="space-y-3 text-xs">
          <div>
            <label class="block font-semibold mb-1">Judul Catatan</label>
            <input type="text" id="note-title" required placeholder="Contoh: Nomor Tukang Galon & Gas" class="w-full px-3.5 py-2.5 rounded-xl bg-cream dark:bg-black/30 border border-gray-200 dark:border-gray-700" />
          </div>
          <div>
            <label class="block font-semibold mb-1">Isi Catatan</label>
            <textarea id="note-content" rows="4" required placeholder="Tulis informasi penting untuk keluarga..." class="w-full px-3.5 py-2.5 rounded-xl bg-cream dark:bg-black/30 border border-gray-200 dark:border-gray-700"></textarea>
          </div>
          <button type="submit" class="w-full py-3 rounded-2xl bg-forest text-white font-bold">Simpan Catatan</button>
        </form>
      `);
    }

    function saveNote(e) {
      e.preventDefault();
      appState.notes.unshift({
        id: 'not_' + Date.now(),
        title: document.getElementById('note-title').value.trim(),
        content: document.getElementById('note-content').value.trim(),
        updatedAt: new Date().toISOString().split('T')[0],
        authorId: devicePrefs.activeUserId || 'u_admin'
      });
      persistHouseholdState();
      closeModal();
      renderApp();
      showToast("Catatan disimpan!");
    }

    function deleteNote(noteId) {
      appState.notes = appState.notes.filter(n => n.id !== noteId);
      persistHouseholdState();
      renderApp();
    }

    // --- CATEGORIES & MEMBERS (ADMIN PROTECTED) ---
    function openCategoryModal() {
      openModal("Tambah Kategori Keuangan", `
        <form onsubmit="saveCategory(event)" class="space-y-3 text-xs">
          <div>
            <label class="block font-semibold mb-1">Nama Kategori</label>
            <input type="text" id="cat-name" required placeholder="Contoh: Investasi / Sedekah" class="w-full px-3.5 py-2.5 rounded-xl bg-cream dark:bg-black/30 border border-gray-200 dark:border-gray-700" />
          </div>
          <div>
            <label class="block font-semibold mb-1">Jenis</label>
            <select id="cat-type" class="w-full px-3 py-2.5 rounded-xl bg-cream dark:bg-black/30 border border-gray-200 dark:border-gray-700">
              <option value="expense">Pengeluaran</option>
              <option value="income">Pemasukan</option>
            </select>
          </div>
          <button type="submit" class="w-full py-3 rounded-2xl bg-forest text-white font-bold">Simpan Kategori</button>
        </form>
      `);
    }

    function saveCategory(e) {
      e.preventDefault();
      appState.categories.push({
        id: 'cat_' + Date.now(),
        name: document.getElementById('cat-name').value.trim(),
        type: document.getElementById('cat-type').value,
        icon: 'tag'
      });
      persistHouseholdState();
      closeModal();
      renderApp();
      showToast("Kategori ditambahkan!");
    }

    function deleteCategory(catId) {
      appState.categories = appState.categories.filter(c => c.id !== catId);
      persistHouseholdState();
      renderApp();
    }

    function openMemberModal(editUserId = null) {
      if (!isAdminUser()) {
        showToast("Hanya Admin yang dapat mengelola anggota", "error");
        return;
      }
      const u = editUserId ? appState.users.find(x => x.id === editUserId) : null;
      openModal(u ? "Edit Profil Anggota" : "Tambah Anggota Keluarga", `
        <form onsubmit="saveMember(event, '${editUserId || ''}')" class="space-y-3 text-xs">
          <div>
            <label class="block font-semibold mb-1">Nama Panggilan</label>
            <input type="text" id="mem-name" required value="${u ? u.name : ''}" placeholder="Contoh: Ibu / Adik" class="w-full px-3.5 py-2.5 rounded-xl bg-cream dark:bg-black/30 border border-gray-200 dark:border-gray-700" />
          </div>
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="block font-semibold mb-1">Peran</label>
              <select id="mem-role" class="w-full px-3 py-2.5 rounded-xl bg-cream dark:bg-black/30 border border-gray-200 dark:border-gray-700">
                <option value="Admin" ${u && u.role === 'Admin' ? 'selected' : ''}>Admin</option>
                <option value="Anggota" ${!u || u.role === 'Anggota' ? 'selected' : ''}>Anggota</option>
              </select>
            </div>
            <div>
              <label class="block font-semibold mb-1">Warna Avatar</label>
              <input type="color" id="mem-color" value="${u ? (u.avatarColor || '#214E2A') : '#214E2A'}" class="w-full h-10 rounded-xl cursor-pointer" />
            </div>
          </div>
          <div>
            <label class="block font-semibold mb-1">Kata Sandi Profil (Individu)</label>
            <input type="text" id="mem-pass" value="${u ? (u.password || '') : '1234'}" placeholder="Kosongkan jika tanpa sandi" class="w-full px-3.5 py-2.5 rounded-xl bg-cream dark:bg-black/30 border border-gray-200 dark:border-gray-700" />
          </div>
          <button type="submit" class="w-full py-3 rounded-2xl bg-forest text-white font-bold">Simpan Profil</button>
        </form>
      `);
    }

    function saveMember(e, editUserId) {
      e.preventDefault();
      if (!isAdminUser()) return;
      const name = document.getElementById('mem-name').value.trim();
      const role = document.getElementById('mem-role').value;
      const avatarColor = document.getElementById('mem-color').value;
      const password = document.getElementById('mem-pass').value;

      if (editUserId) {
        const u = appState.users.find(x => x.id === editUserId);
        if (u) {
          u.name = name;
          u.role = role;
          u.avatarColor = avatarColor;
          u.password = password;
        }
      } else {
        appState.users.push({
          id: 'u_' + Date.now(),
          name, role, avatarColor, password
        });
      }
      persistHouseholdState();
      closeModal();
      renderApp();
      showToast("Profil anggota disimpan!");
    }

    function deleteMember(userId) {
      if (!isAdminUser() || appState.users.length <= 1) return;
      appState.users = appState.users.filter(u => u.id !== userId);
      persistHouseholdState();
      renderApp();
      showToast("Anggota dihapus");
    }

    /* =========================================================================
       15. EXCEL (.XLSX) EXPORT VIA SHEETJS
       ========================================================================= */
    function exportToExcel() {
      if (typeof XLSX === 'undefined') {
        showToast("Library Excel sedang dimuat, coba sesaat lagi.", "warning");
        return;
      }
      try {
        const wb = XLSX.utils.book_new();

        const txRows = (appState.transactions || []).map(t => ({
          Tanggal: t.date,
          Jenis: t.type === 'income' ? 'Pemasukan' : 'Pengeluaran',
          Judul: t.title,
          Nominal: Number(t.amount) || 0,
          Rekening: (appState.accounts.find(a => a.id === t.accountId) || {}).name || '-',
          Kategori: (appState.categories.find(c => c.id === t.categoryId) || {}).name || '-'
        }));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(txRows.length ? txRows : [{ Info: 'Kosong' }]), "Transaksi");

        const accRows = (appState.accounts || []).map(a => ({
          Nama_Rekening: a.name,
          Jenis: a.type,
          Nomor_Rekening: a.accountNumber || '-',
          Saldo: Number(a.balance) || 0
        }));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(accRows.length ? accRows : [{ Info: 'Kosong' }]), "Rekening");

        const billRows = (appState.bills || []).map(b => ({
          Tagihan: b.title,
          Nominal: Number(b.amount) || 0,
          Periode: b.recurring || 'Sekali',
          Jatuh_Tempo: b.dueDate,
          Terhubung_Terjadwal: b.syncScheduled ? 'Ya' : 'Tidak',
          Catatan: b.note || '-'
        }));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(billRows.length ? billRows : [{ Info: 'Kosong' }]), "Tagihan");

        const invRows = (appState.inventory || []).map(i => ({
          Barang: i.name,
          Kategori: i.category,
          Stok_Saat_Ini: i.qty,
          Batas_Minimal: i.minQty,
          Satuan: i.unit
        }));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(invRows.length ? invRows : [{ Info: 'Kosong' }]), "Stok_Rumah");

        const fileName = `RumahKu_${(appState.familyName || 'Keluarga').replace(/\s+/g, '_')}_${new Date().toISOString().slice(0, 10)}.xlsx`;
        XLSX.writeFile(wb, fileName);
        showToast("File Excel berhasil diunduh!");
      } catch (err) {
        console.error(err);
        showToast("Gagal membuat file Excel", "error");
      }
    }

    /* =========================================================================
       16. INITIALIZATION ON WINDOW LOAD
       ========================================================================= */
    window.onload = function () {
      loadDevicePrefs();
      lucide.createIcons();

      try {
        const savedSessionRaw = localStorage.getItem(SESSION_KEY);
        if (savedSessionRaw) {
          currentSession = JSON.parse(savedSessionRaw);
          const mirrorRaw = localStorage.getItem(LOCAL_DATA_PREFIX + currentSession.accountId);
          if (mirrorRaw) {
            mergeIncomingState(JSON.parse(mirrorRaw));
          }
          startFirestoreListener();
          bootUIAfterSession();
          return;
        }
      } catch (e) {
        console.warn("Session restore fallback:", e);
      }

      document.getElementById('auth-screen').classList.remove('hidden');
      lucide.createIcons();
    };
  </script>
</body>
</html>
