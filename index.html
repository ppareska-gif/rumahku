    /* ==================== 4-LAYER PERSISTENT FAMILY CODE MANAGER ==================== */
    function isValidFamilyCode(code) {
      return /^[A-Z0-9]{6}$/.test(String(code || '').trim().toUpperCase());
    }

    function normalizeFamilyCode(code) {
      const clean = String(code || '').trim().toUpperCase();
      return isValidFamilyCode(clean) ? clean : '';
    }

    function readUrlFamilyCode() {
      try {
        const params = new URLSearchParams(window.location.search);
        return normalizeFamilyCode(params.get('family'));
      } catch (e) {
        return '';
      }
    }

    function syncUrlFamilyCode(code) {
      try {
        const clean = normalizeFamilyCode(code);
        if (!clean) return;
        const url = new URL(window.location.href);
        if (url.searchParams.get('family') !== clean) {
          url.searchParams.set('family', clean);
          window.history.replaceState(null, '', url.toString());
        }
      } catch (e) {}
    }

    function readCookieFamilyCode() {
      try {
        const cookies = (document.cookie || '').split(';');
        for (let i = 0; i < cookies.length; i++) {
          const part = cookies[i].trim();
          if (part.startsWith(COOKIE_NAME + '=')) {
            const rawVal = decodeURIComponent(part.slice(COOKIE_NAME.length + 1));
            const clean = normalizeFamilyCode(rawVal);
            if (clean) return clean;
          }
        }
      } catch (e) {}
      return '';
    }

    function writeCookieFamilyCode(code) {
      try {
        const clean = normalizeFamilyCode(code);
        if (!clean) return;
        document.cookie = `${COOKIE_NAME}=${encodeURIComponent(clean)}; max-age=31536000; path=/; SameSite=Lax`;
      } catch (e) {}
    }

    function openPersistIDB() {
      return new Promise((resolve) => {
        try {
          if (!window.indexedDB) { resolve(null); return; }
          const req = indexedDB.open(IDB_NAME, 1);
          req.onupgradeneeded = (e) => {
            const idb = e.target.result;
            if (!idb.objectStoreNames.contains(IDB_STORE)) {
              idb.createObjectStore(IDB_STORE, { keyPath: 'key' });
            }
          };
          req.onsuccess = (e) => resolve(e.target.result);
          req.onerror = () => resolve(null);
        } catch (e) {
          resolve(null);
        }
      });
    }

    async function writeIndexedDBFamilyCode(code) {
      try {
        const clean = normalizeFamilyCode(code);
        if (!clean) return;
        const idb = await openPersistIDB();
        if (!idb) return;
        await new Promise((resolve) => {
          const tx = idb.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).put({ key: IDB_KEY, value: clean, updatedAt: Date.now() });
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      } catch (e) {}
    }

    async function readIndexedDBFamilyCode() {
      try {
        const idb = await openPersistIDB();
        if (!idb) return '';
        return await new Promise((resolve) => {
          const tx = idb.transaction(IDB_STORE, 'readonly');
          const req = tx.objectStore(IDB_STORE).get(IDB_KEY);
          req.onsuccess = () => {
            const val = req.result && req.result.value ? normalizeFamilyCode(req.result.value) : '';
            resolve(val);
          };
          req.onerror = () => resolve('');
        });
      } catch (e) {
        return '';
      }
    }

    function savePersistentFamilyCode(code) {
      const clean = normalizeFamilyCode(code);
      if (!clean) return '';
      if (state) state.familyCode = clean;

      try {
        localStorage.setItem(FAMILY_CODE_KEY, clean);
        if (state) localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}

      writeCookieFamilyCode(clean);
      writeIndexedDBFamilyCode(clean);
      syncUrlFamilyCode(clean);
      return clean;
    }

    async function recoverFamilyCodeFromIndexedDBOnBoot(wasFreshlyGenerated, explicitUrlCode) {
      if (explicitUrlCode) return;
      const idbCode = await readIndexedDBFamilyCode();
      if (!idbCode) {
        if (state && state.familyCode) writeIndexedDBFamilyCode(state.familyCode);
        return;
      }
      if (wasFreshlyGenerated || (state && state.familyCode !== idbCode)) {
        state.familyCode = idbCode;
        state.updatedAt = 0;
        savePersistentFamilyCode(idbCode);
        saveLocalState(false);
        renderAll();
        if (db) connectToFamilyDoc(idbCode);
        showToast(`Kode Keluarga ${idbCode} dipulihkan otomatis!`);
      }
    }

    /* ==================== DATE, CURRENCY & HELPERS ==================== */
    function getTodayISO() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function addDaysISO(baseISO, days) {
      const [y, m, d] = (baseISO || getTodayISO()).split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      dt.setDate(dt.getDate() + days);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }

    function shiftMonthYM(ym, delta) {
      const [y, m] = (ym || getTodayISO().slice(0, 7)).split('-').map(Number);
      const dt = new Date(y, (m - 1) + delta, 1);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}`;
    }

    function formatMonthTitle(ym) {
      const [y, m] = (ym || getTodayISO().slice(0, 7)).split('-').map(Number);
      const bulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      return `${bulan[(m || 1) - 1]} ${y}`;
    }

    function advanceDateByFrequency(dateISO, freq) {
      const [y, m, d] = (dateISO || getTodayISO()).split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      if (freq === 'Harian') dt.setDate(dt.getDate() + 1);
      else if (freq === 'Mingguan') dt.setDate(dt.getDate() + 7);
      else if (freq === 'Bulanan') dt.setMonth(dt.getMonth() + 1);
      else return dateISO;
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }

    function formatIndonesianFullDate(dateObj = new Date()) {
      const hari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      const bulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      return `${hari[dateObj.getDay()]}, ${dateObj.getDate()} ${bulan[dateObj.getMonth()]} ${dateObj.getFullYear()}`;
    }

    function formatShortDate(iso) {
      if (!iso) return '-';
      const [y, m, d] = iso.split('-').map(Number);
      const bulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      return `${d} ${bulan[(m || 1) - 1]} ${y}`;
    }

    function formatTimelineDate(iso) {
      if (!iso) return '-';
      const [y, m, d] = iso.split('-').map(Number);
      const dt = new Date(y, (m || 1) - 1, d || 1);
      const hari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      const bulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      return `${hari[dt.getDay()]}, ${d} ${bulan[(m || 1) - 1]}`;
    }

    function daysDiffFromToday(iso) {
      if (!iso) return 999;
      const [ty, tm, td] = getTodayISO().split('-').map(Number);
      const [y, m, d] = iso.split('-').map(Number);
      return Math.round((new Date(y, m - 1, d) - new Date(ty, tm - 1, td)) / 86400000);
    }

    function formatRupiah(amount, allowMask = false) {
      if (allowMask && hideBalances) return 'Rp •••••••';
      const num = Math.round(Number(amount) || 0);
      const absStr = Math.abs(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return `${num < 0 ? '-' : ''}Rp ${absStr}`;
    }

    function formatCompactRupiah(amount, allowMask = false) {
      if (allowMask && hideBalances) return 'Rp •••';
      const num = Math.round(Number(amount) || 0);
      const abs = Math.abs(num);
      const sign = num < 0 ? '-' : '';
      if (abs >= 1000000) {
        const jt = (abs / 1000000).toFixed(1).replace('.0', '').replace('.', ',');
        return `${sign}Rp${jt}jt`;
      }
      if (abs >= 1000) {
        const rb = Math.round(abs / 1000);
        return `${sign}Rp${rb}rb`;
      }
      return `${sign}Rp${abs}`;
    }

    function formatCalendarCellShort(amount) {
      const num = Math.round(Number(amount) || 0);
      if (num <= 0) return '';
      if (num >= 1000000) {
        return `${(num / 1000000).toFixed(1).replace('.0', '').replace('.', ',')}jt`;
      }
      if (num >= 1000) {
        return `${Math.round(num / 1000)}rb`;
      }
      return `${num}`;
    }

    function formatDotsOnly(amount) {
      const num = Math.max(0, Math.round(Number(amount) || 0));
      return num === 0 ? '' : num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    function formatCurrencyInput(el) {
      const digits = (el.value || '').replace(/\D/g, '').replace(/^0+(?=\d)/, '');
      el.value = digits ? digits.replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '';
    }

    function parseRupiah(str) {
      return parseInt(String(str || '').replace(/\D/g, ''), 10) || 0;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function generateId(prefix = 'id') {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 6)}`;
    }

    function generateFamilyCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let out = '';
      for (let i = 0; i < 6; i++) out += chars[Math.floor(Math.random() * chars.length)];
      return out;
    }

    function copyTextToClipboard(text, msg = 'Berhasil disalin!') {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) { showToast(msg); return; }
      } catch (e) {}
      try {
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => showToast(msg));
      } catch (e) {}
    }

    function showToast(message, type = 'info') {
      const box = document.getElementById('toast-container');
      if (!box) return;
      const div = document.createElement('div');
      div.className = `${type === 'error' ? 'bg-[#9E3A32]' : 'bg-[#1F1D1A]'} text-white pointer-events-auto px-4 py-3 rounded-2xl shadow-lg text-xs sm:text-sm font-bold flex items-center gap-2.5 transition-all`;
      div.innerHTML = `<span class="w-2 h-2 rounded-full ${type === 'error' ? 'bg-rose-300' : 'bg-[#C9A227]'} shrink-0"></span><span>${escapeHtml(message)}</span>`;
      box.appendChild(div);
      setTimeout(() => { div.style.opacity = '0'; setTimeout(() => div.remove(), 250); }, 3200);
    }

    function readSavedAppState() {
      const keysToCheck = [STORAGE_KEY, ...LEGACY_STORAGE_KEYS];
      for (let i = 0; i < keysToCheck.length; i++) {
        try {
          const raw = localStorage.getItem(keysToCheck[i]);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && typeof parsed === 'object') return parsed;
          }
        } catch (e) {}
      }
      return null;
    }

    function loadLocalState() {
      const urlCode = readUrlFamilyCode();
      let dedicatedCode = '';
      try { dedicatedCode = normalizeFamilyCode(localStorage.getItem(FAMILY_CODE_KEY)); } catch (e) {}
      const saved = readSavedAppState();
      const stateCode = saved ? normalizeFamilyCode(saved.familyCode) : '';
      const cookieCode = readCookieFamilyCode();

      let resolvedCode = urlCode || dedicatedCode || stateCode || cookieCode;
      let wasFreshlyGenerated = false;

      if (!resolvedCode) {
        resolvedCode = generateFamilyCode();
        wasFreshlyGenerated = true;
      }

      const base = createDefaultState(resolvedCode);
      if (saved) {
        state = {
          ...base,
          ...saved,
          familyCode: resolvedCode,
          users: Array.isArray(saved.users) && saved.users.length ? saved.users : base.users,
          accounts: Array.isArray(saved.accounts) && saved.accounts.length ? saved.accounts : base.accounts,
          categories: Array.isArray(saved.categories) && saved.categories.length ? saved.categories : base.categories,
          transactions: Array.isArray(saved.transactions) ? saved.transactions : base.transactions,
          scheduledTransactions: Array.isArray(saved.scheduledTransactions) ? saved.scheduledTransactions : base.scheduledTransactions,
          bills: Array.isArray(saved.bills) ? saved.bills : base.bills,
          tasks: Array.isArray(saved.tasks) ? saved.tasks : base.tasks,
          inventory: Array.isArray(saved.inventory) ? saved.inventory : base.inventory,
          notes: Array.isArray(saved.notes) ? saved.notes : base.notes
        };
      } else {
        state = base;
      }

      if (!financeFilters.month) financeFilters.month = getTodayISO().slice(0, 7);
      if (!calendarSelectedDate) calendarSelectedDate = getTodayISO();
      applyThemeAndFont();

      savePersistentFamilyCode(resolvedCode);
      saveLocalState(false);

      recoverFamilyCodeFromIndexedDBOnBoot(wasFreshlyGenerated, urlCode);
    }

    function saveLocalState(syncCloud = true) {
      if (!state) return;
      state.updatedAt = Date.now();
      const cleanCode = normalizeFamilyCode(state.familyCode);
      if (cleanCode) {
        state.familyCode = cleanCode;
        try { localStorage.setItem(FAMILY_CODE_KEY, cleanCode); } catch (e) {}
      }
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      if (syncCloud && !isApplyingRemote) pushStateToCloud();
    }

    }

    function processDueScheduledTransactions() {
      if (!state || !Array.isArray(state.scheduledTransactions)) return;
      const today = getTodayISO();
      let count = 0;
      state.scheduledTransactions.forEach(sch => {
        if (sch.active === false || sch.mode !== 'Otomatis') return;
        let guard = 0;
        while (sch.nextDate && sch.nextDate <= today && guard < 12) {
          state.transactions.unshift({
            id: generateId('tx'),
            type: sch.type,
            title: `${sch.title} (Otomatis)`,
            subClass: sch.frequency,
            amount: Number(sch.amount) || 0,
            categoryId: sch.categoryId,
            accountId: sch.accountId,
            date: sch.nextDate,
            note: `Otomatis dari jadwal ${sch.frequency}`,
            createdBy: sch.createdBy || 'Otomatis'
          });
          if (sch.frequency === 'Sekali') {
            sch.active = false;
            break;
          }
          sch.nextDate = advanceDateByFrequency(sch.nextDate, sch.frequency);
          count++;
          guard++;
        }
      });
      if (count > 0) saveLocalState(true);
    }

    /* ==================== FIREBASE REAL-TIME SYNC ==================== */
    function initFirebaseSync() {
      try {
        if (!window.firebase || !firebase.initializeApp) {
          isCloudConnected = false;
          cloudStatusText = 'Mode Lokal (Offline)';
          updateSyncBadges();
          return;
        }
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        connectToFamilyDoc(state.familyCode);
      } catch (e) {
        isCloudConnected = false;
        cloudStatusText = 'Mode Lokal (Cek Koneksi)';
        updateSyncBadges();
      }
    }

    function connectToFamilyDoc(code) {
      const activeFamilyCode = normalizeFamilyCode(code);
      if (!db || !activeFamilyCode) return;

      try {
        if (typeof unsubscribeSnapshot === 'function') {
          unsubscribeSnapshot();
          unsubscribeSnapshot = null;
        }

        const docRef = db.collection('rumahku_families').doc(activeFamilyCode);

        docRef.get().then(snap => {
          if (!snap.exists) {
            const payload = JSON.parse(JSON.stringify(state));
            payload.familyCode = activeFamilyCode;
            return docRef.set(payload);
          }
        }).catch(err => {
          isCloudConnected = false;
          cloudStatusText = `Mode Lokal (${err.code || 'Periksa Rules Firestore'})`;
          updateSyncBadges();
        });

        unsubscribeSnapshot = docRef.onSnapshot(snap => {
          isCloudConnected = true;
          cloudStatusText = `Terhubung Live • Keluarga ${activeFamilyCode}`;
          updateSyncBadges();

          if (snap.exists) {
            const remote = snap.data();
            if (remote && remote.updatedAt && (!state.updatedAt || remote.updatedAt > state.updatedAt)) {
              isApplyingRemote = true;
              const localUser = state.activeUserId;
              state = {
                ...state,
                ...remote,
                familyCode: activeFamilyCode,
                activeUserId: remote.users?.some(u => u.id === localUser) ? localUser : (remote.activeUserId || 'usr_ayah')
              };
              applyThemeAndFont();
              savePersistentFamilyCode(activeFamilyCode);
              saveLocalState(false);
              renderAll();
              isApplyingRemote = false;
            }
          }
        }, err => {
          isCloudConnected = false;
          cloudStatusText = `Mode Lokal (${err.code || 'Izin Firestore dibutuhkan'})`;
          updateSyncBadges();
        });
      } catch (e) {
        isCloudConnected = false;
        updateSyncBadges();
      }
    }

    function pushStateToCloud() {
      const activeFamilyCode = state ? normalizeFamilyCode(state.familyCode) : '';
      if (!db || !state || !activeFamilyCode) return;
      try {
        const payload = JSON.parse(JSON.stringify(state));
        payload.familyCode = activeFamilyCode;
        db.collection('rumahku_families').doc(activeFamilyCode).set(payload, { merge: true }).catch(() => {});
      } catch (e) {}
    }

      const dBadge = document.getElementById('desktop-sync-badge');
      const mBadge = document.getElementById('mobile-sync-badge');
      const live = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-600 animate-pulse"></span> Live`;

        dBadge.innerHTML = isCloudConnected ? live : local;
      }
      if (mBadge) {
        mBadge.className = isCloudConnected
          ? 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-[#E4EFE6] text-[#1B4223] shrink-0'
          : 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800 shrink-0';
        mBadge.innerHTML = isCloudConnected ? live : local;
      }
    }

    function getUserById(id) {
      if (id === 'shared') return { id: 'shared', name: 'Bersama', avatar: '🏡' };
      return state.users.find(u => u.id === id) || { id: 'other', name: 'Keluarga', avatar: '👤' };
    }

    function computeAccountBalance(accId) {
      const acc = state.accounts.find(a => a.id === accId);
      if (!acc) return 0;
      let bal = Number(acc.initialBalance) || 0;
      const isCredit = acc.classification === 'Kartu Kredit / PayLater';
      state.transactions.forEach(tx => {
        const amt = Number(tx.amount) || 0;
        if (tx.type === 'income' && tx.accountId === accId) bal += isCredit ? -amt : amt;
        else if (tx.type === 'expense' && tx.accountId === accId) bal += isCredit ? amt : -amt;
        else if (tx.type === 'transfer') {
          if (tx.accountId === accId) bal += isCredit ? amt : -amt;
          if (tx.toAccountId === accId) bal += isCredit ? -amt : amt;
        }
      });
      return bal;
    }

    function computeNetWorthBreakdown() {
      let totalAssets = 0;
      let creditDebt = 0;
      const byOwner = { shared: 0 };
      state.users.forEach(u => { byOwner[u.id] = 0; });

      state.accounts.forEach(acc => {
        const bal = computeAccountBalance(acc.id);
        const isCredit = acc.classification === 'Kartu Kredit / PayLater';
        if (isCredit) {
          creditDebt += Math.max(0, bal);
        } else {
          totalAssets += bal;
          const ownerKey = (acc.ownerId && byOwner.hasOwnProperty(acc.ownerId)) ? acc.ownerId : 'shared';
          byOwner[ownerKey] += bal;
        }
      });

      const unpaidBillsDebt = state.bills
        .filter(b => b.status !== 'paid')
        .reduce((s, b) => s + (Number(b.amount) || 0), 0);

      const totalDebt = creditDebt + unpaidBillsDebt;
      const netWorth = totalAssets - totalDebt;

      return { totalAssets, totalDebt, netWorth, byOwner };
    }

        const ym = getTodayISO().slice(0, 7);
        const list = state.transactions.filter(t => t.type === 'expense' && (t.date || '').startsWith(ym));
        if (!list.length) return;
        const map = {};
        list.forEach(t => { map[t.categoryId] = (map[t.categoryId] || 0) + (Number(t.amount) || 0); });
        const labels = [], data = [], colors = [];
        Object.entries(map).forEach(([cid, val]) => {
          const c = getCategoryById(cid);
          labels.push(`${c.icon} ${c.name}`);
          data.push(val);
          colors.push(c.color || '#214E2A');
        });
        expenseChartInstance = new Chart(canvas.getContext('2d'), {
          type: 'doughnut',
          data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 2, borderColor: '#FFFFFF' }] },
          options: { responsive: true, maintainAspectRatio: false, cutout: '64%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } } }
        });
      } catch (e) {}
    }

    /* ==================== 2. KEUANGAN VIEW (MENU GRID + WALLET/POS PILLS + HEATMAP CALENDAR) ==================== */
    function renderFinanceView() {
      const ym = financeFilters.month || getTodayISO().slice(0, 7);

      // Filter accounts by Wallet & Pos ownership
      const matchingAccounts = state.accounts.filter(acc => {
        if (financeFilters.accountId !== 'all' && acc.id !== financeFilters.accountId) return false;
        if (financeFilters.posOwnerId !== 'all') {
          const owner = acc.ownerId || 'shared';
          if (owner !== financeFilters.posOwnerId) return false;
        }
        return true;
      });
      const matchingAccIds = new Set(matchingAccounts.map(a => a.id));

      const filteredBalance = matchingAccounts.reduce((sum, acc) => {
        const b = computeAccountBalance(acc.id);
        return acc.classification === 'Kartu Kredit / PayLater' ? sum - b : sum + b;
      }, 0);

      // Filter transactions by Month, Wallet, Pos, Category, and Type
      const monthAllTxs = state.transactions.filter(tx => {
        if (ym && !(tx.date || '').startsWith(ym)) return false;
        if (financeFilters.categoryId !== 'all' && tx.categoryId !== financeFilters.categoryId) return false;
        const inAcc = matchingAccIds.has(tx.accountId) || (tx.toAccountId && matchingAccIds.has(tx.toAccountId));
        if (!inAcc) return false;
        return true;
      });

      const visibleTxs = monthAllTxs
        .filter(tx => financeFilters.type === 'all' ? true : tx.type === financeFilters.type)
        .sort((a, b) => (b.date || '').localeCompare(a.date || ''));

      const expenseCatsWithBudget = state.categories.filter(c => c.type === 'expense' && Number(c.budget) > 0);
      const totalBudget = expenseCatsWithBudget.reduce((s, c) => s + (Number(c.budget) || 0), 0);
      const spentInBudgetCats = expenseCatsWithBudget.reduce((s, c) => {
        const spent = monthAllTxs
          .filter(t => t.type === 'expense' && t.categoryId === c.id)
          .reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
        return s + spent;
      }, 0);
      const budgetPct = totalBudget > 0 ? Math.min(100, Math.round((spentInBudgetCats / totalBudget) * 100)) : 0;

      // Group visibleTxs by date for timeline display
      const groupedByDate = {};
      visibleTxs.forEach(tx => {
        const d = tx.date || getTodayISO();
        if (!groupedByDate[d]) groupedByDate[d] = [];
        groupedByDate[d].push(tx);

      const sortedDates = Object.keys(groupedByDate).sort((a, b) => b.localeCompare(a));

      return `

                }">Semua Wallet</button>
                ${state.accounts.map(acc => `
                  <button onclick="financeFilters.accountId='${acc.id}'; renderAll();" class="px-3.5 py-2 rounded-xl text-xs font-bold shrink-0 flex items-center gap-1.5 transition ${

                  <div class="text-xs font-bold text-theme mt-1">
                    ${matchingAccounts.length} dompet/rekening terpilih
                  </div>
                </div>
                <div class="mt-3">
                  <button onclick="navigateTo('setting', 'accounts')" class="px-3.5 py-1.5 rounded-full border border-theme text-theme text-xs font-extrabold hover:bg-theme hover:text-white transition">

                  <b>${formatRupiah(spentInBudgetCats, true)}</b> dari ${formatRupiah(totalBudget, true)}
                </div>
              </div>

            ${financeSubTab === 'overview' ? renderSpendingHeatmapCalendar(ym, monthAllTxs) : ''}

          <!-- GROUPED TRANSACTION FEED BY DATE -->
          <div class="space-y-4">

              <h4 class="text-xs font-extrabold uppercase tracking-wider text-[#736D63]">

              </h4>
              <div class="flex gap-2">
                <button onclick="financeFilters.type='all'; renderAll();" class="text-xs font-bold text-theme hover:underline">Tampilkan Semua Jenis</button>
              </div>

            ${sortedDates.length === 0
              ? `<div class="card p-8 text-center text-xs text-[#736D63]">Belum ada transaksi pada filter & bulan ini. Ketuk tombol <b>+</b> emas untuk mencatat.</div>`
              : sortedDates.map(dateKey => {
                const dayList = groupedByDate[dateKey];
                const dayTotal = dayList.reduce((s, t) => s + (Number(t.amount) || 0), 0);
                return `
                  <div class="space-y-2">
                    <div class="flex items-center justify-between px-1">
                      <div class="flex items-center gap-2">

                      <span class="text-xs font-extrabold tabular-nums ${financeFilters.type === 'income' ? 'text-theme' : 'text-[#9E4B3B]'}">

    function renderSpendingHeatmapCalendar(ym, monthAllTxs) {
      const [y, m] = ym.split('-').map(Number);
      const firstDayObj = new Date(y, m - 1, 1);
      // Monday-first weekday offset (Senin = 0 .. Minggu = 6)
      const startOffset = (firstDayObj.getDay() + 6) % 7;
      const daysInMonth = new Date(y, m, 0).getDate();
      const todayISO = getTodayISO();

      const dailyTotals = {};
      let maxDayAmount = 0;
      let peakDay = 0;

      monthAllTxs
        .filter(t => t.type === (financeFilters.type === 'income' ? 'income' : 'expense'))
        .forEach(t => {
          const dayNum = Number((t.date || '').split('-')[2]);
          if (dayNum >= 1 && dayNum <= 31) {
            dailyTotals[dayNum] = (dailyTotals[dayNum] || 0) + (Number(t.amount) || 0);
            if (dailyTotals[dayNum] > maxDayAmount) {
              maxDayAmount = dailyTotals[dayNum];
              peakDay = dayNum;
            }
          }
        });

      const cells = [];
      for (let i = 0; i < startOffset; i++) {
        cells.push(`<div></div>`);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const iso = `${ym}-${String(d).padStart(2, '0')}`;
        const amt = dailyTotals[d] || 0;
        const isToday = iso === todayISO;
        let cellStyle = 'bg-[#F3EFE6] text-[#736D63]';
        if (amt > 0 && maxDayAmount > 0) {
          const ratio = amt / maxDayAmount;
          if (financeFilters.type === 'income') {
            cellStyle = ratio > 0.75 ? 'bg-[#214E2A] text-white' : ratio > 0.4 ? 'bg-[#4D7E57] text-white' : 'bg-[#D6E8DA] text-[#1B4223]';
          } else {
            cellStyle = ratio > 0.75 ? 'bg-[#944A3A] text-white'
              : ratio > 0.5 ? 'bg-[#BC6958] text-white'
              : ratio > 0.25 ? 'bg-[#D99587] text-[#3B1B14]'
              : 'bg-[#F1DDD9] text-[#5C2D23]';
          }
        }
        cells.push(`
          <button onclick="openTransactionModal('${financeFilters.type === 'income' ? 'income' : 'expense'}', '${iso}')" class="aspect-square rounded-xl p-1 flex flex-col justify-between text-left transition active:scale-95 ${cellStyle} ${isToday ? 'ring-2 ring-[#1F1D1A]' : ''}">
            <span class="text-[10px] font-bold leading-none">${d}</span>
            <span class="text-[10px] font-extrabold leading-none truncate w-full text-right tabular-nums">${formatCalendarCellShort(amt)}</span>
          </button>
        `);
      }

      const dayHeaders = ['S', 'S', 'R', 'K', 'J', 'S', 'M'];
      return `
        <div class="pt-3 border-t border-cream space-y-2.5">
          <div class="flex items-center justify-between">
            <span class="text-sm font-extrabold text-[#1F1D1A]">Kalender ${financeFilters.type === 'income' ? 'pemasukan' : 'belanja'}</span>
            <span class="text-[11px] text-[#736D63]">ketuk tanggal untuk catat</span>
          </div>

          <div class="grid grid-cols-7 gap-1.5 text-center text-[11px] font-bold text-[#736D63]">
            ${dayHeaders.map(h => `<div>${h}</div>`).join('')}
          </div>

          <div class="grid grid-cols-7 gap-1.5">
            ${cells.join('')}
          </div>

          <div class="flex flex-wrap items-center justify-between gap-2 pt-1 text-[11px] text-[#736D63]">
            <span>
              ${peakDay > 0 ? `Paling tinggi: <b>Tgl ${peakDay} • ${formatCompactRupiah(maxDayAmount, true)}</b>` : 'Belum ada catatan bulan ini'}
            </span>
            <div class="flex items-center gap-1">
              <span>sedikit</span>
              <span class="w-2.5 h-2.5 rounded-full bg-[#F1DDD9]"></span>
              <span class="w-2.5 h-2.5 rounded-full bg-[#D99587]"></span>
              <span class="w-2.5 h-2.5 rounded-full bg-[#BC6958]"></span>
              <span class="w-2.5 h-2.5 rounded-full bg-[#944A3A]"></span>
              <span>banyak</span>
            </div>
          </div>
        </div>
      `;
    }

    /* ==================== 3. KALENDER & AGENDA GABUNGAN VIEW ==================== */
    function renderCalendarView() {
      const sel = calendarSelectedDate || getTodayISO();
      const ym = sel.slice(0, 7);
      const [y, m] = ym.split('-').map(Number);
      const startOffset = (new Date(y, m - 1, 1).getDay() + 6) % 7;
      const daysInMonth = new Date(y, m, 0).getDate();

      const dayBills = state.bills.filter(b => b.dueDate === sel);
      const dayTasks = state.tasks.filter(t => t.dueDate === sel);
      const dayTxs = state.transactions.filter(t => t.date === sel);

      const cells = [];
      for (let i = 0; i < startOffset; i++) cells.push(`<div></div>`);
      for (let d = 1; d <= daysInMonth; d++) {
        const iso = `${ym}-${String(d).padStart(2, '0')}`;
        const hasBill = state.bills.some(b => b.dueDate === iso);
        const hasTask = state.tasks.some(t => t.dueDate === iso);
        const hasTx = state.transactions.some(t => t.date === iso);
        const isSel = iso === sel;
        cells.push(`

    function joinFamilyByCode() {
      const code = normalizeFamilyCode(document.getElementById('join-code-input')?.value);

      savePersistentFamilyCode(code);

      connectToFamilyDoc(code);
      renderAll();
      showToast(`Berhasil terhubung & menyimpan permanen Kode Keluarga: ${code}`);

    function createFreshFamilyCode() {
      const code = generateFamilyCode();
      state.familyCode = code;

      saveLocalState(true);
      connectToFamilyDoc(code);
      renderAll();
      showToast(`Kode keluarga baru dibuat & disimpan: ${code}`);
    }

    function exportJsonBackup() {
      try {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `RumahKu_${state.familyCode}_${getTodayISO()}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Backup JSON berhasil diunduh!');
      } catch (e) {}
    }

    function importJsonBackup(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (!parsed || !parsed.accounts) { showToast('File tidak valid.', 'error'); return; }
          const keepCode = state.familyCode;
          state = { ...createDefaultState(keepCode), ...parsed, familyCode: keepCode };
          applyThemeAndFont();
          savePersistentFamilyCode(keepCode);
          saveLocalState(true);
          renderAll();
          showToast('Data berhasil dipulihkan!');
        } catch (err) { showToast('Gagal membaca JSON.', 'error'); }
      };
      reader.readAsText(file);
    }

      if (u.pin && u.id !== state.activeUserId) {
        openModal(`
          <div class="p-4 border-b border-cream flex justify-between items-center">
            <h4 class="font-extrabold text-sm">Masukkan PIN ${escapeHtml(u.name)}</h4>

      saveLocalState(true);
      closeModal();
      renderAll();

      e.preventDefault();

    function addQuickCategory(type) {
      const name = (document.getElementById('qcat-name')?.value || '').trim();
      const icon = (document.getElementById('qcat-icon')?.value || '🏷️').trim() || '🏷️';
      if (!name) return;
      const cat = { id: generateId('cat'), name, type, icon, color: type === 'income' ? '#214E2A' : '#426B7C', hint: '', budget: 0 };
      state.categories.push(cat);
      saveLocalState(true);
      const sel = document.getElementById('tx-cat');
      if (sel) {
        const opt = document.createElement('option');
        opt.value = cat.id;
        opt.textContent = `${cat.icon} ${cat.name}`;
        opt.selected = true;
        sel.appendChild(opt);
      }
      document.getElementById('quick-cat-box').classList.add('hidden');
      showToast(`Kategori "${name}" ditambahkan!`);
    }

        id: generateId('tx'),
        type: document.getElementById('tx-type').value,
        title: document.getElementById('tx-title').value.trim(),
        subClass: document.getElementById('tx-subclass').value.trim(),

    function executeScheduledNow(id) {
      const sch = state.scheduledTransactions.find(s => s.id === id);
      if (!sch) return;
      state.transactions.unshift({
        id: generateId('tx'),
        type: sch.type,
        title: sch.title,
        subClass: sch.frequency,
        amount: Number(sch.amount) || 0,
        categoryId: sch.categoryId,
        accountId: sch.accountId,
        date: getTodayISO(),
        createdBy: getActiveUser().name
      });
      if (sch.frequency === 'Sekali') sch.active = false;
      else sch.nextDate = advanceDateByFrequency(sch.nextDate, sch.frequency);
      saveLocalState(true);
      renderAll();
      showToast(`"${sch.title}" dicatat!`);
    }

            <select id="tsk-pic" class="px-3 py-2 rounded-xl border border-cream text-sm bg-white">

            </select>
            <select id="tsk-prio" class="px-3 py-2 rounded-xl border border-cream text-sm bg-white">
              <option value="Tinggi">Prioritas Tinggi</option>
              <option value="Sedang" selected>Prioritas Sedang</option>
              <option value="Rendah">Prioritas Rendah</option>
            </select>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-cream-pill text-xs font-bold">Batal</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-theme text-white text-xs font-bold">Simpan</button>
          </div>
        </form>
      `);
    }

    function submitTaskForm(e) {
      e.preventDefault();
      state.tasks.push({
        id: generateId('tsk'),
        title: document.getElementById('tsk-title').value.trim(),
        category: document.getElementById('tsk-cat').value,
        dueDate: document.getElementById('tsk-due').value,
        picId: document.getElementById('tsk-pic').value,
        priority: document.getElementById('tsk-prio').value,
        done: false
      });
      saveLocalState(true);
      closeModal();
      renderAll();
    }

    function toggleTask(id) { const t = state.tasks.find(x => x.id === id); if (t) { t.done = !t.done; saveLocalState(true); renderAll(); } }
    function deleteTask(id) { state.tasks = state.tasks.filter(x => x.id !== id); saveLocalState(true); renderAll(); }

    function openInventoryModal() {
      openModal(`
        <div class="p-4 border-b border-cream flex justify-between items-center">
          <h4 class="font-extrabold text-sm">Tambah Barang Stok</h4>
          <button onclick="closeModal()" class="p-1 text-[#736D63]"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <form onsubmit="submitInvForm(event)" class="p-4 space-y-3">
          <input type="text" id="inv-name" required placeholder="Nama barang (Misal: Beras)" class="w-full px-3 py-2 rounded-xl border border-cream text-sm bg-white" />
          <div class="grid grid-cols-3 gap-2">
            <input type="number" id="inv-qty" value="1" min="0" required class="px-3 py-2 rounded-xl border border-cream text-sm bg-white" />
            <input type="number" id="inv-min" value="2" min="0" required class="px-3 py-2 rounded-xl border border-cream text-sm bg-white" />
            <input type="text" id="inv-unit" value="pcs" required class="px-3 py-2 rounded-xl border border-cream text-sm bg-white" />
          </div>
          <input type="text" id="inv-price" inputmode="numeric" oninput="formatCurrencyInput(this)" placeholder="Estimasi harga (Rp)" class="w-full px-3 py-2 rounded-xl border border-cream text-sm bg-white" />
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-cream-pill text-xs font-bold">Batal</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-theme text-white text-xs font-bold">Simpan</button>
          </div>
        </form>
      `);
    }

    function submitInvForm(e) {
      e.preventDefault();
      state.inventory.push({
        id: generateId('inv'),
        name: document.getElementById('inv-name').value.trim(),
        qty: Number(document.getElementById('inv-qty').value) || 0,
        minQty: Number(document.getElementById('inv-min').value) || 1,
        unit: document.getElementById('inv-unit').value.trim() || 'pcs',
        estPrice: parseRupiah(document.getElementById('inv-price').value)
      });
      saveLocalState(true);
      closeModal();
      renderAll();
    }

    function adjustInventoryQty(id, delta) {
      const item = state.inventory.find(i => i.id === id);
      if (item) { item.qty = Math.max(0, (Number(item.qty) || 0) + delta); saveLocalState(true); renderAll(); }
    }
    function deleteInventoryItem(id) { state.inventory = state.inventory.filter(i => i.id !== id); saveLocalState(true); renderAll(); }

    function openRestockModal() {
      const exp = state.categories.filter(c => c.type === 'expense');
      openModal(`
        <div class="p-4 border-b border-cream flex justify-between items-center">
          <h4 class="font-extrabold text-sm">Selesai Belanja & Restock</h4>
          <button onclick="closeModal()" class="p-1 text-[#736D63]"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <form onsubmit="submitRestockForm(event)" class="p-4 space-y-3">
          <div class="max-h-40 overflow-y-auto space-y-1.5 border border-cream rounded-xl p-2.5 bg-[#F6F3EC]">
            ${state.inventory.map(i => `
              <label class="flex items-center justify-between text-xs bg-white p-2 rounded-lg">
                <span><input type="checkbox" class="rst-chk" data-id="${i.id}" ${i.qty <= i.minQty ? 'checked' : ''} /> ${escapeHtml(i.name)}</span>
                <input type="number" id="rst-add-${i.id}" value="2" min="1" class="w-12 text-center border border-cream rounded" />
              </label>
            `).join('')}
          </div>
          <input type="text" id="rst-total" inputmode="numeric" required oninput="formatCurrencyInput(this)" placeholder="Total belanja (Rp)" class="w-full px-3 py-2 rounded-xl border border-cream text-sm font-bold bg-white" />
          <div class="grid grid-cols-2 gap-2">
            <select id="rst-acc" class="px-3 py-2 rounded-xl border border-cream text-sm bg-white">${state.accounts.map(a => `<option value="${a.id}">${escapeHtml(a.name)}</option>`).join('')}</select>
            <select id="rst-cat" class="px-3 py-2 rounded-xl border border-cream text-sm bg-white">${exp.map(c => `<option value="${c.id}">${c.icon} ${escapeHtml(c.name)}</option>`).join('')}</select>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-cream-pill text-xs font-bold">Batal</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-theme text-white text-xs font-bold">Simpan Restock</button>
          </div>
        </form>
      `);
    }

    function submitRestockForm(e) {
      e.preventDefault();
      document.querySelectorAll('.rst-chk:checked').forEach(c => {
        const id = c.getAttribute('data-id');
        const item = state.inventory.find(i => i.id === id);
        if (item) item.qty += Number(document.getElementById(`rst-add-${id}`)?.value) || 0;
      });
      const total = parseRupiah(document.getElementById('rst-total').value);
      if (total > 0) {
        state.transactions.unshift({
          id: generateId('tx'),
          type: 'expense',
          title: 'Belanja & Restock Stok Rumah',
          amount: total,
          accountId: document.getElementById('rst-acc').value,
          categoryId: document.getElementById('rst-cat').value,
          date: getTodayISO(),
          createdBy: getActiveUser().name
        });
      }
      saveLocalState(true);
      closeModal();
      renderAll();
      showToast('Stok bertambah & belanja dicatat!');
    }

    function openNoteModal() {
      openModal(`
        <div class="p-4 border-b border-cream flex justify-between items-center">
          <h4 class="font-extrabold text-sm">Buat Catatan Baru</h4>
          <button onclick="closeModal()" class="p-1 text-[#736D63]"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <form onsubmit="submitNoteForm(event)" class="p-4 space-y-3">
          <input type="text" id="note-title" required placeholder="Judul catatan..." class="w-full px-3 py-2 rounded-xl border border-cream text-sm bg-white" />
          <div class="grid grid-cols-2 gap-2">
            <select id="note-cat" class="px-3 py-2 rounded-xl border border-cream text-sm bg-white">
              <option value="Penting & Darurat">Penting & Darurat</option>
              <option value="Kontak Tukang/Dokter">Kontak Tukang/Dokter</option>
              <option value="Daftar Belanja">Daftar Belanja</option>
              <option value="Umum">Umum</option>
            </select>
            <select id="note-color" class="px-3 py-2 rounded-xl border border-cream text-sm bg-white">
              ${Object.entries(NOTE_COLORS).map(([k, v]) => `<option value="${k}">${v.name}</option>`).join('')}
            </select>
          </div>
          <textarea id="note-content" rows="4" required placeholder="Isi catatan..." class="w-full px-3 py-2 rounded-xl border border-cream text-sm bg-white"></textarea>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-cream-pill text-xs font-bold">Batal</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-theme text-white text-xs font-bold">Simpan</button>
          </div>
        </form>
      `);
    }

    function submitNoteForm(e) {
      e.preventDefault();
      state.notes.unshift({
        id: generateId('note'),
        title: document.getElementById('note-title').value.trim(),
        category: document.getElementById('note-cat').value,
        color: document.getElementById('note-color').value,
        content: document.getElementById('note-content').value.trim(),
        pinned: false,
        updatedAt: getTodayISO(),
        createdBy: getActiveUser().name
      });
      saveLocalState(true);
      closeModal();
      renderAll();
    }

    function togglePinNote(id) { const n = state.notes.find(x => x.id === id); if (n) { n.pinned = !n.pinned; saveLocalState(true); renderAll(); } }
    function copyNoteContent(id) { const n = state.notes.find(x => x.id === id); if (n) copyTextToClipboard(`${n.title}\n${n.content}`, 'Catatan disalin!'); }
    function deleteNote(id) { state.notes = state.notes.filter(x => x.id !== id); saveLocalState(true); renderAll(); }

    /* --- Settings CRUD Modals --- */
    function openCategoryModal(defaultType = 'expense', editId = null) {
      const ex = editId ? state.categories.find(c => c.id === editId) : null;
      const type = ex ? ex.type : defaultType;
      openModal(`
        <div class="p-4 border-b border-cream flex justify-between items-center">
          <h4 class="font-extrabold text-sm">${ex ? 'Edit Kategori' : 'Tambah Kategori'}</h4>
          <button onclick="closeModal()" class="p-1 text-[#736D63]"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <form onsubmit="submitCatModal(event, '${editId || ''}')" class="p-4 space-y-3">
          <div class="grid grid-cols-2 gap-2.5">
            <select id="cm-type" class="px-3 py-2 rounded-xl border border-cream text-sm bg-white">
              <option value="expense" ${type === 'expense' ? 'selected' : ''}>Pengeluaran</option>
              <option value="income" ${type === 'income' ? 'selected' : ''}>Pemasukan</option>
            </select>
            <input type="text" id="cm-icon" value="${ex ? escapeHtml(ex.icon) : '🏷️'}" maxlength="4" class="px-3 py-2 rounded-xl border border-cream text-sm text-center bg-white" />
          </div>
          <input type="text" id="cm-name" value="${ex ? escapeHtml(ex.name) : ''}" required placeholder="Nama kategori..." class="w-full px-3 py-2 rounded-xl border border-cream text-sm bg-white" />
          <input type="text" id="cm-hint" value="${ex ? escapeHtml(ex.hint || '') : ''}" placeholder="Petunjuk sub-klasifikasi..." class="w-full px-3 py-2 rounded-xl border border-cream text-sm bg-white" />
          <div class="grid grid-cols-2 gap-2.5">
            <input type="text" id="cm-budget" value="${ex && ex.budget ? formatDotsOnly(ex.budget) : ''}" inputmode="numeric" oninput="formatCurrencyInput(this)" placeholder="Batas anggaran (Rp)" class="px-3 py-2 rounded-xl border border-cream text-sm bg-white" />
            <input type="color" id="cm-color" value="${ex ? ex.color : '#214E2A'}" class="w-full h-10 rounded-xl border border-cream bg-white" />
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-cream-pill text-xs font-bold">Batal</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-theme text-white text-xs font-bold">Simpan</button>
          </div>
        </form>
      `);
    }

    function submitCatModal(e, editId) {
      e.preventDefault();
      const data = {
        type: document.getElementById('cm-type').value,
        icon: document.getElementById('cm-icon').value.trim() || '🏷️',
        name: document.getElementById('cm-name').value.trim(),
        hint: document.getElementById('cm-hint').value.trim(),
        budget: parseRupiah(document.getElementById('cm-budget').value),
        color: document.getElementById('cm-color').value
      };
      if (editId) {
        const idx = state.categories.findIndex(c => c.id === editId);
        if (idx !== -1) state.categories[idx] = { ...state.categories[idx], ...data };
      } else {
        state.categories.push({ id: generateId('cat'), ...data });
      }
      saveLocalState(true);
      closeModal();
      renderAll();
    }
    function deleteCategory(id) { if (state.categories.length > 2) { state.categories = state.categories.filter(c => c.id !== id); saveLocalState(true); renderAll(); } }

    function openAccountModal(editId = null) {
      const ex = editId ? state.accounts.find(a => a.id === editId) : null;
      const classes = ['Rekening Bank', 'Kartu Debit', 'Dompet Tunai', 'E-Wallet / QRIS', 'Kartu Kredit / PayLater'];
      openModal(`
        <div class="p-4 border-b border-cream flex justify-between items-center">
          <h4 class="font-extrabold text-sm">${ex ? 'Edit Wallet' : 'Tambah Wallet / Rekening'}</h4>
          <button onclick="closeModal()" class="p-1 text-[#736D63]"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <form onsubmit="submitAccModal(event, '${editId || ''}')" class="p-4 space-y-3">
          <input type="text" id="am-name" value="${ex ? escapeHtml(ex.name) : ''}" required placeholder="Nama rekening / dompet..." class="w-full px-3 py-2 rounded-xl border border-cream text-sm bg-white" />
          <div class="grid grid-cols-2 gap-2.5">
            <select id="am-class" class="px-3 py-2 rounded-xl border border-cream text-sm bg-white">
              ${classes.map(c => `<option value="${c}" ${ex && ex.classification === c ? 'selected' : ''}>${c}</option>`).join('')}
            </select>
            <input type="text" id="am-prov" value="${ex ? escapeHtml(ex.provider || '') : ''}" placeholder="Bank / Provider" class="px-3 py-2 rounded-xl border border-cream text-sm bg-white" />
          </div>
          <div class="grid grid-cols-3 gap-2">
            <input type="text" id="am-last4" value="${ex ? escapeHtml(ex.last4 || '') : ''}" maxlength="4" inputmode="numeric" placeholder="4 digit akhir" class="px-3 py-2 rounded-xl border border-cream text-sm font-mono bg-white" />
            <select id="am-owner" class="px-3 py-2 rounded-xl border border-cream text-sm bg-white">
              <option value="shared" ${!ex || ex.ownerId === 'shared' ? 'selected' : ''}>🏡 Bersama</option>
              ${state.users.map(u => `<option value="${u.id}" ${ex && ex.ownerId === u.id ? 'selected' : ''}>${u.avatar} ${escapeHtml(u.name)}</option>`).join('')}
            </select>
            <input type="color" id="am-color" value="${ex ? ex.color : '#214E2A'}" class="w-full h-10 rounded-xl border border-cream bg-white" />
          </div>
          <input type="text" id="am-init" value="${ex ? formatDotsOnly(ex.initialBalance) : ''}" inputmode="numeric" oninput="formatCurrencyInput(this)" placeholder="Saldo awal (Rp)" class="w-full px-3 py-2 rounded-xl border border-cream text-sm font-bold bg-white" />
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-cream-pill text-xs font-bold">Batal</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-theme text-white text-xs font-bold">Simpan</button>
          </div>
        </form>
      `);
    }

    function submitAccModal(e, editId) {
      e.preventDefault();
      const data = {
        name: document.getElementById('am-name').value.trim(),
        classification: document.getElementById('am-class').value,
        provider: document.getElementById('am-prov').value.trim() || '-',
        last4: document.getElementById('am-last4').value.replace(/\D/g, '').slice(0, 4),
        ownerId: document.getElementById('am-owner').value,
        color: document.getElementById('am-color').value,
        initialBalance: parseRupiah(document.getElementById('am-init').value)
      };
      if (editId) {
        const idx = state.accounts.findIndex(a => a.id === editId);
        if (idx !== -1) state.accounts[idx] = { ...state.accounts[idx], ...data };
      } else {
        state.accounts.push({ id: generateId('acc'), ...data });
      }
      saveLocalState(true);
      closeModal();
      renderAll();
    }
    function deleteAccount(id) { if (state.accounts.length > 1) { state.accounts = state.accounts.filter(a => a.id !== id); saveLocalState(true); renderAll(); } }

    function openFamilyMemberModal(editId = null) {
      const ex = editId ? state.users.find(u => u.id === editId) : null;
      const avatars = ['👨🏻', '👩🏻', '🧑🏻', '👧🏻', '👴🏻', '👵🏻', '🧕🏻', '🧔🏻'];
      openModal(`
        <div class="p-4 border-b border-cream flex justify-between items-center">
          <h4 class="font-extrabold text-sm">${ex ? 'Edit Anggota' : 'Tambah Anggota Keluarga'}</h4>
          <button onclick="closeModal()" class="p-1 text-[#736D63]"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <form onsubmit="submitMemberModal(event, '${editId || ''}')" class="p-4 space-y-3">
          <input type="text" id="um-name" value="${ex ? escapeHtml(ex.name) : ''}" required placeholder="Nama anggota..." class="w-full px-3 py-2 rounded-xl border border-cream text-sm bg-white" />
          <div class="grid grid-cols-2 gap-2.5">
            <input type="text" id="um-role" value="${ex ? escapeHtml(ex.role || '') : 'Anggota Keluarga'}" class="px-3 py-2 rounded-xl border border-cream text-sm bg-white" />
            <select id="um-avatar" class="px-3 py-2 rounded-xl border border-cream text-lg bg-white">
              ${avatars.map(av => `<option value="${av}" ${ex && ex.avatar === av ? 'selected' : ''}>${av}</option>`).join('')}
            </select>
          </div>
          <input type="text" id="um-pin" value="${ex ? escapeHtml(ex.pin || '') : ''}" maxlength="4" inputmode="numeric" placeholder="PIN 4-digit (Opsional)" class="w-full px-3 py-2 rounded-xl border border-cream text-sm font-mono bg-white" />
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-cream-pill text-xs font-bold">Batal</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-theme text-white text-xs font-bold">Simpan</button>
          </div>
        </form>
      `);
    }

    function submitMemberModal(e, editId) {
      e.preventDefault();
      const pin = (document.getElementById('um-pin').value || '').replace(/\D/g, '').slice(0, 4);
      if (pin.length > 0 && pin.length < 4) { showToast('PIN harus 4 angka atau dikosongkan.', 'error'); return; }
      const data = {
        name: document.getElementById('um-name').value.trim(),
        role: document.getElementById('um-role').value.trim() || 'Anggota',
        avatar: document.getElementById('um-avatar').value,
        pin
      };
      if (editId) {
        const idx = state.users.findIndex(u => u.id === editId);
        if (idx !== -1) state.users[idx] = { ...state.users[idx], ...data };
      } else {
        state.users.push({ id: generateId('usr'), ...data });
      }
      saveLocalState(true);
      closeModal();
      renderAll();
    }

    function deleteFamilyMember(id) {
      if (state.users.length <= 1) return;
      state.users = state.users.filter(u => u.id !== id);
      if (state.activeUserId === id) state.activeUserId = state.users[0].id;
      saveLocalState(true);
      renderAll();
    }

    /* ==================== INSTANT STARTUP INITIALIZATION ==================== */
    document.addEventListener('DOMContentLoaded', () => {
      loadLocalState();
      processDueScheduledTransactions();
      renderAll();
      safeCreateIcons();
      initFirebaseSync();
      registerServiceWorker();
    });
  </script>
</body>
</html>
